  login.message = '§a' + (mode === 'up' ? 'Création du compte…' : 'Connexion…');
  renderLogin();
  try {
    const d = mode === 'up'
      ? await supa('/auth/v1/signup', { method: 'POST', auth: false, body: { email, password } })
      : await supa('/auth/v1/token?grant_type=password', { method: 'POST', auth: false, body: { email, password } });
    if (!d.access_token) {   // inscription avec confirmation d'e-mail activée
      login.message = '§aCompte créé : clique sur le lien reçu par e-mail';
      return;
    }
    session = sessionFrom(d);
    saveSession();
    Object.assign(sync, { at: null, dirty: false });
    saveSyncState();
    closeLogin();
    await afterLogin();
  } catch (e) {
    login.message = loginError(e);
  } finally {
    login.busy = false;
    if (loginOpen()) renderLogin();
  }
}
for (const input of [loginEmail, loginPassword]) {
  input.addEventListener('input', () => { login.message = login.message.startsWith('§a') ? login.message : ''; renderLogin(); });
  input.addEventListener('focus', renderLogin);
  input.addEventListener('blur', renderLogin);
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      if (input === loginEmail) loginPassword.focus(); else submitLogin('in');
    } else if (ev.key === 'Escape') { ev.preventDefault(); closeLogin(); }
  });
}
loginCanvas.addEventListener('mousemove', ev => {
  if (!login.layout) return;
  const { S, btns } = login.layout;
  const eye = login.layout.eye && inRect(ev, login.layout.eye, S);
  const hover = eye ? 'eye' : Object.keys(btns).find(k => inRect(ev, btns[k], S)) || null;
  loginCanvas.style.cursor = hover ? 'pointer' : '';
  if (hover !== login.hover) { login.hover = hover; renderLogin(); }
});
loginCanvas.addEventListener('click', ev => {
  if (!login.layout) return;
  const { S, btns, eye } = login.layout;
  if (eye && inRect(ev, eye, S)) {   // afficher / cacher le mot de passe
    playClick();
    login.showPassword = !login.showPassword;
    loginPassword.type = login.showPassword ? 'text' : 'password';
    loginPassword.focus();
    renderLogin();
  }
  else if (inRect(ev, btns.cancel, S)) { playClick(); closeLogin(); }
  else if (inRect(ev, btns.in, S)) { playClick(); submitLogin('in'); }
  else if (inRect(ev, btns.up, S)) { playClick(); submitLogin('up'); }
});
addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && loginOpen() && !ev.defaultPrevented) closeLogin();
});

// --- Importer une tête : champ façon bloc de commande où l'on colle une commande Minecraft ---
// Commandes acceptées (on y cherche le skin) :
//   /give @p player_head{SkullOwner:{…Properties:{textures:[{Value:"eyJ0…"}]}}}   (jusqu'à la 1.20.4)
//   /give @p player_head[profile={properties:[{name:"textures",value:"eyJ0…"}]}]  (1.20.5 et plus)
//   /give @p player_head{SkullOwner:"Pseudo"} ou [profile="Pseudo"] / [profile={name:"Pseudo"}]
//   ou directement un lien textures.minecraft.net / un pseudo seul.
function skinFromCommand(cmd) {
  const text = cmd.trim();
  const url = s => { const m = s.match(/textures\.minecraft\.net\/texture\/([0-9a-f]{20,})/i); return m && `https://textures.minecraft.net/texture/${m[1]}`; };
  if (url(text)) return url(text);
  for (const [, b64] of text.matchAll(/[Vv]alue\s*[:=]\s*["']?([A-Za-z0-9+/=_-]{20,})/g)) {
    try { const u = url(atob(b64.replace(/-/g, '+').replace(/_/g, '/'))); if (u) return u; } catch {}
  }
  const name = (text.match(/SkullOwner\s*:\s*"?([A-Za-z0-9_]{2,16})\b/)
    || text.match(/profile\s*=\s*"?([A-Za-z0-9_]{2,16})"?\s*[\],]/)
    || text.match(/\bname\s*:\s*"([A-Za-z0-9_]{2,16})"/)
    || text.match(/^([A-Za-z0-9_]{2,16})$/));
  return name ? `https://mc-heads.net/skin/${name[1]}` : null;
}
function loadSkin(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => (img.width >= 64 && img.height >= 32 ? res(img) : rej());
    img.onerror = rej;
    img.src = src;
  });
}
const headScreen = document.getElementById('headScreen');
const headCanvas = document.getElementById('headCanvas');
const headInput = document.getElementById('headInput');
const headImport = { layout: null, hover: null, message: '', busy: false, blink: true, timer: null };
const headOpen = () => !headScreen.hidden;
function openHeadImport() {
  hideTooltip();
  canvas.hidden = true;
  headScreen.hidden = false;
  Object.assign(headImport, { message: '', busy: false, hover: null });
  headInput.value = '';
  clearInterval(headImport.timer);
  headImport.timer = setInterval(() => { headImport.blink = !headImport.blink; renderHeadImport(); }, 300);
  renderHeadImport();
  headInput.focus();
}
function closeHeadImport() {
  clearInterval(headImport.timer);
  headScreen.hidden = true;
  canvas.hidden = false;
  headInput.blur();
  renderGui();
}
function renderHeadImport() {
  const S = signScale();
  const { ctx, W, H } = prepareScreen(headCanvas, S);
  const fw = Math.min(300, W - 16), fx = Math.floor((W - fw) / 2);
  let y = Math.max(4, Math.floor(H / 2) - 40);
  drawText(ctx, font, 'Importe une tête minecraft', fx, y, '#A0A0A0', S);
  const box = [fx, y + 11, fw, 20];
  const fr = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x * S, y * S, w * S, h * S); };
  fr(...box, '#FFFFFF');   // champ du bloc de commande : bord blanc, fond noir
  fr(fx + 1, y + 12, fw - 2, 18, '#000000');
  let text = headInput.value;
  while (text && textWidth(font, text + '_') > fw - 8) text = text.slice(1);   // on garde la fin visible
  drawText(ctx, font, text + (headImport.blink ? '_' : ''), fx + 4, y + 17, '#E0E0E0', S, true);
  y += 36;
  if (headImport.message) drawText(ctx, font, headImport.message, fx, y, headImport.message.startsWith('§a') ? '#55FF55' : '#FF5555', S, true);
  y += 14;
  const half = Math.floor((fw - 4) / 2);
  const btns = { done: [fx, y, half, 20], steve: [fx + fw - half, y, half, 20] };
  drawButton(ctx, ...btns.done.slice(0, 3), 'Terminé', headImport.hover === 'done', S);
  drawButton(ctx, ...btns.steve.slice(0, 3), 'Tête de Steve', headImport.hover === 'steve', S);
  headImport.layout = { S, btns };
  Object.assign(headInput.style, { left: `${box[0] * S}px`, top: `${box[1] * S}px`, width: `${box[2] * S}px`, height: `${box[3] * S}px` });
}
// Terminé : champ vide = on garde la tête actuelle ; sinon on charge le skin trouvé dans la commande.
async function submitHeadImport() {
  if (headImport.busy) return;
  const cmd = headInput.value.trim();
  if (!cmd) { closeHeadImport(); return; }
  const src = skinFromCommand(cmd);
  if (!src) { headImport.message = 'Aucune tête trouvée dans cette commande'; renderHeadImport(); return; }
  headImport.busy = true;
  headImport.message = '§aChargement de la tête…';
  renderHeadImport();
  try {
    const img = await loadSkin(src);
    HEADS.profile = headFaces(img);
    profile.skin = src;
    saveJSON(PROFILE_KEY, profile);
    closeHeadImport();
  } catch {
    headImport.message = 'Impossible de charger cette tête';
  } finally {
    headImport.busy = false;
    if (headOpen()) renderHeadImport();
  }
}
function resetHead() {
  HEADS.profile = headFaces(T.steve);
  delete profile.skin;
  saveJSON(PROFILE_KEY, profile);
  closeHeadImport();
}
headInput.addEventListener('input', () => { headImport.message = ''; renderHeadImport(); });
headInput.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') { ev.preventDefault(); submitHeadImport(); }
  else if (ev.key === 'Escape') { ev.preventDefault(); closeHeadImport(); }
});
headCanvas.addEventListener('mousemove', ev => {
  if (!headImport.layout) return;
  const { S, btns } = headImport.layout;
  const hover = Object.keys(btns).find(k => inRect(ev, btns[k], S)) || null;
  headCanvas.style.cursor = hover ? 'pointer' : '';
  if (hover !== headImport.hover) { headImport.hover = hover; renderHeadImport(); }
});
headCanvas.addEventListener('click', ev => {
  if (!headImport.layout) return;
  const { S, btns } = headImport.layout;
  if (inRect(ev, btns.done, S)) { playClick(); submitHeadImport(); }
  else if (inRect(ev, btns.steve, S)) { playClick(); resetHead(); }
  else headInput.focus();
});

// Taille du canevas du coffre (l'échelle se calcule avec la hauteur maximale pour ne pas changer d'une page à l'autre).
function sizeGui() {
  const L = guiLayout(), maxH = L.mobile ? 18 + (MOBILE_TITLE_LINES - 1) * 9 - 1 + MOBILE_ROWS * 18 + 7 : GUI_H;
  // même échelle avec ou sans barre de défilement (ordinateur : seulement en D.A test, où des listes défilent)
  const maxW = L.mobile ? MOBILE_W + SCROLLBAR_EXTRA : GUI_W + (da === 'test' ? SCROLLBAR_EXTRA : 0);
  const fit = Math.min(viewW() / (maxW + 16), viewH() / (maxH + 16)), R = guiRatio();
  // téléphone : échelle au 1/R près (pixels de l'écran entiers), pour remplir au mieux la hauteur
  state.S = Math.max(2, Math.min(5, Math.floor(fit * R) / R));
  setGuiSize(L);
}
let lastMobile = null;
function resize() {
  // passage portrait / paysage sur téléphone : les pages en grille se recalculent pour la bonne disposition
  if (isMobileLayout() !== lastMobile) {
    const first = lastMobile === null;
    lastMobile = isMobileLayout();
    if (!first) { refreshTodo(); refreshAgenda(); refreshArbres(); }
  }
  sizeGui();
  state.hovered = null;
  tip.hidden = true;
  renderGui();
  if (sign.cfg) renderSign();
  if (dialog.cfg) renderConfirm();
  if (tbOpen()) renderTimeblock();
  if (pg.open && !progScreen.hidden) renderProg();
  if (pvOpen()) renderPhotoPreview();
  if (loginOpen()) renderLogin();
  if (headOpen()) renderHeadImport();
}

async function main() {
  const [textures, accentedChars] = await Promise.all([
    Promise.all(FILES.map(load)),
    fetch(TEX + 'accented.json').then(r => r.json()),
  ]);
  T = Object.fromEntries(textures);
  font = buildFont(T.ascii, T.accented, accentedChars);
  BLOCKS = {
    chest: chestFaces(T.normal),
    crafting_table: { top: T.crafting_table_top, front: T.crafting_table_front, side: T.crafting_table_side },
    barrel: { top: T.barrel_top, front: T.barrel_side, side: T.barrel_side },
    blue_terracotta: { top: T.blue_terracotta, front: T.blue_terracotta, side: T.blue_terracotta },
    green_terracotta: { top: T.green_terracotta, front: T.green_terracotta, side: T.green_terracotta },
    black_terracotta: { top: T.black_terracotta, front: T.black_terracotta, side: T.black_terracotta },
    cyan_terracotta: { top: T.cyan_terracotta, front: T.cyan_terracotta, side: T.cyan_terracotta },
    tnt: { top: T.tnt_top, front: T.tnt_side, side: T.tnt_side },
  };
  refreshArbres();
  buildEtapePages();   // une page par étape de l'Arbre de progression
  refreshAgenda();   // pages « Autres Journées » 2, 3… (créées selon le nombre d'anciens agendas)
  HEADS.profile = headFaces(T.steve);
  HEADS.steve = headFaces(T.steve);   // tête neutre (menu « Modifier le profil »)
  if (profile.skin) loadSkin(profile.skin).then(img => { HEADS.profile = headFaces(img); renderGui(); }, () => {});
  const page = location.hash.slice(1);
  state.page = defaultPage(PAGES[page] ? page : 'main');
  resize();
  addEventListener('resize', resize);
  addEventListener('popstate', showPageFromHash);
  if (state.page === 'progression' || state.page.startsWith('prog-archive-')) openProg();
  canvas.addEventListener('click', onClick);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseleave', onLeave);
  canvas.addEventListener('touchstart', onTouchStart, { passive: true });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd);
  canvas.addEventListener('touchcancel', () => { clearTimeout(press.timer); if (press.long) press.blockUntil = Date.now() + 800; press.long = false; });
  // clic qui suit un appui long (ou arrive pendant) : bloqué avant tout traitement
  const blockLongClick = ev => { if (press.long || Date.now() < press.blockUntil) { ev.stopImmediatePropagation(); ev.preventDefault(); } };
  canvas.addEventListener('click', blockLongClick, true);
  canvas.addEventListener('mousedown', blockLongClick, true);
  canvas.addEventListener('mouseup', blockLongClick, true);
  canvas.addEventListener('contextmenu', ev => ev.preventDefault());
  // Ordinateur : la molette fait défiler les listes ; le curseur de la barre se fait glisser à la souris
  canvas.addEventListener('wheel', ev => {
    if (!scrollInfo()) return;
    ev.preventDefault();
    scrollBy(state.page, ev.deltaY / state.S);
    state.hovered = undefined;
    renderGui();
    onMove(ev);
  }, { passive: false });
  let barDrag = false;
  canvas.addEventListener('mousedown', ev => { if (onScrollbar(ev)) { barDrag = true; scrollFromBar(ev.clientY); ev.preventDefault(); } });
  addEventListener('mousemove', ev => { if (barDrag) scrollFromBar(ev.clientY); });
  addEventListener('mouseup', () => { barDrag = false; });   // pas de menu du navigateur à l'appui long
  markAppReady();
  checkBlockReminders();
  setInterval(checkBlockReminders, 15000);
  cloudCheck();
}

main();
