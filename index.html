// --- Timeblocking : les blocs horaires d'une journée, dans le style Minecraft ---
// Chaque bloc : { debut, fin } en minutes depuis minuit, + titre ; dessiné comme une bulle d'info Minecraft.
// Glisser sur une zone vide = nouveau bloc ; glisser un bloc = le déplacer ; glisser son bord bas = changer
// sa durée ; clic sur un bloc = renommer / supprimer. Molette = défiler dans la journée.
const TB_KEY = 'timeblocks';
const timeblocks = (() => { try { return JSON.parse(localStorage.getItem(TB_KEY)) || {}; } catch { return {}; } })();
const TB_START = 6 * 60, TB_END = 24 * 60, TB_HOUR = 24, TB_SNAP = 15;   // de 6h à minuit, 24 px GUI par heure
const TB_CONTENT = (TB_END - TB_START) * TB_HOUR / 60;
const timeblockScreen = document.getElementById('timeblockScreen');
const timeblockCanvas = document.getElementById('timeblockCanvas');
const tb = { date: null, onClose: null, layout: null, scroll: null, drag: null, hoverDone: false };
const fmtMin = m => `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`;
const tbBlocks = () => timeblocks[tb.date] || [];
// Chaque nouveau bloc prend une couleur de la palette au hasard (différente de celle du dernier bloc créé),
// gardée ensuite même s'il est déplacé.
function randomColor() {
  const blocks = tbBlocks(), last = blocks.length ? (blocks[blocks.length - 1].couleur ?? blocks.length - 1) % TB_COLORS.length : -1;
  let c;
  do c = Math.floor(Math.random() * TB_COLORS.length); while (c === last);
  return c;
}
function saveTimeblocks() {
  for (const d of Object.keys(timeblocks)) if (!timeblocks[d].length) delete timeblocks[d];
  try { localStorage.setItem(TB_KEY, JSON.stringify(timeblocks)); } catch {}
  cloudChanged();
}

// Cadre gris clair façon inventaire (9 tranches de la texture du coffre).
function drawPanel(ctx, x, y, w, h, S) {
  const t = T.generic_54, b = 4;
  const part = (sx, sy, sw, sh, dx, dy, dw, dh) => ctx.drawImage(t, sx, sy, sw, sh, dx * S, dy * S, dw * S, dh * S);
  ctx.fillStyle = '#C6C6C6';
  ctx.fillRect((x + b) * S, (y + b) * S, (w - 2 * b) * S, (h - 2 * b) * S);
  part(0, 0, b, b, x, y, b, b); part(172, 0, b, b, x + w - b, y, b, b);
  part(0, 218, b, b, x, y + h - b, b, b); part(172, 218, b, b, x + w - b, y + h - b, b, b);
  part(b, 0, 1, b, x + b, y, w - 2 * b, b); part(b, 218, 1, b, x + b, y + h - b, w - 2 * b, b);
  part(0, b, b, 1, x, y + b, b, h - 2 * b); part(172, b, b, 1, x + w - b, y + b, b, h - 2 * b);
}
// Couleurs des blocs : palette fournie (24 teintes), dessinées en relief façon Minecraft.
const TB_COLORS = [
  '#9F2757', '#C73361', '#D88277', '#C3291C', '#E25D33', '#DF742D', '#E39835', '#EEC14C',
  '#DFC55A', '#C2CA51', '#88B253', '#397E49', '#5EB47E', '#429488', '#4599DF', '#5384ED',
  '#7C86C6', '#4351AF', '#B09ED7', '#976CAB', '#832DA4', '#74574A', '#616161', '#A59C90',
];
// Assombrit (k < 1) ou éclaircit (k > 1) une couleur #rrggbb.
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(k > 1 ? v + (255 - v) * (k - 1) : v * k)));
  return `rgb(${f(n >> 16)}, ${f((n >> 8) & 255)}, ${f(n & 255)})`;
}
// Bloc coloré dans le style des bulles d'info Minecraft : contour externe sombre aux coins coupés,
// contour interne clair en dégradé (du haut vers le bas), fond de la couleur du bloc.
function drawColorBlock(ctx, x, y, w, h, color, S) {
  const r = (rx, ry, rw, rh, fill) => { if (rw > 0 && rh > 0) { ctx.fillStyle = fill; ctx.fillRect(rx * S, ry * S, rw * S, rh * S); } };
  const outer = shade(color, 0.25);
  r(x + 1, y, w - 2, h, outer);          // contour externe (coins coupés)
  r(x, y + 1, w, h - 2, outer);
  r(x + 1, y + 1, w - 2, h - 2, color);  // fond
  if (h < 5) return;
  const top = shade(color, 1.55), bottom = shade(color, 1.15);
  const grad = ctx.createLinearGradient(0, (y + 1) * S, 0, (y + h - 1) * S);
  grad.addColorStop(0, top);
  grad.addColorStop(1, bottom);
  r(x + 1, y + 1, w - 2, 1, top);        // contour interne en dégradé
  r(x + 1, y + h - 2, w - 2, 1, bottom);
  r(x + 1, y + 2, 1, h - 4, grad);
  r(x + w - 2, y + 2, 1, h - 4, grad);
}
function fitText(text, w) {
  if (textWidth(font, text) <= w) return text;
  while (text && textWidth(font, text + '...') > w) text = text.slice(0, -1);
  return text + '...';
}

function tbScale() {
  // téléphone en portrait : fenêtre plus étroite (voir renderTimeblock) pour un affichage plus grand
  if (isMobileLayout()) return Math.max(1, Math.min(3, Math.floor(viewW() / 190), Math.floor(viewH() / 250)));
  return Math.max(1, Math.min(3, Math.floor(viewW() / 236), Math.floor(viewH() / 250)));
}
function renderTimeblock() {
  const S = tbScale();
  const { ctx, W, H } = prepareScreen(timeblockCanvas, S);
  const TB_TOP = 28;   // hauteur du bandeau de titre au-dessus de la journée
  const pw = Math.min(220, W - 6), ph = Math.min(H - 8, TB_TOP + TB_CONTENT + 36);
  const px = Math.floor((W - pw) / 2), py = Math.max(4, Math.floor((H - ph) / 2));
  const grid = { x: px + 38, y: py + TB_TOP, w: pw - 38 - 8, h: ph - TB_TOP - 34 };
  const maxScroll = Math.max(0, TB_CONTENT - grid.h);
  if (tb.scroll == null) {   // premier affichage : on se place sur le premier bloc (ou 8h)
    const first = Math.min(8 * 60, ...tbBlocks().map(b => b.debut));
    tb.scroll = (first - TB_START) * TB_HOUR / 60 - 4;
  }
  tb.scroll = Math.max(0, Math.min(maxScroll, tb.scroll));
  const yOf = m => grid.y + (m - TB_START) * TB_HOUR / 60 - tb.scroll;

  drawPanel(ctx, px, py, pw, ph, S);
  drawText(ctx, font, 'Timeblock ' + tb.date, px + 8, py + 6, '#404040', S);
  // Zone de la journée, creusée comme une case d'inventaire
  const fr = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x * S, y * S, w * S, h * S); };
  fr(grid.x - 1, grid.y - 1, grid.w + 2, grid.h + 2, '#FFFFFF');
  fr(grid.x - 1, grid.y - 1, grid.w + 1, grid.h + 1, '#373737');
  fr(grid.x, grid.y, grid.w, grid.h, '#8B8B8B');

  ctx.save();
  ctx.beginPath();
  ctx.rect(grid.x * S, grid.y * S, grid.w * S, grid.h * S);
  ctx.clip();
  for (let m = TB_START; m <= TB_END; m += 30) fr(grid.x, yOf(m), grid.w, 1, m % 60 ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.3)');
  const drawBlock = (debut, fin, title, color) => {
    const y1 = yOf(debut), h = yOf(fin) - y1;
    drawColorBlock(ctx, grid.x + 2, y1 + 1, grid.w - 4, h - 1, color, S);
    ctx.save();
    ctx.beginPath();
    ctx.rect((grid.x + 3) * S, (y1 + 2) * S, (grid.w - 6) * S, (h - 3) * S);
    ctx.clip();
    // Horaires toujours affichés : sous le titre si le bloc est assez haut, sinon à sa droite.
    const hours = `${fmtMin(debut)} - ${fmtMin(fin)}`, tx = grid.x + 10, maxW = grid.w - 22;
    if (h >= 28) {
      drawText(ctx, font, fitText(title, maxW), tx, y1 + 7, '#FFFFFF', S, true);
      drawText(ctx, font, hours, tx, y1 + 17, '#E8E8E8', S, true);
    } else {
      const ty = h >= 20 ? y1 + 7 : y1 + Math.floor((h - 8) / 2) + 1;
      const hw = textWidth(font, hours), t = fitText(title, maxW - hw - 8);
      drawText(ctx, font, t, tx, ty, '#FFFFFF', S, true);
      drawText(ctx, font, hours, tx + maxW - hw, ty, '#E8E8E8', S, true);
    }
    ctx.restore();
  };
  const colorOf = (b, i) => TB_COLORS[(b.couleur ?? i) % TB_COLORS.length];
  tbBlocks().forEach((b, i) => { if (!(tb.drag && tb.drag.block === b && tb.drag.moved)) drawBlock(b.debut, b.fin, b.titre, colorOf(b, i)); });
  const d = tb.drag;
  if (d && d.mode === 'create' && d.color == null) d.color = randomColor();
  if (d && d.moved) {   // bloc en cours de création / déplacement : on affiche ses horaires
    const [a, z] = d.mode === 'create' ? [Math.min(d.start, d.end), Math.max(d.start, d.end)] : [d.debut, d.fin];
    const color = d.mode === 'create' ? TB_COLORS[d.color] : colorOf(d.block, tbBlocks().indexOf(d.block));
    drawBlock(a, z, d.mode === 'create' ? 'Nouveau bloc' : d.block.titre, color);
  }
  if (tb.date === formatDate(new Date())) {   // heure actuelle
    const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
    if (m >= TB_START) fr(grid.x, yOf(m), grid.w, 1, '#FF5555');
  }
  ctx.restore();

  // Heures à gauche
  for (let h = TB_START / 60; h <= TB_END / 60; h++) {
    const y = yOf(h * 60) - 3;
    if (y >= grid.y - 4 && y <= grid.y + grid.h - 5) drawText(ctx, font, fmtMin(h * 60), px + 7, y, '#404040', S);
  }
  const btn = [Math.floor(W / 2) - 32, py + ph - 26, 64, 20];
  const photo = [px + pw - 8 - 50, py + ph - 26, 50, 20];   // « Photo » en bas à droite
  drawButton(ctx, btn[0], btn[1], btn[2], 'Terminé', tb.hoverDone, S);
  drawButton(ctx, photo[0], photo[1], photo[2], 'Photo', tb.hoverPhoto, S);
  tb.layout = { S, grid, btn, photo, yOf };
}

// --- « Photo » : image 1179 x 2556 (format d'écran d'iPhone) des blocs de la journée, pour un fond d'écran ---
// Dessinée en pixels GUI (196 x 426) puis agrandie x6 ; toute la journée de 6 h à minuit tient dans l'image.
// Le panneau reste dans la zone visible de l'écran verrouillé : sous la date et l'heure (~25 % du haut),
// au-dessus des boutons lampe / appareil photo (~13 % du bas).
let photoBackground = null;
function loadPhotoBackground() {
  photoBackground ||= new Promise(res => { const img = new Image(); img.onload = () => res(img); img.onerror = () => res(null); img.src = 'assets/background.webp'; });
  return photoBackground;
}
// « Photo » -> aperçu de l'image en fond d'écran d'iPhone -> « Télécharger l'image » -> choix du dossier.
async function timeblockPhoto() {
  const cv = await drawTimeblockPhoto();
  const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
  openPhotoPreview(cv, blob, `timeblock-${tb.date.split('/').reverse().join('-')}.png`);
}
async function drawTimeblockPhoto() {
  const S = 6, W = 196, H = 426;
  const cv = document.createElement('canvas');
  cv.width = 1179;
  cv.height = 2556;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  // Fond : l'image du site, assombrie
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cv.width, cv.height);
  const bg = await loadPhotoBackground();
  if (bg) {
    const k = Math.max(cv.width / bg.width, cv.height / bg.height);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(bg, (cv.width - bg.width * k) / 2, (cv.height - bg.height * k) / 2, bg.width * k, bg.height * k);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, cv.width, cv.height);
  }
  const blocks = tbBlocks();
  const start = TB_START, end = TB_END;   // toute la journée (6 h - minuit), resserrée pour tenir en hauteur

  const px = 6, py = Math.round(H * 0.25), pw = W - 12, ph = Math.round(H * 0.865) - py;   // zone visible de l'écran verrouillé
  drawPanel(ctx, px, py, pw, ph, S);
  drawText(ctx, font, 'Timeblock ' + tb.date, px + 8, py + 6, '#404040', S);
  const grid = { x: px + 36, y: py + 19, w: pw - 36 - 7, h: ph - 19 - 8 };
  const hourH = grid.h * 60 / (end - start);
  const yOf = m => grid.y + (m - start) * hourH / 60;
  const fr = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x * S, y * S, w * S, h * S); };
  fr(grid.x - 1, grid.y - 1, grid.w + 2, grid.h + 2, '#FFFFFF');
  fr(grid.x - 1, grid.y - 1, grid.w + 1, grid.h + 1, '#373737');
  fr(grid.x, grid.y, grid.w, grid.h, '#8B8B8B');
  for (let m = start; m <= end; m += 30) fr(grid.x, Math.round(yOf(m)), grid.w, 1, m % 60 ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.3)');
  for (let m = start; m <= end; m += 60) drawText(ctx, font, fmtMin(m % 1440), px + 7, Math.round(yOf(m)) - 3, '#404040', S);
  blocks.forEach((b, i) => {
    const y1 = Math.round(yOf(b.debut)), h = Math.round(yOf(b.fin)) - y1;
    drawColorBlock(ctx, grid.x + 2, y1 + 1, grid.w - 4, h - 1, TB_COLORS[(b.couleur ?? i) % TB_COLORS.length], S);
    ctx.save();
    ctx.beginPath();
    ctx.rect((grid.x + 3) * S, (y1 + 2) * S, (grid.w - 6) * S, (h - 3) * S);
    ctx.clip();
    const hours = `${fmtMin(b.debut)} - ${fmtMin(b.fin)}`, tx = grid.x + 8, maxW = grid.w - 18;
    if (h >= 26) {
      drawText(ctx, font, fitText(b.titre, maxW), tx, y1 + 5, '#FFFFFF', S, true);
      drawText(ctx, font, hours, tx, y1 + 15, '#E8E8E8', S, true);
    } else {   // bloc court : titre et horaires sur une ligne, centrés ; texte réduit pour tenir dans le bloc
      const s2 = Math.max(2, Math.min(S, Math.floor((h - 3) * S / 8))), k = S / s2;   // k : pixels GUI de la photo -> pixels du texte réduit
      const ty = Math.round((y1 + 0.5 + (h - 8 / k) / 2) * k), hw = textWidth(font, hours);
      drawText(ctx, font, fitText(b.titre, maxW * k - hw - 6), tx * k, ty, '#FFFFFF', s2, true);
      drawText(ctx, font, hours, (tx + maxW) * k - hw, ty, '#E8E8E8', s2, true);
    }
    ctx.restore();
  });

  return cv;
}

// Enregistrement : fenêtre « Enregistrer sous » pour choisir le dossier (Chrome, Edge…), menu de partage sur
// téléphone (« Enregistrer dans Fichiers » permet de choisir le dossier), sinon téléchargement classique.
async function savePhoto(blob, name) {
  const touch = navigator.maxTouchPoints > 0;
  if (!touch && window.showSaveFilePicker) {
    let handle;
    try {
      handle = await window.showSaveFilePicker({
        suggestedName: name, startIn: 'pictures',
        types: [{ description: 'Image PNG', accept: { 'image/png': ['.png'] } }],
      });
    } catch (e) { if (e.name === 'AbortError') return false; }   // fenêtre fermée : on n'enregistre rien
    if (handle) {
      try {
        const out = await handle.createWritable();
        await out.write(blob);
        await out.close();
        return true;
      } catch {}
    }
  }
  const file = new File([blob], name, { type: 'image/png' });
  if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return true; } catch (e) { if (e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  return true;
}

// --- Aperçu : l'image dans un iPhone, avec la date, l'heure et les boutons de l'écran verrouillé par-dessus ---
const photoScreen = document.getElementById('photoScreen');
const photoCanvas = document.getElementById('photoCanvas');
const pv = { img: null, blob: null, name: '', layout: null, hover: null };
const pvOpen = () => !photoScreen.hidden;
function openPhotoPreview(img, blob, name) {
  Object.assign(pv, { img, blob, name, hover: null });
  timeblockScreen.hidden = true;
  photoScreen.hidden = false;
  renderPhotoPreview();
}
function closePhotoPreview() {
  photoScreen.hidden = true;
  pv.img = pv.blob = null;
  showTimeblock();
}
function renderPhotoPreview() {
  const S = tbScale();
  const { ctx, W, H } = prepareScreen(photoCanvas, S);
  // Boutons en bas (pixels GUI), téléphone au-dessus (pixels écran)
  const dlW = 120, backW = 60, gap = 6, by = H - 26;
  const bx = Math.floor((W - dlW - gap - backW) / 2);
  const dl = [bx, by, dlW, 20], back = [bx + dlW + gap, by, backW, 20];
  drawButton(ctx, dl[0], dl[1], dl[2], "Télécharger l'image", pv.hover === 'dl', S);
  drawButton(ctx, back[0], back[1], back[2], 'Retour', pv.hover === 'back', S);
  pv.layout = { S, dl, back };

  const avail = (by - 6) * S - 12;   // hauteur libre au-dessus des boutons, bordure du téléphone comprise
  const ph = Math.min(avail / 1.05, 2556 / 2.4), pw = ph * 1179 / 2556;   // écran du téléphone
  const bez = Math.round(ph * 0.022), x = Math.round((viewW() - pw) / 2), y = Math.round(6 + (avail - ph) / 2);
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
  rr(x - bez - 2, y - bez - 2, pw + 2 * bez + 4, ph + 2 * bez + 4, pw * 0.16 + bez); ctx.fillStyle = '#3A3A3C'; ctx.fill();   // tranche
  rr(x - bez, y - bez, pw + 2 * bez, ph + 2 * bez, pw * 0.16 + bez); ctx.fillStyle = '#000'; ctx.fill();                      // bordure
  ctx.save();
  rr(x, y, pw, ph, pw * 0.14); ctx.clip();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(pv.img, x, y, pw, ph);
  // Éléments de l'écran verrouillé (positions relevées sur une capture d'iPhone)
  const U = pw / 100, sys = '-apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif';
  ctx.fillStyle = '#000';
  rr(x + pw * 0.34, y + ph * 0.012, pw * 0.32, ph * 0.043, ph * 0.022); ctx.fill();   // Dynamic Island
  ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  const [d, m, yy] = tb.date.split('/').map(Number);
  const day = new Date(yy, m - 1, d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  ctx.font = `600 ${5.2 * U}px ${sys}`;
  ctx.fillText(day.charAt(0).toUpperCase() + day.slice(1), x + pw / 2, y + ph * 0.118);
  const now = new Date();
  ctx.font = `700 ${24 * U}px ${sys}`;
  ctx.fillText(`${pad2(now.getHours())}:${pad2(now.getMinutes())}`, x + pw / 2, y + ph * 0.232);
  [0.19, 0.81].forEach(cx => {   // lampe torche / appareil photo
    ctx.beginPath(); ctx.arc(x + pw * cx, y + ph * 0.906, 7.3 * U, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(40, 40, 40, 0.45)'; ctx.fill();
  });
  ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
  rr(x + pw * 0.32, y + ph * 0.973, pw * 0.36, ph * 0.0065, ph * 0.004); ctx.fill();   // barre d'accueil
  ctx.restore();
}
photoCanvas.addEventListener('pointermove', ev => {
  if (!pv.layout) return;
  const h = inRect(ev, pv.layout.dl, pv.layout.S) ? 'dl' : inRect(ev, pv.layout.back, pv.layout.S) ? 'back' : null;
  photoCanvas.style.cursor = h ? 'pointer' : '';
  if (h !== pv.hover) { pv.hover = h; renderPhotoPreview(); }
});
photoCanvas.addEventListener('click', async ev => {

// --- Pop-up Timer : compte à rebours jusqu'à la fin d'un bloc, dans une petite fenêtre qui reste au-dessus
// des autres apps. Chrome / Edge / Arc : vraie mini-fenêtre (Document Picture-in-Picture) qui reste ouverte
// quand on change d'onglet ; Safari / iPhone : mode « image dans l'image » d'une vidéo (le canvas filmé).

function prepareTimer(block) {

    Object.assign(timer, timer.next);

function openTimer() {
  const { block, color, date } = timer.next;
  Object.assign(timer, { block, color, rang: false, end: toDate(date).getTime() + block.fin * 60000 });
  drawTimer();
  if (timer.win) return;   // mini-fenêtre déjà ouverte : elle affiche maintenant ce bloc
  if (timer.floating) { runTimer(window); return; }
  if (window.documentPictureInPicture) {
    documentPictureInPicture.requestWindow({ width: TIMER_W * 2, height: TIMER_H * 2 }).then(win => {
      timer.win = win;
      win.document.title = 'Timer';
      Object.assign(win.document.body.style, { margin: '0', background: '#000', overflow: 'hidden' });
      Object.assign(timer.canvas.style, { display: 'block', width: '100vw', height: '100vh', objectFit: 'contain', imageRendering: 'pixelated' });
      win.document.body.append(timer.canvas);

}

}

  if (timer.loop) { try { timer.loop.win.clearInterval(timer.loop.id); } catch {} }
  timer.loop = null;
  timer.block = null;
  if (timer.win) {

    timer.win = null;

const fmtDuration = ms => {
  const t = Math.ceil(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, sec = t % 60;
  return h ? `${h}:${pad2(m)}:${pad2(sec)}` : `${pad2(m)}:${pad2(sec)}`;
};
function drawTimer() {
  if (!timer.block || !font) return;

  ctx.imageSmoothingEnabled = false;

// Rappel 5 minutes avant chaque bloc du Timeblock du jour (une seule fois par bloc, même après rechargement).
const NOTIFIED_KEY = 'notifs-blocs';
const notified = (() => { try { return JSON.parse(localStorage.getItem(NOTIFIED_KEY)) || {}; } catch { return {}; } })();
function checkBlockReminders() {
  const now = new Date(), today = formatDate(now), minutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  for (const d of Object.keys(notified)) if (d !== today) delete notified[d];   // on ne garde que le jour en cours
  for (const b of timeblocks[today] || []) {

timeblockCanvas.addEventListener('pointerdown', ev => {

    tb.drag = { mode: resize ? 'resize' : 'move', block, debut: block.debut, fin: block.fin, grab: t - block.debut, t0: t, moved: false };
  } else {
    const start = Math.min(TB_END - TB_SNAP, Math.floor((TB_START + (p.y - tb.layout.grid.y + tb.scroll) * 60 / TB_HOUR) / TB_SNAP) * TB_SNAP);

    if (onBtn !== tb.hoverDone) { tb.hoverDone = onBtn; renderTimeblock(); }
    return;
  }
  const t = tbTimeAt(p.y);
  if (t !== d.t0) d.moved = true;
  if (!d.moved) return;
  if (d.mode === 'create') d.end = t === d.start ? d.start + TB_SNAP : t;
  else if (d.mode === 'move') {
    const dur = d.block.fin - d.block.debut;
    d.debut = Math.max(TB_START, Math.min(TB_END - dur, t - d.grab));
    d.fin = d.debut + dur;

});

const SUPABASE_URL = 'https://hzgtnstmmbmmubvzxhas.supabase.co';
const SUPABASE_KEY = 'sb_publishable_HhqBiNcmR0j0doZ_esJrbA_znOLL7Nw';
const SYNC_KEYS = [DATES_KEY, PROFILE_KEY, SERMENTS_KEY, TODO_KEY, TODO_STATS_KEY, ARBRES_KEY, AGENDA_KEY, RESULT_KEY, ACTION_KEY, IDENTITY_KEY, TB_KEY];
let markAppReady;

class CloudError extends Error {}
async function supa(path, { method = 'GET', body, auth = true, headers = {} } = {}) {
  let res;
  try {
    res = await fetch(SUPABASE_URL + path, {
      method,
      headers: {
        apikey: SUPABASE_KEY,
        'Content-Type': 'application/json',
        ...(auth && session ? { Authorization: `Bearer ${session.access_token}` } : {}),
        ...headers,
      },
      body: body && JSON.stringify(body),
    });
  } catch { throw new CloudError('Pas de connexion à internet'); }
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const msg = (data && (data.msg || data.message || data.error_description || data.error)) || `Erreur ${res.status}`;
    const err = new CloudError(msg);
    err.status = res.status;
    err.code = data && (data.error_code || data.code);
    throw err;
  }
  return data;
}
function sessionFrom(d) {
  return {
    access_token: d.access_token, refresh_token: d.refresh_token,
    expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600),
    user: { id: d.user.id, email: d.user.email },
  };
}

async function freshSession() {
  if (!session) return null;
  if (session.expires_at * 1000 - 60000 > Date.now()) return session;
  try {
    session = sessionFrom(await supa('/auth/v1/token?grant_type=refresh_token', { method: 'POST', auth: false, body: { refresh_token: session.refresh_token } }));
    saveSession();
  } catch (e) {
    if (e.status >= 400 && e.status < 500) { session = null; saveSession(); }
    throw e;
  }
  return session;
}

  (loginEmail.value ? loginPassword : loginEmail).focus();
}
function closeLogin() {
  clearInterval(login.timer);
  loginScreen.hidden = true;
  canvas.hidden = false;
  loginEmail.blur();
  loginPassword.blur();
  renderGui();
}
function renderLogin() {
  const S = signScale();
  const { ctx, W, H } = prepareScreen(loginCanvas, S);
  const fw = Math.min(200, W - 16), fx = Math.floor((W - fw) / 2);
  let y = Math.max(4, Math.floor(H / 2) - 86);
  const centered = (text, y, color) => drawText(ctx, font, text, Math.floor(W / 2 - textWidth(font, text) / 2), y, color, S, true);
  centered('Connexion', y, '#FFFFFF');
  centered('Sauvegarde tes données en ligne', y + 14, '#A0A0A0');
  y += 34;
  const fields = [];
  let eye = null;
  for (const [input, label, secret] of [[loginEmail, 'E-mail', false], [loginPassword, 'Mot de passe', true]]) {
    drawText(ctx, font, label, fx, y, '#A0A0A0', S);
    const box = [fx, y + 11, fw, 20];
    const fr = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x * S, y * S, w * S, h * S); };
    const focused = document.activeElement === input;
    fr(...box, focused ? '#FFFFFF' : '#A0A0A0');   // champ de texte de Minecraft : bord clair, fond noir
    fr(box[0] + 1, box[1] + 1, fw - 2, 18, '#000000');
    let text = secret && !login.showPassword ? '*'.repeat(input.value.length) : input.value;
    const room = fw - 8 - (secret ? 16 : 0);   // place du texte (moins le bouton œil)
    while (text && textWidth(font, text + '_') > room) text = text.slice(1);   // on garde la fin visible
    if (secret) {   // bouton œil au bout du champ : barré quand le mot de passe est caché
      eye = [fx + fw - 18, box[1] + 1, 17, 18];
      drawEye(ctx, eye[0] + 2, eye[1] + 5, !login.showPassword, login.hover === 'eye' ? '#FFFFFF' : '#A0A0A0', S);
    }
    drawText(ctx, font, text + (focused && login.blink ? '_' : ''), fx + 4, y + 17, '#E0E0E0', S, true);
    fields.push([input, box]);
    y += 38;
  }
  if (login.message) centered(login.message, y, login.message.startsWith('§a') ? '#55FF55' : '#FF5555');
  y += 14;
  const half = Math.floor((fw - 4) / 2);
  const btns = { in: [fx, y, half, 20], up: [fx + fw - half, y, half, 20], cancel: [fx, y + 24, fw, 20] };
  drawButton(ctx, ...btns.in.slice(0, 3), 'Se connecter', login.hover === 'in', S);
  drawButton(ctx, ...btns.up.slice(0, 3), 'Créer un compte', login.hover === 'up', S);
  drawButton(ctx, ...btns.cancel.slice(0, 3), 'Annuler', login.hover === 'cancel', S);
  login.layout = { S, btns, eye };
  for (const [input, [x, y, w, h]] of fields) {   // le champ du mot de passe s'arrête avant l'œil (clic sur le canvas)
    const iw = input === loginPassword ? w - 18 : w;
    Object.assign(input.style, { left: `${x * S}px`, top: `${y * S}px`, width: `${iw * S}px`, height: `${h * S}px` });
  }
}
// Œil en pixels (13 x 7), barré en diagonale si « crossed »
const EYE_PIXELS = [
  '....#####....',
  '..##.....##..',
  '.#...###...#.',
  '#...#####...#',
  '.#...###...#.',
  '..##.....##..',
  '....#####....',
];
function drawEye(ctx, x, y, crossed, color, S) {
  ctx.fillStyle = color;
  EYE_PIXELS.forEach((row, j) => [...row].forEach((c, i) => { if (c === '#') ctx.fillRect((x + i) * S, (y + j) * S, S, S); }));
  if (!crossed) return;
  for (let i = 0; i <= 10; i++) {   // trait en diagonale, détouré de noir pour se détacher de l'œil
    const px = x + 1 + i, py = y + 7 - Math.round(i * 0.8);
    ctx.fillStyle = '#000000';
    ctx.fillRect(px * S, (py + 1) * S, S, S);
    ctx.fillStyle = color;
    ctx.fillRect(px * S, py * S, S, S);
  }
}
const LOGIN_ERRORS = [
  [/invalid login credentials|invalid_credentials/i, 'E-mail ou mot de passe incorrect'],
  [/email not confirmed|email_not_confirmed/i, "Confirme d'abord ton e-mail (lien reçu)"],
  [/already registered|user_already_exists/i, 'Un compte existe déjà avec cet e-mail'],
  [/password should be at least|weak_password/i, 'Mot de passe trop court (6 caractères min.)'],
  [/unable to validate email|invalid format|email_address_invalid/i, 'Adresse e-mail invalide'],
  [/rate limit|over_email_send_rate_limit|over_request_rate_limit/i, 'Trop d\'essais, réessaie dans un moment'],
  [/internet/i, 'Pas de connexion à internet'],
];
const loginError = e => (LOGIN_ERRORS.find(([re]) => re.test(`${e.message} ${e.code || ''}`)) || [0, 'Erreur : ' + e.message])[1];
async function submitLogin(mode) {
  if (login.busy) return;
  const email = loginEmail.value.trim(), password = loginPassword.value;
  if (!email || !password) { login.message = 'Remplis l\'e-mail et le mot de passe'; renderLogin(); return; }
  login.busy = true;
  login.message = '§a' + (mode === 'up' ? 'Création du compte…' : 'Connexion…');
  renderLogin();
  try {
    const d = mode === 'up'
      ? await supa('/auth/v1/signup', { method: 'POST', auth: false, body: { email, password } })
      : await supa('/auth/v1/token?grant_type=password', { method: 'POST', auth: false, body: { email, password } });
    if (!d.access_token) {   // inscription avec confirmation d'e-mail activée
      login.message = '§aCompte créé : clique sur le lien reçu par e-mail';
      return;
    }
    session = sessionFrom(d);
    saveSession();
    Object.assign(sync, { at: null, dirty: false });
    saveSyncState();
    closeLogin();
    await afterLogin();
  } catch (e) {
    login.message = loginError(e);
  } finally {
    login.busy = false;
    if (loginOpen()) renderLogin();
  }
}
for (const input of [loginEmail, loginPassword]) {
  input.addEventListener('input', () => { login.message = login.message.startsWith('§a') ? login.message : ''; renderLogin(); });
  input.addEventListener('focus', renderLogin);
  input.addEventListener('blur', renderLogin);
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      if (input === loginEmail) loginPassword.focus(); else submitLogin('in');
    } else if (ev.key === 'Escape') { ev.preventDefault(); closeLogin(); }
  });
}
loginCanvas.addEventListener('mousemove', ev => {
  if (!login.layout) return;
  const { S, btns } = login.layout;
  const eye = login.layout.eye && inRect(ev, login.layout.eye, S);
  const hover = eye ? 'eye' : Object.keys(btns).find(k => inRect(ev, btns[k], S)) || null;
  loginCanvas.style.cursor = hover ? 'pointer' : '';
  if (hover !== login.hover) { login.hover = hover; renderLogin(); }
});
loginCanvas.addEventListener('click', ev => {
  if (!login.layout) return;
  const { S, btns, eye } = login.layout;
  if (eye && inRect(ev, eye, S)) {   // afficher / cacher le mot de passe
    playClick();
    login.showPassword = !login.showPassword;
    loginPassword.type = login.showPassword ? 'text' : 'password';
    loginPassword.focus();
    renderLogin();
  }
  else if (inRect(ev, btns.cancel, S)) { playClick(); closeLogin(); }
  else if (inRect(ev, btns.in, S)) { playClick(); submitLogin('in'); }
  else if (inRect(ev, btns.up, S)) { playClick(); submitLogin('up'); }
});
addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && loginOpen() && !ev.defaultPrevented) closeLogin();
});

// --- Importer une tête : champ façon bloc de commande où l'on colle une commande Minecraft ---
// Commandes acceptées (on y cherche le skin) :
//   /give @p player_head{SkullOwner:{…Properties:{textures:[{Value:"eyJ0…"}]}}}   (jusqu'à la 1.20.4)
//   /give @p player_head[profile={properties:[{name:"textures",value:"eyJ0…"}]}]  (1.20.5 et plus)
//   /give @p player_head{SkullOwner:"Pseudo"} ou [profile="Pseudo"] / [profile={name:"Pseudo"}]
//   ou directement un lien textures.minecraft.net / un pseudo seul.
function skinFromCommand(cmd) {
  const text = cmd.trim();
  const url = s => { const m = s.match(/textures\.minecraft\.net\/texture\/([0-9a-f]{20,})/i); return m && `https://textures.minecraft.net/texture/${m[1]}`; };
  if (url(text)) return url(text);
  for (const [, b64] of text.matchAll(/[Vv]alue\s*[:=]\s*["']?([A-Za-z0-9+/=_-]{20,})/g)) {
    try { const u = url(atob(b64.replace(/-/g, '+').replace(/_/g, '/'))); if (u) return u; } catch {}
  }
  const name = (text.match(/SkullOwner\s*:\s*"?([A-Za-z0-9_]{2,16})\b/)
    || text.match(/profile\s*=\s*"?([A-Za-z0-9_]{2,16})"?\s*[\],]/)
    || text.match(/\bname\s*:\s*"([A-Za-z0-9_]{2,16})"/)
    || text.match(/^([A-Za-z0-9_]{2,16})$/));
  return name ? `https://mc-heads.net/skin/${name[1]}` : null;
}
function loadSkin(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => (img.width >= 64 && img.height >= 32 ? res(img) : rej());
    img.onerror = rej;
    img.src = src;
  });
}
const headScreen = document.getElementById('headScreen');
const headCanvas = document.getElementById('headCanvas');
const headInput = document.getElementById('headInput');
const headImport = { layout: null, hover: null, message: '', busy: false, blink: true, timer: null };
const headOpen = () => !headScreen.hidden;
function openHeadImport() {
  hideTooltip();
  canvas.hidden = true;
  headScreen.hidden = false;
  Object.assign(headImport, { message: '', busy: false, hover: null });
  headInput.value = '';
  clearInterval(headImport.timer);
  headImport.timer = setInterval(() => { headImport.blink = !headImport.blink; renderHeadImport(); }, 300);
  renderHeadImport();
  headInput.focus();
}
function closeHeadImport() {
  clearInterval(headImport.timer);
  headScreen.hidden = true;
  canvas.hidden = false;
  headInput.blur();
  renderGui();
}
function renderHeadImport() {
  const S = signScale();
  const { ctx, W, H } = prepareScreen(headCanvas, S);
  const fw = Math.min(300, W - 16), fx = Math.floor((W - fw) / 2);
  let y = Math.max(4, Math.floor(H / 2) - 40);
  drawText(ctx, font, 'Importe une tête minecraft', fx, y, '#A0A0A0', S);
  const box = [fx, y + 11, fw, 20];
  const fr = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x * S, y * S, w * S, h * S); };
  fr(...box, '#FFFFFF');   // champ du bloc de commande : bord blanc, fond noir
  fr(fx + 1, y + 12, fw - 2, 18, '#000000');
  let text = headInput.value;
  while (text && textWidth(font, text + '_') > fw - 8) text = text.slice(1);   // on garde la fin visible
  drawText(ctx, font, text + (headImport.blink ? '_' : ''), fx + 4, y + 17, '#E0E0E0', S, true);
  y += 36;
  if (headImport.message) drawText(ctx, font, headImport.message, fx, y, headImport.message.startsWith('§a') ? '#55FF55' : '#FF5555', S, true);
  y += 14;
  const half = Math.floor((fw - 4) / 2);
  const btns = { done: [fx, y, half, 20], steve: [fx + fw - half, y, half, 20] };
  drawButton(ctx, ...btns.done.slice(0, 3), 'Terminé', headImport.hover === 'done', S);
  drawButton(ctx, ...btns.steve.slice(0, 3), 'Tête de Steve', headImport.hover === 'steve', S);
  headImport.layout = { S, btns };
  Object.assign(headInput.style, { left: `${box[0] * S}px`, top: `${box[1] * S}px`, width: `${box[2] * S}px`, height: `${box[3] * S}px` });
}
// Terminé : champ vide = on garde la tête actuelle ; sinon on charge le skin trouvé dans la commande.
async function submitHeadImport() {
  if (headImport.busy) return;
  const cmd = headInput.value.trim();
  if (!cmd) { closeHeadImport(); return; }
  const src = skinFromCommand(cmd);
  if (!src) { headImport.message = 'Aucune tête trouvée dans cette commande'; renderHeadImport(); return; }
  headImport.busy = true;
  headImport.message = '§aChargement de la tête…';
  renderHeadImport();
  try {
    const img = await loadSkin(src);
    HEADS.profile = headFaces(img);
    profile.skin = src;
    saveJSON(PROFILE_KEY, profile);
    closeHeadImport();
  } catch {
    headImport.message = 'Impossible de charger cette tête';
  } finally {
    headImport.busy = false;
    if (headOpen()) renderHeadImport();
  }
}
function resetHead() {
  HEADS.profile = headFaces(T.steve);
  delete profile.skin;
  saveJSON(PROFILE_KEY, profile);
  closeHeadImport();
}
headInput.addEventListener('input', () => { headImport.message = ''; renderHeadImport(); });
headInput.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') { ev.preventDefault(); submitHeadImport(); }
  else if (ev.key === 'Escape') { ev.preventDefault(); closeHeadImport(); }
});
headCanvas.addEventListener('mousemove', ev => {
  if (!headImport.layout) return;
  const { S, btns } = headImport.layout;
  const hover = Object.keys(btns).find(k => inRect(ev, btns[k], S)) || null;
  headCanvas.style.cursor = hover ? 'pointer' : '';
  if (hover !== headImport.hover) { headImport.hover = hover; renderHeadImport(); }
});
headCanvas.addEventListener('click', ev => {
  if (!headImport.layout) return;
  const { S, btns } = headImport.layout;
  if (inRect(ev, btns.done, S)) { playClick(); submitHeadImport(); }
  else if (inRect(ev, btns.steve, S)) { playClick(); resetHead(); }
  else headInput.focus();
});

// Taille du canevas du coffre (l'échelle se calcule avec la hauteur maximale pour ne pas changer d'une page à l'autre).
function sizeGui() {
  const L = guiLayout(), maxH = L.mobile ? 18 + (MOBILE_TITLE_LINES - 1) * 9 - 1 + MOBILE_ROWS * 18 + 7 : GUI_H;
  const fit = Math.min(viewW() / (L.w + 16), viewH() / (maxH + 16)), R = guiRatio();
  // téléphone : échelle au 1/R près (pixels de l'écran entiers), pour remplir au mieux la hauteur
  state.S = Math.max(2, Math.min(5, Math.floor(fit * R) / R));
  setGuiSize(L);
}
let lastMobile = null;
function resize() {
  // passage portrait / paysage sur téléphone : les pages en grille se recalculent pour la bonne disposition
  if (isMobileLayout() !== lastMobile) {
    const first = lastMobile === null;
    lastMobile = isMobileLayout();
    if (!first) { refreshTodo(); refreshAgenda(); refreshArbres(); }
  }
  sizeGui();
  state.hovered = null;
  tip.hidden = true;
  renderGui();
  if (sign.cfg) renderSign();
  if (dialog.cfg) renderConfirm();
  if (tbOpen()) renderTimeblock();
  if (pvOpen()) renderPhotoPreview();
  if (loginOpen()) renderLogin();
  if (headOpen()) renderHeadImport();
}

  const page = location.hash.slice(1);
