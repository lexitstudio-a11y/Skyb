  centered(dialog.cfg.question, y, '#FFFFFF');
  y += 16;
  for (const line of lines) { centered(line, y, '#AAAAAA'); y += 10; }
  const bw = Math.min(dialog.cfg.buttonWidth || 90, Math.floor((W - 20) / 2)), by = y + 14;
  const no = [Math.floor(W / 2) - bw - 4, by, bw, 20], yes = [Math.floor(W / 2) + 4, by, bw, 20];
  // Sous Non / Oui, sur toute leur largeur : « Modifier » (si prévu) puis « Supprimer ».
  let rowY = by + 24;
  const edit = dialog.cfg.onEdit ? [no[0], rowY, 2 * bw + 8, 20] : null;
  if (edit) rowY += 24;
  const del = [no[0], rowY, 2 * bw + 8, 20];
  drawButton(ctx, ...no.slice(0, 3), dialog.cfg.noLabel || 'Non', dialog.hover === 'no', S);
  drawButton(ctx, ...yes.slice(0, 3), dialog.cfg.yesLabel || 'Oui', dialog.hover === 'yes', S);
  if (edit) drawButton(ctx, ...edit.slice(0, 3), dialog.cfg.editLabel || 'Modifier le titre', dialog.hover === 'edit', S);
  if (dialog.cfg.onDelete) drawButton(ctx, ...del.slice(0, 3), '§cSupprimer', dialog.hover === 'del', S);
  dialog.layout = { S, no, yes, edit, del: dialog.cfg.onDelete ? del : null };
}
function openConfirm(cfg) {
  dialog.cfg = cfg;
  dialog.hover = null;
  hideTooltip();
  canvas.hidden = true;
  dialogScreen.hidden = false;
  renderConfirm();
}
function closeConfirm() {
  dialogScreen.hidden = true;
  canvas.hidden = false;
  dialog.cfg = null;
  renderGui();
}
dialogCanvas.addEventListener('mousemove', ev => {
  const { S, no, yes, edit, del } = dialog.layout;
  const hover = inRect(ev, no, S) ? 'no' : inRect(ev, yes, S) ? 'yes' : edit && inRect(ev, edit, S) ? 'edit' : del && inRect(ev, del, S) ? 'del' : null;
  dialogCanvas.style.cursor = hover ? 'pointer' : '';
  if (hover !== dialog.hover) { dialog.hover = hover; renderConfirm(); }
});
dialogCanvas.addEventListener('click', ev => {
  const { S, no, yes, edit, del } = dialog.layout;
  const cfg = dialog.cfg;
  if (edit && inRect(ev, edit, S)) { playClick(); closeConfirm(); cfg.onEdit(); return; }
  if (inRect(ev, no, S)) { playClick(); closeConfirm(); if (cfg.onNo) cfg.onNo(); }
  else if (inRect(ev, yes, S)) { playClick(); closeConfirm(); cfg.onYes(); }
  else if (del && inRect(ev, del, S)) { playClick(); closeConfirm(); cfg.onDelete(); }
});
addEventListener('keydown', ev => {
  if (ev.key !== 'Escape' || !dialog.cfg) return;
  ev.preventDefault();
  const cfg = dialog.cfg;
  closeConfirm();
  if (cfg.onCancel) cfg.onCancel();
});

// --- Timeblocking : les blocs horaires d'une journée, dans le style Minecraft ---
// Chaque bloc : { debut, fin } en minutes depuis minuit, + titre ; dessiné comme une bulle d'info Minecraft.
// Glisser sur une zone vide = nouveau bloc ; glisser un bloc = le déplacer ; glisser son bord bas = changer
// sa durée ; clic sur un bloc = renommer / supprimer. Molette = défiler dans la journée.
const TB_KEY = 'timeblocks';
const timeblocks = (() => { try { return JSON.parse(localStorage.getItem(TB_KEY)) || {}; } catch { return {}; } })();
const TB_START = 6 * 60, TB_END = 24 * 60, TB_HOUR = 24, TB_SNAP = 15;   // de 6h à minuit, 24 px GUI par heure
const TB_CONTENT = (TB_END - TB_START) * TB_HOUR / 60;
const timeblockScreen = document.getElementById('timeblockScreen');
const timeblockCanvas = document.getElementById('timeblockCanvas');
const tb = { date: null, onClose: null, layout: null, scroll: null, drag: null, hoverDone: false };
const fmtMin = m => `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`;
const tbBlocks = () => timeblocks[tb.date] || [];
// Chaque nouveau bloc prend une couleur de la palette au hasard (différente de celle du dernier bloc créé),
// gardée ensuite même s'il est déplacé.
function randomColor() {
  const blocks = tbBlocks(), last = blocks.length ? (blocks[blocks.length - 1].couleur ?? blocks.length - 1) % TB_COLORS.length : -1;
  let c;
  do c = Math.floor(Math.random() * TB_COLORS.length); while (c === last);
  return c;
}
function saveTimeblocks() {
  for (const d of Object.keys(timeblocks)) if (!timeblocks[d].length) delete timeblocks[d];
  try { localStorage.setItem(TB_KEY, JSON.stringify(timeblocks)); } catch {}
  cloudChanged();
}

// Cadre gris clair façon inventaire (9 tranches de la texture du coffre).
function drawPanel(ctx, x, y, w, h, S) {
  const t = T.generic_54, b = 4;
  const part = (sx, sy, sw, sh, dx, dy, dw, dh) => ctx.drawImage(t, sx, sy, sw, sh, dx * S, dy * S, dw * S, dh * S);
  ctx.fillStyle = '#C6C6C6';
  ctx.fillRect((x + b) * S, (y + b) * S, (w - 2 * b) * S, (h - 2 * b) * S);
  part(0, 0, b, b, x, y, b, b); part(172, 0, b, b, x + w - b, y, b, b);
  part(0, 218, b, b, x, y + h - b, b, b); part(172, 218, b, b, x + w - b, y + h - b, b, b);
  part(b, 0, 1, b, x + b, y, w - 2 * b, b); part(b, 218, 1, b, x + b, y + h - b, w - 2 * b, b);
  part(0, b, b, 1, x, y + b, b, h - 2 * b); part(172, b, b, 1, x + w - b, y + b, b, h - 2 * b);
}
// Couleurs des blocs : palette fournie (24 teintes), dessinées en relief façon Minecraft.
const TB_COLORS = [
  '#9F2757', '#C73361', '#D88277', '#C3291C', '#E25D33', '#DF742D', '#E39835', '#EEC14C',
  '#DFC55A', '#C2CA51', '#88B253', '#397E49', '#5EB47E', '#429488', '#4599DF', '#5384ED',
  '#7C86C6', '#4351AF', '#B09ED7', '#976CAB', '#832DA4', '#74574A', '#616161', '#A59C90',
];
// Assombrit (k < 1) ou éclaircit (k > 1) une couleur #rrggbb.
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(k > 1 ? v + (255 - v) * (k - 1) : v * k)));
  return `rgb(${f(n >> 16)}, ${f((n >> 8) & 255)}, ${f(n & 255)})`;
}
// Bloc coloré dans le style des bulles d'info Minecraft : contour externe sombre aux coins coupés,
// contour interne clair en dégradé (du haut vers le bas), fond de la couleur du bloc.
function drawColorBlock(ctx, x, y, w, h, color, S) {
  const r = (rx, ry, rw, rh, fill) => { if (rw > 0 && rh > 0) { ctx.fillStyle = fill; ctx.fillRect(rx * S, ry * S, rw * S, rh * S); } };
  const outer = shade(color, 0.25);
  r(x + 1, y, w - 2, h, outer);          // contour externe (coins coupés)
  r(x, y + 1, w, h - 2, outer);
  r(x + 1, y + 1, w - 2, h - 2, color);  // fond
  if (h < 5) return;
  const top = shade(color, 1.55), bottom = shade(color, 1.15);
  const grad = ctx.createLinearGradient(0, (y + 1) * S, 0, (y + h - 1) * S);
  grad.addColorStop(0, top);
  grad.addColorStop(1, bottom);
  r(x + 1, y + 1, w - 2, 1, top);        // contour interne en dégradé
  r(x + 1, y + h - 2, w - 2, 1, bottom);
  r(x + 1, y + 2, 1, h - 4, grad);
  r(x + w - 2, y + 2, 1, h - 4, grad);
}
function fitText(text, w) {
  if (textWidth(font, text) <= w) return text;
  while (text && textWidth(font, text + '...') > w) text = text.slice(0, -1);
  return text + '...';
}

function tbScale() {
  return Math.max(1, Math.min(3, Math.floor(viewW() / 236), Math.floor(viewH() / 250)));
}
function renderTimeblock() {
  const S = tbScale();
  const { ctx, W, H } = prepareScreen(timeblockCanvas, S);
  const TB_TOP = 28;   // hauteur du bandeau de titre au-dessus de la journée
  const pw = 220, ph = Math.min(H - 8, TB_TOP + TB_CONTENT + 36);
  const px = Math.floor((W - pw) / 2), py = Math.max(4, Math.floor((H - ph) / 2));
  const grid = { x: px + 38, y: py + TB_TOP, w: pw - 38 - 8, h: ph - TB_TOP - 34 };
  const maxScroll = Math.max(0, TB_CONTENT - grid.h);
  if (tb.scroll == null) {   // premier affichage : on se place sur le premier bloc (ou 8h)
    const first = Math.min(8 * 60, ...tbBlocks().map(b => b.debut));
    tb.scroll = (first - TB_START) * TB_HOUR / 60 - 4;
  }
  tb.scroll = Math.max(0, Math.min(maxScroll, tb.scroll));
  const yOf = m => grid.y + (m - TB_START) * TB_HOUR / 60 - tb.scroll;

  drawPanel(ctx, px, py, pw, ph, S);
  drawText(ctx, font, 'Timeblock ' + tb.date, px + 8, py + 6, '#404040', S);
  // Zone de la journée, creusée comme une case d'inventaire
  const fr = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x * S, y * S, w * S, h * S); };
  fr(grid.x - 1, grid.y - 1, grid.w + 2, grid.h + 2, '#FFFFFF');
  fr(grid.x - 1, grid.y - 1, grid.w + 1, grid.h + 1, '#373737');
  fr(grid.x, grid.y, grid.w, grid.h, '#8B8B8B');

  ctx.save();
  ctx.beginPath();
  ctx.rect(grid.x * S, grid.y * S, grid.w * S, grid.h * S);
  ctx.clip();
  for (let m = TB_START; m <= TB_END; m += 30) fr(grid.x, yOf(m), grid.w, 1, m % 60 ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.3)');
  const drawBlock = (debut, fin, title, color) => {
    const y1 = yOf(debut), h = yOf(fin) - y1;
    drawColorBlock(ctx, grid.x + 2, y1 + 1, grid.w - 4, h - 1, color, S);
    ctx.save();
    ctx.beginPath();
    ctx.rect((grid.x + 3) * S, (y1 + 2) * S, (grid.w - 6) * S, (h - 3) * S);
    ctx.clip();
    // Horaires toujours affichés : sous le titre si le bloc est assez haut, sinon à sa droite.
    const hours = `${fmtMin(debut)} - ${fmtMin(fin)}`, tx = grid.x + 10, maxW = grid.w - 22;
    if (h >= 28) {
      drawText(ctx, font, fitText(title, maxW), tx, y1 + 7, '#FFFFFF', S, true);
      drawText(ctx, font, hours, tx, y1 + 17, '#E8E8E8', S, true);
    } else {
      const ty = h >= 20 ? y1 + 7 : y1 + Math.floor((h - 8) / 2) + 1;
      const hw = textWidth(font, hours), t = fitText(title, maxW - hw - 8);
      drawText(ctx, font, t, tx, ty, '#FFFFFF', S, true);
      drawText(ctx, font, hours, tx + maxW - hw, ty, '#E8E8E8', S, true);
    }
    ctx.restore();
  };
  const colorOf = (b, i) => TB_COLORS[(b.couleur ?? i) % TB_COLORS.length];
  tbBlocks().forEach((b, i) => { if (!(tb.drag && tb.drag.block === b && tb.drag.moved)) drawBlock(b.debut, b.fin, b.titre, colorOf(b, i)); });
  const d = tb.drag;
  if (d && d.mode === 'create' && d.color == null) d.color = randomColor();
  if (d && d.moved) {   // bloc en cours de création / déplacement : on affiche ses horaires
    const [a, z] = d.mode === 'create' ? [Math.min(d.start, d.end), Math.max(d.start, d.end)] : [d.debut, d.fin];
    const color = d.mode === 'create' ? TB_COLORS[d.color] : colorOf(d.block, tbBlocks().indexOf(d.block));
    drawBlock(a, z, d.mode === 'create' ? 'Nouveau bloc' : d.block.titre, color);
  }
  if (tb.date === formatDate(new Date())) {   // heure actuelle
    const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
    if (m >= TB_START) fr(grid.x, yOf(m), grid.w, 1, '#FF5555');
  }
  ctx.restore();

  // Heures à gauche
  for (let h = TB_START / 60; h <= TB_END / 60; h++) {
    const y = yOf(h * 60) - 3;
    if (y >= grid.y - 4 && y <= grid.y + grid.h - 5) drawText(ctx, font, fmtMin(h * 60), px + 7, y, '#404040', S);
  }
  const btn = [Math.floor(W / 2) - 32, py + ph - 26, 64, 20];
  const photo = [px + pw - 8 - 50, py + ph - 26, 50, 20];   // « Photo » en bas à droite
  drawButton(ctx, btn[0], btn[1], btn[2], 'Terminé', tb.hoverDone, S);
  drawButton(ctx, photo[0], photo[1], photo[2], 'Photo', tb.hoverPhoto, S);
  tb.layout = { S, grid, btn, photo, yOf };
}

// --- « Photo » : image 1179 x 2556 (format d'écran d'iPhone) des blocs de la journée, pour un fond d'écran ---
// Dessinée en pixels GUI (196 x 426) puis agrandie x6 ; toute la journée de 6 h à minuit tient dans l'image.
// Le panneau reste dans la zone visible de l'écran verrouillé : sous la date et l'heure (~25 % du haut),
// au-dessus des boutons lampe / appareil photo (~13 % du bas).
let photoBackground = null;
function loadPhotoBackground() {
  photoBackground ||= new Promise(res => { const img = new Image(); img.onload = () => res(img); img.onerror = () => res(null); img.src = 'assets/background.webp'; });
  return photoBackground;
}
// « Photo » -> aperçu de l'image en fond d'écran d'iPhone -> « Télécharger l'image » -> choix du dossier.
async function timeblockPhoto() {
  const cv = await drawTimeblockPhoto();
  const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
  openPhotoPreview(cv, blob, `timeblock-${tb.date.split('/').reverse().join('-')}.png`);
}
async function drawTimeblockPhoto() {
  const S = 6, W = 196, H = 426;
  const cv = document.createElement('canvas');
  cv.width = 1179;
  cv.height = 2556;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  // Fond : l'image du site, assombrie
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cv.width, cv.height);
  const bg = await loadPhotoBackground();
  if (bg) {
    const k = Math.max(cv.width / bg.width, cv.height / bg.height);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(bg, (cv.width - bg.width * k) / 2, (cv.height - bg.height * k) / 2, bg.width * k, bg.height * k);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, cv.width, cv.height);
  }
  const blocks = tbBlocks();
  const start = TB_START, end = TB_END;   // toute la journée (6 h - minuit), resserrée pour tenir en hauteur

  const px = 6, py = Math.round(H * 0.25), pw = W - 12, ph = Math.round(H * 0.865) - py;   // zone visible de l'écran verrouillé
  drawPanel(ctx, px, py, pw, ph, S);
  drawText(ctx, font, 'Timeblock ' + tb.date, px + 8, py + 6, '#404040', S);
  const grid = { x: px + 36, y: py + 19, w: pw - 36 - 7, h: ph - 19 - 8 };
  const hourH = grid.h * 60 / (end - start);
  const yOf = m => grid.y + (m - start) * hourH / 60;
  const fr = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x * S, y * S, w * S, h * S); };
  fr(grid.x - 1, grid.y - 1, grid.w + 2, grid.h + 2, '#FFFFFF');
  fr(grid.x - 1, grid.y - 1, grid.w + 1, grid.h + 1, '#373737');
  fr(grid.x, grid.y, grid.w, grid.h, '#8B8B8B');
  for (let m = start; m <= end; m += 30) fr(grid.x, Math.round(yOf(m)), grid.w, 1, m % 60 ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.3)');
  for (let m = start; m <= end; m += 60) drawText(ctx, font, fmtMin(m % 1440), px + 7, Math.round(yOf(m)) - 3, '#404040', S);
  blocks.forEach((b, i) => {
    const y1 = Math.round(yOf(b.debut)), h = Math.round(yOf(b.fin)) - y1;
    drawColorBlock(ctx, grid.x + 2, y1 + 1, grid.w - 4, h - 1, TB_COLORS[(b.couleur ?? i) % TB_COLORS.length], S);
    ctx.save();
    ctx.beginPath();
    ctx.rect((grid.x + 3) * S, (y1 + 2) * S, (grid.w - 6) * S, (h - 3) * S);
    ctx.clip();
    const hours = `${fmtMin(b.debut)} - ${fmtMin(b.fin)}`, tx = grid.x + 8, maxW = grid.w - 18;
    if (h >= 26) {
      drawText(ctx, font, fitText(b.titre, maxW), tx, y1 + 5, '#FFFFFF', S, true);
      drawText(ctx, font, hours, tx, y1 + 15, '#E8E8E8', S, true);
    } else {   // bloc court : titre et horaires sur une ligne, centrés ; texte réduit pour tenir dans le bloc
      const s2 = Math.max(2, Math.min(S, Math.floor((h - 3) * S / 8))), k = S / s2;   // k : pixels GUI de la photo -> pixels du texte réduit
      const ty = Math.round((y1 + 0.5 + (h - 8 / k) / 2) * k), hw = textWidth(font, hours);
      drawText(ctx, font, fitText(b.titre, maxW * k - hw - 6), tx * k, ty, '#FFFFFF', s2, true);
      drawText(ctx, font, hours, (tx + maxW) * k - hw, ty, '#E8E8E8', s2, true);
    }
    ctx.restore();
  });

  return cv;
}

// Enregistrement : fenêtre « Enregistrer sous » pour choisir le dossier (Chrome, Edge…), menu de partage sur
// téléphone (« Enregistrer dans Fichiers » permet de choisir le dossier), sinon téléchargement classique.
async function savePhoto(blob, name) {
  const touch = navigator.maxTouchPoints > 0;
  if (!touch && window.showSaveFilePicker) {
    let handle;
    try {
      handle = await window.showSaveFilePicker({
        suggestedName: name, startIn: 'pictures',
        types: [{ description: 'Image PNG', accept: { 'image/png': ['.png'] } }],
      });
    } catch (e) { if (e.name === 'AbortError') return false; }   // fenêtre fermée : on n'enregistre rien
    if (handle) {
      try {
        const out = await handle.createWritable();
        await out.write(blob);
        await out.close();
        return true;
      } catch {}
    }
  }
  const file = new File([blob], name, { type: 'image/png' });
  if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return true; } catch (e) { if (e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  return true;
}

// --- Aperçu : l'image dans un iPhone, avec la date, l'heure et les boutons de l'écran verrouillé par-dessus ---
const photoScreen = document.getElementById('photoScreen');
const photoCanvas = document.getElementById('photoCanvas');
const pv = { img: null, blob: null, name: '', layout: null, hover: null };
const pvOpen = () => !photoScreen.hidden;
function openPhotoPreview(img, blob, name) {
  Object.assign(pv, { img, blob, name, hover: null });
  timeblockScreen.hidden = true;
  photoScreen.hidden = false;
  renderPhotoPreview();
}
function closePhotoPreview() {
  photoScreen.hidden = true;
  pv.img = pv.blob = null;
  showTimeblock();
}
function renderPhotoPreview() {
  const S = tbScale();
  const { ctx, W, H } = prepareScreen(photoCanvas, S);
  // Boutons en bas (pixels GUI), téléphone au-dessus (pixels écran)
  const dlW = 120, backW = 60, gap = 6, by = H - 26;
  const bx = Math.floor((W - dlW - gap - backW) / 2);
  const dl = [bx, by, dlW, 20], back = [bx + dlW + gap, by, backW, 20];
  drawButton(ctx, dl[0], dl[1], dl[2], "Télécharger l'image", pv.hover === 'dl', S);
  drawButton(ctx, back[0], back[1], back[2], 'Retour', pv.hover === 'back', S);
  pv.layout = { S, dl, back };

  const avail = (by - 6) * S - 12;   // hauteur libre au-dessus des boutons, bordure du téléphone comprise
  const ph = Math.min(avail / 1.05, 2556 / 2.4), pw = ph * 1179 / 2556;   // écran du téléphone
  const bez = Math.round(ph * 0.022), x = Math.round((viewW() - pw) / 2), y = Math.round(6 + (avail - ph) / 2);
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
  rr(x - bez - 2, y - bez - 2, pw + 2 * bez + 4, ph + 2 * bez + 4, pw * 0.16 + bez); ctx.fillStyle = '#3A3A3C'; ctx.fill();   // tranche
  rr(x - bez, y - bez, pw + 2 * bez, ph + 2 * bez, pw * 0.16 + bez); ctx.fillStyle = '#000'; ctx.fill();                      // bordure
  ctx.save();
  rr(x, y, pw, ph, pw * 0.14); ctx.clip();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(pv.img, x, y, pw, ph);
  // Éléments de l'écran verrouillé (positions relevées sur une capture d'iPhone)
  const U = pw / 100, sys = '-apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif';
  ctx.fillStyle = '#000';
  rr(x + pw * 0.34, y + ph * 0.012, pw * 0.32, ph * 0.043, ph * 0.022); ctx.fill();   // Dynamic Island
  ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  const [d, m, yy] = tb.date.split('/').map(Number);
  const day = new Date(yy, m - 1, d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  ctx.font = `600 ${5.2 * U}px ${sys}`;
  ctx.fillText(day.charAt(0).toUpperCase() + day.slice(1), x + pw / 2, y + ph * 0.118);
  const now = new Date();
  ctx.font = `700 ${24 * U}px ${sys}`;
  ctx.fillText(`${pad2(now.getHours())}:${pad2(now.getMinutes())}`, x + pw / 2, y + ph * 0.232);
  [0.19, 0.81].forEach(cx => {   // lampe torche / appareil photo
    ctx.beginPath(); ctx.arc(x + pw * cx, y + ph * 0.906, 7.3 * U, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(40, 40, 40, 0.45)'; ctx.fill();
  });
  ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
  rr(x + pw * 0.32, y + ph * 0.973, pw * 0.36, ph * 0.0065, ph * 0.004); ctx.fill();   // barre d'accueil
  ctx.restore();
}
photoCanvas.addEventListener('pointermove', ev => {
  if (!pv.layout) return;
  const h = inRect(ev, pv.layout.dl, pv.layout.S) ? 'dl' : inRect(ev, pv.layout.back, pv.layout.S) ? 'back' : null;
  photoCanvas.style.cursor = h ? 'pointer' : '';
  if (h !== pv.hover) { pv.hover = h; renderPhotoPreview(); }
});
photoCanvas.addEventListener('click', async ev => {
  if (!pv.layout) return;
  if (inRect(ev, pv.layout.back, pv.layout.S)) { playClick(); closePhotoPreview(); return; }
  if (inRect(ev, pv.layout.dl, pv.layout.S)) {
    playClick();
    if (await savePhoto(pv.blob, pv.name)) closePhotoPreview();
  }
});
addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && pvOpen()) { ev.preventDefault(); closePhotoPreview(); }
});

function openTimeblock(date, onClose) {
  tb.date = date;
  tb.onClose = onClose;
  tb.scroll = null;
  showTimeblock();
}
function showTimeblock() {
  hideTooltip();
  canvas.hidden = true;
  timeblockScreen.hidden = false;
  tb.drag = null;
  renderTimeblock();
}
function hideTimeblock() {
  timeblockScreen.hidden = true;
}
function closeTimeblock(callBack = true) {
  const done = tb.onClose;
  hideTimeblock();
  tb.date = null;
  canvas.hidden = false;
  renderGui();
  if (callBack && done) done();
}
const tbOpen = () => tb.date && !timeblockScreen.hidden;

function tbPoint(ev) {
  const { S } = tb.layout;
  return { x: evX(ev) / S, y: evY(ev) / S };
}
function tbTimeAt(y) {
  const { grid } = tb.layout;
  const m = TB_START + (y - grid.y + tb.scroll) * 60 / TB_HOUR;
  return Math.max(TB_START, Math.min(TB_END, Math.round(m / TB_SNAP) * TB_SNAP));
}
function tbInGrid(p) {
  const { grid } = tb.layout;
  return p.x >= grid.x && p.x < grid.x + grid.w && p.y >= grid.y && p.y < grid.y + grid.h;
}
function tbBlockAt(p) {
  const { yOf } = tb.layout;
  return [...tbBlocks()].reverse().find(b => p.y >= yOf(b.debut) && p.y < yOf(b.fin));
}
// Titre d'un bloc (nouveau ou existant) sur un panneau ; retour ensuite au Timeblock.
function editBlockTitle(block, isNew) {
  hideTimeblock();
  openSign({
    title: isNew ? 'Nouveau bloc' : 'Renommer le bloc',
    lines: 2, fixed: ['', '', '^^^^^^^^^^^^', `${fmtMin(block.debut)} - ${fmtMin(block.fin)}`],
    initial: isNew ? '' : block.titre,
    onDone: text => {
      block.titre = text.split('\n').map(l => l.trim()).filter(Boolean).join(' ') || '(Sans titre)';
      if (isNew) (timeblocks[tb.date] ||= []).push(block);
      saveTimeblocks();
      showTimeblock();
    },
    onCancel: showTimeblock,
  });
}
function blockMenu(block) {
  hideTimeblock();
  prepareTimer(block);   // la vidéo du timer doit déjà tourner au moment du clic (exigence du navigateur)
  openConfirm({
    question: block.titre,
    detail: [`De ${fmtMin(block.debut)} à ${fmtMin(block.fin)}`],
    noLabel: 'Renommer', yesLabel: 'Retour',
    editLabel: 'Pop-up Timer',
    onEdit: () => { openTimer(); showTimeblock(); },
    onNo: () => editBlockTitle(block, false),
    onYes: showTimeblock,
    onCancel: showTimeblock,
    onDelete: () => {
      const list = timeblocks[tb.date] || [];
      list.splice(list.indexOf(block), 1);
      saveTimeblocks();
      showTimeblock();
    },
  });
}

// --- Pop-up Timer : compte à rebours jusqu'à la fin d'un bloc, dans une petite fenêtre qui reste au-dessus
// des autres apps. Chrome / Edge / Arc : vraie mini-fenêtre (Document Picture-in-Picture) qui reste ouverte
// quand on change d'onglet ; Safari / iPhone : mode « image dans l'image » d'une vidéo (le canvas filmé).
// Sans l'un ni l'autre (Firefox…), le timer flotte en haut à droite de l'app ; un clic dessus le ferme.
const TIMER_W = 120, TIMER_H = 50, TIMER_S = 4;
const timer = { canvas: null, video: null, win: null, block: null, color: null, end: 0, loop: null, rang: false, floating: false };
function prepareTimer(block) {
  if (!timer.canvas) {
    timer.canvas = document.createElement('canvas');
    timer.canvas.width = TIMER_W * TIMER_S;
    timer.canvas.height = TIMER_H * TIMER_S;
    timer.canvas.id = 'timerCanvas';
    timer.canvas.addEventListener('click', () => { if (timer.floating) closeTimer(); });
    const video = timer.video = document.createElement('video');
    video.muted = true;
    video.playsInline = true;
    video.id = 'timerVideo';
    video.addEventListener('leavepictureinpicture', closeTimer);
    document.body.append(video);
  }
  const list = timeblocks[tb.date] || [];
  const color = TB_COLORS[(block.couleur ?? list.indexOf(block)) % TB_COLORS.length];
  Object.assign(timer, { next: { block, color, date: tb.date } });
  if (!timer.block) {   // aucun timer ouvert : on prépare l'image de celui-ci
    Object.assign(timer, timer.next);
    drawTimer();
  }
  if (timer.canvas.captureStream && !timer.video.srcObject) {
    timer.video.srcObject = timer.canvas.captureStream();
    timer.video.play().catch(() => {});
  }
}
function openTimer() {
  const { block, color, date } = timer.next;
  Object.assign(timer, { block, color, rang: false, end: toDate(date).getTime() + block.fin * 60000 });
  drawTimer();
  if (timer.win) return;   // mini-fenêtre déjà ouverte : elle affiche maintenant ce bloc
  if (timer.floating) { runTimer(window); return; }
  if (window.documentPictureInPicture) {
    documentPictureInPicture.requestWindow({ width: TIMER_W * 2, height: TIMER_H * 2 }).then(win => {
      timer.win = win;
      win.document.title = 'Timer';
      Object.assign(win.document.body.style, { margin: '0', background: '#000', overflow: 'hidden' });
      Object.assign(timer.canvas.style, { display: 'block', width: '100vw', height: '100vh', objectFit: 'contain', imageRendering: 'pixelated' });
      win.document.body.append(timer.canvas);
      win.addEventListener('pagehide', closeTimer);
      runTimer(win);   // la mini-fenêtre est visible : ses minuteurs ne sont pas ralentis quand l'onglet est caché
    }).catch(videoTimer);
  } else videoTimer();
}
function runTimer(win) {
  if (timer.loop) timer.loop.win.clearInterval(timer.loop.id);
  timer.loop = { win, id: win.setInterval(drawTimer, 250) };
}
function videoTimer() {
  runTimer(window);
  const pip = document.pictureInPictureEnabled && timer.video.srcObject && timer.video.requestPictureInPicture;
  if (pip) timer.video.requestPictureInPicture().catch(floatTimer);
  else floatTimer();
}
function floatTimer() {
  timer.floating = true;
  document.body.append(timer.canvas);
}
function closeTimer() {

class CloudError extends Error {}
async function supa(path, { method = 'GET', body, auth = true, headers = {} } = {}) {
  let res;
  try {
    res = await fetch(SUPABASE_URL + path, {
      method,
      headers: {
        apikey: SUPABASE_KEY,
        'Content-Type': 'application/json',
        ...(auth && session ? { Authorization: `Bearer ${session.access_token}` } : {}),
        ...headers,
      },
      body: body && JSON.stringify(body),
    });
  } catch { throw new CloudError('Pas de connexion à internet'); }
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const msg = (data && (data.msg || data.message || data.error_description || data.error)) || `Erreur ${res.status}`;
    const err = new CloudError(msg);
    err.status = res.status;
    err.code = data && (data.error_code || data.code);
    throw err;
  }
  return data;
}
function sessionFrom(d) {
  return {
    access_token: d.access_token, refresh_token: d.refresh_token,
    expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600),
    user: { id: d.user.id, email: d.user.email },
  };
}

  if (!session) return null;
  if (session.expires_at * 1000 - 60000 > Date.now()) return session;
  try {
    session = sessionFrom(await supa('/auth/v1/token?grant_type=refresh_token', { method: 'POST', auth: false, body: { refresh_token: session.refresh_token } }));
    saveSession();
  } catch (e) {
    if (e.status >= 400 && e.status < 500) { session = null; saveSession(); }
    throw e;
  }
  return session;
}

  for (const k of SYNC_KEYS) {

    green_terracotta: { top: T.green_terracotta, front: T.green_terracotta, side: T.green_terracotta },
    black_terracotta: { top: T.black_terracotta, front: T.black_terracotta, side: T.black_terracotta },
    cyan_terracotta: { top: T.cyan_terracotta, front: T.cyan_terracotta, side: T.cyan_terracotta },
    tnt: { top: T.tnt_top, front: T.tnt_side, side: T.tnt_side },
  };
  const page = location.hash.slice(1);
  state.page = PAGES[page] ? page : 'main';
  resize();
  addEventListener('resize', resize);
  addEventListener('popstate', showPageFromHash);
  canvas.addEventListener('click', onClick);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseleave', onLeave);
  markAppReady();
  cloudCheck();
}

main();
</script>
</body>
</html>
