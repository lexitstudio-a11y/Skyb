  const t = ev.touches[0];
  if (t && Math.hypot(t.clientX - press.x, t.clientY - press.y) > 10) clearTimeout(press.timer);
  if (t && press.bar) { ev.preventDefault(); scrollFromBar(t.clientY); return; }
  const d = press.drag;
  if (!t || !d || press.long) return;
  if (!d.moving && Math.abs(t.clientY - press.y) > 8) { d.moving = true; d.y = t.clientY; clearTimeout(press.timer); }
  if (!d.moving) return;
  ev.preventDefault();
  const dy = (d.y - t.clientY) / state.S, now = performance.now();
  d.v = dy / Math.max(1, now - d.t) * 0.6 + d.v * 0.4;   // vitesse (pixels du GUI par ms), lissée
  d.y = t.clientY; d.t = now;
  scrollBy(state.page, dy);
  renderGui();
}
function onTouchEnd(ev) {
  clearTimeout(press.timer);
  if (press.bar) { press.bar = false; ev.preventDefault(); press.blockUntil = Date.now() + 400; return; }
  const d = press.drag;
  press.drag = null;
  if (d && d.moving) {
    ev.preventDefault();
    press.blockUntil = Date.now() + 400;   // pas de clic à la fin d'un glissement
    if (performance.now() - d.t > 80) return;   // doigt arrêté avant le lâcher : pas d'élan
    fling.v = d.v; fling.page = state.page;
    let last = performance.now();
    const step = now => {
      if (state.page !== fling.page || Math.abs(fling.v) < 0.01) return;
      const dt = Math.min(32, now - last); last = now;
      const edge = scrollBy(fling.page, fling.v * dt);
      fling.v *= Math.pow(0.995, dt);
      renderGui();
      if (!edge) fling.raf = requestAnimationFrame(step);
    };
    fling.raf = requestAnimationFrame(step);
    return;
  }
  if (press.long) {   // pas de clic (ni de survol) simulé après un appui long
    ev.preventDefault();
    press.long = false;
    press.blockUntil = Date.now() + 800;   // certains navigateurs envoient quand même le clic : il est ignoré
  }
}

function hideTooltip() {
  state.hovered = null;
  tip.hidden = true;
  canvas.style.cursor = '';
}

// Navigation entre pages via l'ancre de l'URL (#serments), pour que "Précédent" du navigateur marche.
function showPageFromHash() {
  if (sign.cfg) closeSign();
  if (dialog.cfg) closeConfirm();
  if (tb.date) closeTimeblock(false);
  const page = location.hash.slice(1);
  state.page = defaultPage(PAGES[page] ? page : 'main');
  if (state.page === 'progression' || state.page.startsWith('prog-archive-')) { openProg(); return; }   // écran à part (fond de pierre, étapes)
  if (pg.open) closeProg();
  headMenu.open = false;
  hideTooltip();
  if (state.page.startsWith('todo')) refreshTodo();   // retire les actions terminées depuis 30 jours
  if (state.page.startsWith('agenda')) refreshAgenda();   // les agendas de plus de 7 jours changent de page
  renderGui();
}

// Son d'un bouton d'interface Minecraft (ui.button.click = random/click_stereo, volume 0.25 en jeu).
const clickSound = new Audio('assets/sounds/button.mp3');
clickSound.preload = 'auto';
clickSound.volume = 0.25;
// Son joué quand une action de la liste de choses à faire est terminée.
const doneSound = new Audio('assets/sounds/action-terminee.wav');
doneSound.preload = 'auto';
doneSound.volume = 0.6;
function playSound(sound) {
  const s = sound.cloneNode();   // clone : permet des sons rapprochés qui se chevauchent
  s.volume = sound.volume;
  s.play().catch(() => {});
}
const playClick = () => {};   // plus de son au clic sur les boutons (clickSound gardé si on veut le remettre)

function onClick(ev) {
  if (press.long || Date.now() < press.blockUntil) return;   // téléphone : lâcher d'un appui long
  if (headMenuClick(ev)) return;   // D.A test (téléphone) : tête et son menu
  if (tabClick(ev)) return;   // D.A test (téléphone) : onglets du bas
  const slot = itemAt(slotAt(ev));
  if (!slot) return;
  playClick();
  if (slot.action) { slot.action(); return; }
  if (!slot.open) return;
  if (slot.open === 'main') history.pushState(null, '', location.pathname + location.search);
  else location.hash = slot.open;
  showPageFromHash();
}

// --- Panneau de saisie (comme l'écran d'édition de panneau de Minecraft) ---
// openSign(cfg) : cfg = {
//   title   : titre affiché au-dessus du panneau,
//   lines   : nombre de lignes modifiables (en haut du panneau, 1 à 4),
//   fixed   : textes des lignes non modifiables (index 0 à 3),
//   initial : texte de départ (lignes séparées par \n),
//   numeric : clavier numérique + chiffres seulement,  transform(text) : mise en forme pendant la frappe,
//   validate(text) : false = saisie refusée (affichée en rouge),  onDone(text) : appelé après « Terminé » }
const signScreen = document.getElementById('signScreen');
const signCanvas = document.getElementById('signCanvas');
const signInput = document.getElementById('signInput');
const sign = { cfg: null, error: false, hoverDone: false, blinkOn: true, timer: null, layout: null };
const SIGN_W = 90;   // largeur max d'une ligne de texte sur le panneau (pixels GUI)

// Fait tenir le texte dans le panneau : une ligne trop longue passe à la ligne suivante
// (coupure au dernier espace si possible), et ce qui dépasse la dernière ligne est coupé.
// caret = position du curseur, ajustée si des caractères sont ajoutés ou retirés avant lui.
function fitSignText(text, caret = text.length) {
  if (sign.cfg.book) {   // livre : retour à la ligne visuel seulement ; au-delà de la page, on coupe la fin
    while (bookRows(text).length > bookCapacity(sign.cfg)) text = text.slice(0, -1);
    return { text, caret: Math.min(caret, text.length) };
  }
  const max = sign.cfg.lines, SIGN_TEXT_W = sign.cfg.width || SIGN_W;
  for (let guard = 0; guard < 200; guard++) {
    const lines = text.split('\n');
    const i = lines.findIndex(l => textWidth(font, l) > SIGN_TEXT_W);
    if (i < 0) break;
    const start = lines.slice(0, i).reduce((n, l) => n + l.length + 1, 0), line = lines[i];
    let k = 0;
    while (k < line.length && textWidth(font, line.slice(0, k + 1)) <= SIGN_TEXT_W) k++;
    if (lines.length < max) {
      const sp = line.lastIndexOf(' ', k);
      if (sp > 0) text = text.slice(0, start + sp) + '\n' + text.slice(start + sp + 1);   // espace -> retour à la ligne
      else { text = text.slice(0, start + k) + '\n' + text.slice(start + k); if (caret > start + k) caret++; }
    } else {
      const cut = line.length - k;   // plus de ligne libre : on coupe
      text = text.slice(0, start + k) + text.slice(start + line.length);
      if (caret > start + k) caret = Math.max(start + k, caret - cut);
    }
  }
  const lines = text.split('\n');
  if (lines.length > max) text = lines.slice(0, max).join('\n');
  return { text, caret: Math.min(caret, text.length) };
}

function signScale() {
  return Math.max(1, Math.min(5, Math.floor(viewH() / 215), Math.floor(viewW() / 112)));
}

function renderSign() {
  const cfg = sign.cfg;
  if (cfg.book) return renderBook();
  const S = signScale();
  signCanvas.width = viewW();
  signCanvas.height = viewH();
  const ctx = signCanvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const W = Math.floor(viewW() / S), H = Math.floor(viewH() / S);
  ctx.fillStyle = 'rgba(16, 16, 16, 0.35)';
  ctx.fillRect(0, 0, signCanvas.width, signCanvas.height);
  const centered = (text, y, color, shadow) => drawText(ctx, font, text, Math.floor(W / 2 - textWidth(font, text) / 2), y, color, S, shadow);

  const top = Math.max(8, Math.floor((H - 200) / 2));
  centered(cfg.title, top, '#FFFFFF', true);

  // Panneau en chêne : face avant (24x12 texels) + poteau (2x14 texels), agrandis 4x.
  const bx = Math.floor(W / 2) - 48, by = top + 28;
  ctx.drawImage(T.oak, 2, 2, 24, 12, bx * S, by * S, 96 * S, 48 * S);
  ctx.drawImage(T.oak, 2, 16, 2, 14, (Math.floor(W / 2) - 4) * S, (by + 48) * S, 8 * S, 56 * S);

  // Ligne active = celle du curseur, encadrée par > <, avec un curseur clignotant.
  const text = signInput.value;
  const caret = signInput.selectionStart ?? text.length;
  const before = text.slice(0, caret).split('\n');
  const activeLine = before.length - 1, col = before[activeLine].length;
  const typed = text.split('\n');
  for (let i = 0; i < 4; i++) {
    const y = by + 5 + i * 10;
    const color = sign.error && i < cfg.lines ? '#AA0000' : '#000000';
    if (i >= cfg.lines) { if (cfg.fixed[i]) centered(cfg.fixed[i], y, '#000000', false); continue; }
    const line = typed[i] || '';
    if (i !== activeLine) { centered(line, y, color, false); continue; }
    const atEnd = col === line.length;
    const shown = `> ${line}${atEnd ? (sign.blinkOn ? '_' : ' ') : ''} <`;
    centered(shown, y, color, false);
    if (!atEnd && sign.blinkOn) {   // curseur au milieu du texte : barre verticale
      const x = Math.floor(W / 2 - textWidth(font, shown) / 2) + textWidth(font, '> ' + line.slice(0, col)) - 1;
      ctx.fillStyle = color;
      ctx.fillRect(x * S, (y - 1) * S, S, 9 * S);
    }
  }

  const btnW = Math.min(200, W - 16);
  const btnX = Math.floor(W / 2) - Math.floor(btnW / 2), btnY = Math.min(H - 24, by + 48 + 56 + 16);
  drawButton(ctx, btnX, btnY, btnW, 'Terminé', sign.hoverDone, S);

  sign.layout = { S, board: [bx, by, 96, 48], button: [btnX, btnY, btnW, 20] };
  Object.assign(signInput.style, { left: bx * S + 'px', top: by * S + 'px', width: 96 * S + 'px', height: 48 * S + 'px' });
}

// --- Livre (comme l'écran d'écriture d'un livre de Minecraft) ---
// Même saisie que le panneau (cfg.book = true) ; un gros point est dessiné devant chaque ligne écrite.
const BOOK_LINES = 14, BOOK_TEXT_W = 104;
const BOOK_PAGES = 50;   // quand une page est pleine, le texte continue sur la suivante (flèches pour naviguer)
const bookCapacity = cfg => cfg.lines * BOOK_PAGES;
// Lignes d'écriture disponibles sous un titre (un titre sur plusieurs lignes en prend).
const bookLinesFor = title => BOOK_LINES - (wrapText(title, 118).length - 1);
// Découpe le texte en lignes affichées : un objectif (ligne du texte) trop long continue sur la ligne
// suivante (coupure entre les mots), sans nouveau point. Renvoie [{ text, start, bullet }].
function bookRows(text) {
  const rows = [];
  let offset = 0;
  for (const line of text.split('\n')) {
    let pos = 0, first = true;
    do {
      let end = line.length;
      if (textWidth(font, line.slice(pos)) > BOOK_TEXT_W) {
        end = pos;
        while (end < line.length && textWidth(font, line.slice(pos, end + 1)) <= BOOK_TEXT_W) end++;
        const sp = line.lastIndexOf(' ', end);
        if (sp > pos) end = sp + 1;   // coupe après l'espace
      }
      rows.push({ text: line.slice(pos, end), start: offset + pos, bullet: first && line.trim() !== '' });
      pos = end;
      first = false;
    } while (pos < line.length);
    offset += line.length + 1;
  }
  return rows;
}
function renderBook() {
  const cfg = sign.cfg;
  // téléphone en portrait : le livre (192 de large) peut occuper presque toute la largeur
  const S = Math.max(1, Math.min(5, Math.floor(viewH() / 228), Math.floor(viewW() / (isMobileLayout() ? 194 : 200))));
  const { ctx, W, H } = prepareScreen(signCanvas, S);
  const left = Math.floor((W - 192) / 2), top = Math.max(2, Math.floor((H - 222) / 2));
  ctx.drawImage(T.book_gui, 0, 0, 192, 192, left * S, top * S, 192 * S, 192 * S);
  // Titre en haut de la page (à la place de « Page 1 of 1 »), centré ; un titre long passe sur plusieurs lignes
  // et le texte commence d'autant plus bas.
  const titleLines = wrapText(cfg.title, 118);
  titleLines.forEach((l, i) => drawText(ctx, font, l, left + 94 - Math.floor(textWidth(font, l) / 2), top + 16 + i * 9, '#000000', S));
  const textTop = top + 32 + (titleLines.length - 1) * 9;

  const text = signInput.value, rows = bookRows(text);
  const caret = signInput.selectionStart ?? text.length;
  // ligne affichée qui contient le curseur (la dernière qui commence avant lui)
  let active = 0;
  rows.forEach((r, i) => { if (r.start <= caret) active = i; });
  const tx = left + 36 + (cfg.noBullets ? 0 : 8);
  // Pages : la page affichée est celle du curseur ; ligne i -> page floor(i / lignes par page).
  const per = cfg.lines, page = Math.floor(active / per), pages = Math.max(1, Math.ceil(rows.length / per));
  const onPage = i => i >= page * per && i < (page + 1) * per;
  const rowY = i => textTop + (i - page * per) * 9;
  // Exemples en filigrane (cfg.placeholders) : l'exemple n°k est affiché tant que la ligne n°k n'est pas écrite ;
  // les exemples restants se placent sous le texte déjà écrit.
  if (cfg.placeholders) {
    const lines = text.split('\n');
    const lastEmpty = !lines[lines.length - 1].trim();
    const written = lines.filter(l => l.trim()).length;   // les lignes sautées (Maj + Entrée) ne consomment pas d'exemple
    const firstRow = lastEmpty ? rows.length - 1 : rows.length;
    const ph = cfg.placeholders.slice(written).flatMap(ex => wrapText(ex, BOOK_TEXT_W).map((t, j) => ({ t, bullet: j === 0 })));
    ph.forEach((p, j) => {
      const i = firstRow + j;
      if (!onPage(i)) return;
      const y = rowY(i), faded = 'rgba(0, 0, 0, 0.22)';
      if (p.bullet && !cfg.noBullets) { ctx.fillStyle = faded; ctx.fillRect((tx - 7) * S, (y + 2) * S, 3 * S, 3 * S); }
      drawText(ctx, font, p.t, tx, y, faded, S);
    });
  }
  rows.forEach((row, i) => {
    if (!onPage(i)) return;
    const y = rowY(i);
    if (row.bullet && !cfg.noBullets) {   // gros point à gauche de chaque objectif
      ctx.fillStyle = '#000000';
      ctx.fillRect((tx - 7) * S, (y + 2) * S, 3 * S, 3 * S);
    }
    const shown = row.text.replace(/ $/, '');
    drawText(ctx, font, shown, tx, y, '#000000', S);
    if (i === active && sign.blinkOn) {
      const col = caret - row.start;
      if (col >= shown.length) drawText(ctx, font, '_', tx + textWidth(font, row.text.slice(0, col)), y, '#000000', S);
      else { ctx.fillStyle = '#000000'; ctx.fillRect((tx + textWidth(font, row.text.slice(0, col)) - 1) * S, (y - 1) * S, S, 9 * S); }
    }
  });

  // Flèches de page (textures du jeu) et numéro de page, comme dans l'écran d'un livre de Minecraft.
  const back = page > 0 ? [left + 43, top + 159, 23, 13] : null;
  const fwd = page < pages - 1 ? [left + 116, top + 159, 23, 13] : null;
  if (back) ctx.drawImage(sign.hoverBack ? T.page_backward_highlighted : T.page_backward, back[0] * S, back[1] * S, 23 * S, 13 * S);
  if (fwd) ctx.drawImage(sign.hoverFwd ? T.page_forward_highlighted : T.page_forward, fwd[0] * S, fwd[1] * S, 23 * S, 13 * S);
  if (pages > 1) {
    const label = `${page + 1}/${pages}`;
    drawText(ctx, font, label, left + 91 - Math.floor(textWidth(font, label) / 2), top + 162, '#000000', S);
  }
  sign.pages = { rows, per, page, back, fwd };

  // « Terminé » ; avec cfg.onExtra, un 2e bouton « Timeblock » à droite ; avec cfg.onExtra2, un 3e bouton
  // (cfg.extra2Label, ex. « Lier à un arbre ») encore à droite, ou en dessous si la largeur manque (téléphone).
  const btnW = 64, gap = 4, w3 = cfg.onExtra2 ? textWidth(font, cfg.extra2Label) + 14 : 0;
  const oneRow = !cfg.onExtra2 || 2 * btnW + w3 + 2 * gap <= W - 8;
  const btnY = Math.min(H - (oneRow ? 22 : 46), top + 196);
  const rowW = cfg.onExtra ? 2 * btnW + gap + (cfg.onExtra2 && oneRow ? w3 + gap : 0) : btnW;
  const btnX = Math.floor(W / 2 - rowW / 2), btn2X = btnX + btnW + gap;
  const b3 = cfg.onExtra2 ? (oneRow ? [btn2X + btnW + gap, btnY, w3, 20] : [Math.floor(W / 2 - w3 / 2), btnY + 24, w3, 20]) : null;
  drawButton(ctx, btnX, btnY, btnW, 'Terminé', sign.hoverDone, S);
  if (cfg.onExtra) drawButton(ctx, btn2X, btnY, btnW, 'Timeblock', sign.hoverExtra, S);
  if (b3) drawButton(ctx, b3[0], b3[1], b3[2], cfg.extra2Label, sign.hoverExtra2, S);
  sign.layout = { S, board: [left + 36, textTop - 2, 118, cfg.lines * 9], button: [btnX, btnY, btnW, 20], button2: cfg.onExtra ? [btn2X, btnY, btnW, 20] : null, button3: b3 };
  Object.assign(signInput.style, { left: (left + 36) * S + 'px', top: (textTop - 2) * S + 'px', width: 118 * S + 'px', height: cfg.lines * 9 * S + 'px' });
}

function inRect(ev, [x, y, w, h], S = sign.layout.S) {
  const gx = evX(ev) / S, gy = evY(ev) / S;
  return gx >= x && gx < x + w && gy >= y && gy < y + h;
}

// Bouton Minecraft (texture 200x20) en pixels GUI ; plus étroit : on garde les deux bords de la texture.
function drawButton(ctx, x, y, w, label, hover, S) {
  const half = Math.floor(w / 2), tex = hover ? T.button_highlighted : T.button;
  ctx.drawImage(tex, 0, 0, half, 20, x * S, y * S, half * S, 20 * S);
  ctx.drawImage(tex, 200 - (w - half), 0, w - half, 20, (x + half) * S, y * S, (w - half) * S, 20 * S);
  drawText(ctx, font, label, x + Math.floor(w / 2 - textWidth(font, label) / 2), y + 6, '#FFFFFF', S, true);
}

// Fond assombri commun aux écrans plein écran ; renvoie la taille en pixels GUI.
function prepareScreen(cv, S) {
  cv.width = viewW();
  cv.height = viewH();
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = 'rgba(16, 16, 16, 0.35)';
  ctx.fillRect(0, 0, cv.width, cv.height);
  return { ctx, W: Math.floor(viewW() / S), H: Math.floor(viewH() / S) };
}

function openSign(cfg) {
  sign.cfg = { fixed: [], transform: t => t, validate: () => true, ...cfg };
  sign.error = false;
  sign.hoverDone = false;
  sign.hoverExtra = false;
  signInput.inputMode = cfg.numeric === true ? 'numeric' : cfg.numeric || 'text';   // 'decimal' : chiffres + virgule
  signInput.value = fitSignText(sign.cfg.transform(cfg.initial || '')).text;
  hideTooltip();
  canvas.hidden = true;
  signScreen.hidden = false;
  sign.blinkOn = true;
  clearInterval(sign.timer);
  sign.timer = setInterval(() => { sign.blinkOn = !sign.blinkOn; renderSign(); }, 300);
  signInput.focus();
  signInput.setSelectionRange(signInput.value.length, signInput.value.length);
  renderSign();
}

function closeSign() {
  clearInterval(sign.timer);
  signScreen.hidden = true;
  canvas.hidden = false;
  sign.cfg = null;
  renderGui();
}

function finishSign() {
  const cfg = sign.cfg, text = signInput.value;
  if (!cfg.validate(text)) {
    sign.error = true;
    renderSign();
    signInput.focus();
    return;
  }
  closeSign();
  cfg.onDone(text);   // peut ouvrir un autre panneau (ex. titre puis description)
}

signInput.addEventListener('input', () => {
  const raw = sign.cfg.transform(signInput.value);
  const { text, caret } = fitSignText(raw, signInput.selectionStart + raw.length - signInput.value.length);
  if (text !== signInput.value) {
    signInput.value = text;
    signInput.setSelectionRange(caret, caret);
  }
  sign.error = false;
  sign.blinkOn = true;
  renderSign();
});
// Le curseur bouge (flèches, clic) : redessine la ligne active.
document.addEventListener('selectionchange', () => { if (sign.cfg) { sign.blinkOn = true; renderSign(); } });
signInput.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { ev.preventDefault(); const cfg = sign.cfg; closeSign(); if (cfg.onCancel) cfg.onCancel(); return; }
  if (ev.key !== 'Enter') return;
  // Livre : Maj + Entrée saute toujours une ligne (jamais « Terminé »), s'il reste de la place sur la page.
  if (sign.cfg.book && ev.shiftKey) {
    ev.preventDefault();
    const v = signInput.value, a = signInput.selectionStart, b = signInput.selectionEnd;
    const next = v.slice(0, a) + '\n' + v.slice(b);
    if (bookRows(next).length <= bookCapacity(sign.cfg)) {
      signInput.value = next;
      signInput.setSelectionRange(a + 1, a + 1);
      sign.blinkOn = true;
      renderSign();
    }
    return;
  }
  // Entrée : ligne suivante s'il en reste, sinon « Terminé ».
  const lineCount = sign.cfg.book ? bookRows(signInput.value).length : signInput.value.split('\n').length;
  if (lineCount < (sign.cfg.book ? bookCapacity(sign.cfg) : sign.cfg.lines) && !ev.shiftKey) return;
  ev.preventDefault();
  playClick();
  finishSign();
});
signCanvas.addEventListener('mousemove', ev => {
  if (!sign.layout) return;
  const hover = inRect(ev, sign.layout.button);
  const hover2 = !!sign.layout.button2 && inRect(ev, sign.layout.button2);
  const hover3 = !!sign.layout.button3 && inRect(ev, sign.layout.button3);
  if (hover3 !== !!sign.hoverExtra2) { sign.hoverExtra2 = hover3; renderSign(); }
  const pg = sign.cfg && sign.cfg.book && sign.pages;
  const hb = !!(pg && pg.back && inRect(ev, pg.back)), hf = !!(pg && pg.fwd && inRect(ev, pg.fwd));
  if (hb !== !!sign.hoverBack || hf !== !!sign.hoverFwd) { sign.hoverBack = hb; sign.hoverFwd = hf; renderSign(); }
  signCanvas.style.cursor = hover || hover2 || hover3 || hb || hf ? 'pointer' : '';
  if (hover !== sign.hoverDone || hover2 !== !!sign.hoverExtra) { sign.hoverDone = hover; sign.hoverExtra = hover2; renderSign(); }
});
signCanvas.addEventListener('click', ev => {
  const pg = sign.cfg && sign.cfg.book && sign.pages;
  const turn = pg && (pg.back && inRect(ev, pg.back) ? -1 : pg.fwd && inRect(ev, pg.fwd) ? 1 : 0);
  if (turn) {   // changer de page : le curseur va au début de la page visée
    playClick();
    const row = pg.rows[(pg.page + turn) * pg.per];
    signInput.focus();
    if (row) signInput.setSelectionRange(row.start, row.start);
    sign.blinkOn = true;
    renderSign();
    return;
  }
  if (sign.layout && inRect(ev, sign.layout.button)) { playClick(); finishSign(); }
  else if (sign.layout && sign.layout.button3 && inRect(ev, sign.layout.button3)) {   // ex. lier l'agenda à un arbre
    playClick();
    const cfg = sign.cfg, text = signInput.value;
    closeSign();
    cfg.onExtra2(text);
  }

function formatDigits(d) {

  if (prio) drawButton(ctx, ...prio.slice(0, 3), dialog.cfg.priorityLabel || 'Priorité', dialog.hover === 'prio', S);
  if (dialog.cfg.onDelete) drawButton(ctx, ...del.slice(0, 3), dialog.cfg.deleteLabel || '§cSupprimer', dialog.hover === 'del', S);

}

// --- Timeblocking : les blocs horaires d'une journée, dans le style Minecraft ---
// Chaque bloc : { debut, fin } en minutes depuis minuit, + titre ; dessiné comme une bulle d'info Minecraft.
// Glisser sur une zone vide = nouveau bloc ; glisser un bloc = le déplacer ; glisser son bord bas = changer
// sa durée ; clic sur un bloc = renommer / supprimer. Molette = défiler dans la journée.
const TB_KEY = 'timeblocks';
const timeblocks = (() => { try { return JSON.parse(localStorage.getItem(TB_KEY)) || {}; } catch { return {}; } })();
const TB_START = 6 * 60, TB_END = 24 * 60, TB_HOUR = 24, TB_SNAP = 15;   // de 6h à minuit, 24 px GUI par heure
const TB_CONTENT = (TB_END - TB_START) * TB_HOUR / 60;

const tb = { date: null, onClose: null, layout: null, scroll: null, drag: null, hoverDone: false, arbre: null };
// tb.arbre : bloc spécial d'un arbre de progression (ouvert depuis l'orbe d'expérience de sa page), en attente à

const TB_TRAY = 26, TB_TRAY_BLOCK = [20, 28];   // largeur de la colonne du bloc spécial, taille du bloc
const fmtMin = m => `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`;
const tbBlocks = () => timeblocks[tb.date] || [];
// Timeblock à faire : celui d'aujourd'hui tant qu'il est vide (même si l'agenda du jour est écrit), sinon celui de demain.
const timeblockToWrite = () => { const today = formatDate(new Date()); return (timeblocks[today] || []).length ? tomorrow() : today; };
// Chaque nouveau bloc prend une couleur de la palette au hasard (différente de celle du dernier bloc créé),
// gardée ensuite même s'il est déplacé.
function randomColor() {
  const blocks = tbBlocks(), last = blocks.length ? (blocks[blocks.length - 1].couleur ?? blocks.length - 1) % TB_COLORS.length : -1;
  let c;
  do c = Math.floor(Math.random() * TB_COLORS.length); while (c === last);
  return c;
}
function saveTimeblocks() {
  for (const d of Object.keys(timeblocks)) if (!timeblocks[d].length) delete timeblocks[d];
  try { localStorage.setItem(TB_KEY, JSON.stringify(timeblocks)); } catch {}
  cloudChanged();
}

// Cadre gris clair façon inventaire (9 tranches de la texture du coffre).
function drawPanel(ctx, x, y, w, h, S) {

  part(0, 0, b, b, x, y, b, b); part(172, 0, b, b, x + w - b, y, b, b);
  part(0, 218, b, b, x, y + h - b, b, b); part(172, 218, b, b, x + w - b, y + h - b, b, b);
  part(b, 0, 1, b, x + b, y, w - 2 * b, b); part(b, 218, 1, b, x + b, y + h - b, w - 2 * b, b);

];
// Assombrit (k < 1) ou éclaircit (k > 1) une couleur #rrggbb.
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(k > 1 ? v + (255 - v) * (k - 1) : v * k)));
  return `rgb(${f(n >> 16)}, ${f((n >> 8) & 255)}, ${f(n & 255)})`;
}
// Bloc coloré dans le style des bulles d'info Minecraft : contour externe sombre aux coins coupés,
// contour interne clair en dégradé (du haut vers le bas), fond de la couleur du bloc.
function drawColorBlock(ctx, x, y, w, h, color, S) {
  const r = (rx, ry, rw, rh, fill) => { if (rw > 0 && rh > 0) { ctx.fillStyle = fill; ctx.fillRect(rx * S, ry * S, rw * S, rh * S); } };
  const outer = shade(color, 0.25);
  r(x + 1, y, w - 2, h, outer);          // contour externe (coins coupés)
  r(x, y + 1, w, h - 2, outer);
  r(x + 1, y + 1, w - 2, h - 2, color);  // fond

  const top = shade(color, 1.55), bottom = shade(color, 1.15);
  const grad = ctx.createLinearGradient(0, (y + 1) * S, 0, (y + h - 1) * S);
  grad.addColorStop(0, top);
  grad.addColorStop(1, bottom);
  r(x + 1, y + 1, w - 2, 1, top);        // contour interne en dégradé
  r(x + 1, y + h - 2, w - 2, 1, bottom);
  r(x + 1, y + 2, 1, h - 4, grad);
  r(x + w - 2, y + 2, 1, h - 4, grad);
}

  const photo = [px + pw - 8 - 50, py + ph - 26, 50, 20];   // « Photo » en bas à droite
  const cal = [px + 8, py + ph - 26, 50, 20];               // « Agenda » en bas à gauche (export vers Google Agenda)
  drawButton(ctx, btn[0], btn[1], btn[2], 'Terminé', tb.hoverDone, S);
  drawButton(ctx, photo[0], photo[1], photo[2], 'Photo', tb.hoverPhoto, S);
  drawButton(ctx, cal[0], cal[1], cal[2], 'Agenda', tb.hoverCal, S);
  // Bloc spécial de l'arbre : à droite de la journée, centré en hauteur (suit le doigt quand on le glisse dehors)
  let trayRect = null;
  if (tb.arbre) {
    const [bw, bh] = TB_TRAY_BLOCK;
    trayRect = [grid.x + grid.w + 4, grid.y + Math.floor((grid.h - bh) / 2), bw, bh];
    let [bx, by] = trayRect;
    if (d && d.mode === 'place') [bx, by] = d.inGrid ? [null, null] : [Math.round(d.x - bw / 2), Math.round(d.y - bh / 2)];
    if (bx != null) {
      drawColorBlock(ctx, bx, by, bw, bh, TB_COLORS[tb.arbre.couleur], S);
      ctx.drawImage(T.orbe_xp, (bx + 3) * S, (by + 7) * S, 14 * S, 14 * S);
    }
  }
  tb.layout = { S, grid, btn, photo, cal, yOf, tray: trayRect, orbs };
}

// --- « Photo » : image 1179 x 2556 (format d'écran d'iPhone) des blocs de la journée, pour un fond d'écran ---
// Dessinée en pixels GUI (196 x 426) puis agrandie x6 ; toute la journée de 6 h à minuit tient dans l'image.
// Le panneau reste dans la zone visible de l'écran verrouillé : sous la date et l'heure (~25 % du haut),
// au-dessus des boutons lampe / appareil photo (~13 % du bas).
let photoBackground = null;
function loadPhotoBackground() {
  photoBackground ||= new Promise(res => { const img = new Image(); img.onload = () => res(img); img.onerror = () => res(null); img.src = 'assets/background.webp'; });
  return photoBackground;
}
// « Agenda » : fichier .ics avec les blocs de la journée, à ouvrir pour les ajouter à Google Agenda (ou à l'agenda
// du téléphone relié au compte Google). Heures « locales » : elles gardent le fuseau de l'agenda qui les reçoit.
function exportTimeblockIcs() {
  const blocks = tbBlocks();
  if (!blocks.length) { showToast({ title: 'Aucun bloc', text: `Rien à exporter pour le ${tb.date}`, color: '#FF5555', duration: 3000 }); return; }
  const [d, m, y] = tb.date.split('/'), day = `${y}${m}${d}`;
  const at = min => `${day}T${String(Math.floor(min / 60)).padStart(2, '0')}${String(min % 60).padStart(2, '0')}00`;
  const esc = t => String(t || 'Bloc').replace(/[\\;,]/g, c => '\\' + c).replace(/\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//SkyBlock Menu//Timeblock//FR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  blocks.forEach((b, i) => lines.push(
    'BEGIN:VEVENT', `UID:skyblock-${day}-${b.debut}-${i}@skyblock-menu`, `DTSTAMP:${stamp}`,
    `DTSTART:${at(b.debut)}`, `DTEND:${at(Math.min(b.fin, 24 * 60 - 1))}`, `SUMMARY:${esc(b.titre)}`, 'END:VEVENT'));
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `timeblock-${y}-${m}-${d}.ics`;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  showToast({ title: 'Timeblock exporté', text: `${blocks.length} bloc${blocks.length > 1 ? 's' : ''} : ouvre le fichier pour l'ajouter`, duration: 4000 });
}
// « Photo » -> aperçu de l'image en fond d'écran d'iPhone -> « Télécharger l'image » -> choix du dossier.
async function timeblockPhoto() {
  const cv = await drawTimeblockPhoto();
  const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
  openPhotoPreview(cv, blob, `timeblock-${tb.date.split('/').reverse().join('-')}.png`);
}
async function drawTimeblockPhoto() {
  const S = 6, W = 196, H = 426;
  const cv = document.createElement('canvas');
  cv.width = 1179;
  cv.height = 2556;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  // Fond : l'image du site, assombrie
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cv.width, cv.height);
  const bg = await loadPhotoBackground();
  if (bg) {
    const k = Math.max(cv.width / bg.width, cv.height / bg.height);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(bg, (cv.width - bg.width * k) / 2, (cv.height - bg.height * k) / 2, bg.width * k, bg.height * k);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, cv.width, cv.height);
  }
  const blocks = tbBlocks();
  const start = TB_START, end = TB_END;   // toute la journée (6 h - minuit), resserrée pour tenir en hauteur

  const px = 6, py = Math.round(H * 0.25), pw = W - 12, ph = Math.round(H * 0.865) - py;   // zone visible de l'écran verrouillé
  drawPanel(ctx, px, py, pw, ph, S);
  drawText(ctx, font, 'Timeblock ' + tb.date, px + 8, py + 6, '#404040', S);
  const grid = { x: px + 36, y: py + 19, w: pw - 36 - 7, h: ph - 19 - 8 };
  const hourH = grid.h * 60 / (end - start);
  const yOf = m => grid.y + (m - start) * hourH / 60;
  const fr = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x * S, y * S, w * S, h * S); };
  fr(grid.x - 1, grid.y - 1, grid.w + 2, grid.h + 2, '#FFFFFF');
  fr(grid.x - 1, grid.y - 1, grid.w + 1, grid.h + 1, '#373737');
  fr(grid.x, grid.y, grid.w, grid.h, '#8B8B8B');
  for (let m = start; m <= end; m += 30) fr(grid.x, Math.round(yOf(m)), grid.w, 1, m % 60 ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.3)');
  for (let m = start; m <= end; m += 60) drawText(ctx, font, fmtMin(m % 1440), px + 7, Math.round(yOf(m)) - 3, '#404040', S);
  blocks.forEach((b, i) => {
    const y1 = Math.round(yOf(b.debut)), h = Math.round(yOf(b.fin)) - y1;
    drawColorBlock(ctx, grid.x + 2, y1 + 1, grid.w - 4, h - 1, TB_COLORS[(b.couleur ?? i) % TB_COLORS.length], S);
    ctx.save();
    ctx.beginPath();
    ctx.rect((grid.x + 3) * S, (y1 + 2) * S, (grid.w - 6) * S, (h - 3) * S);
    ctx.clip();
    // bloc relié à un arbre : orbe d'expérience à droite (plus petite dans un bloc court), comme dans le Timeblock
    const o = blockArbre(b) ? Math.max(3, Math.min(9, h - 4)) : 0;
    const hours = `${fmtMin(b.debut)} - ${fmtMin(b.fin)}`, tx = grid.x + 8, maxW = grid.w - 18 - (o ? o + 3 : 0);
    if (o) ctx.drawImage(T.orbe_xp, (grid.x + grid.w - 6 - o) * S, (h >= 26 ? y1 + 5 : y1 + 1 + Math.round((h - o) / 2)) * S, o * S, o * S);
    if (h >= 26) {
      drawText(ctx, font, fitText(b.titre, maxW), tx, y1 + 5, '#FFFFFF', S, true);
      drawText(ctx, font, hours, tx, y1 + 15, '#E8E8E8', S, true);
    } else {   // bloc court : titre et horaires sur une ligne, centrés ; texte réduit pour tenir dans le bloc
      const s2 = Math.max(2, Math.min(S, Math.floor((h - 3) * S / 8))), k = S / s2;   // k : pixels GUI de la photo -> pixels du texte réduit
      const ty = Math.round((y1 + 0.5 + (h - 8 / k) / 2) * k), hw = textWidth(font, hours);
      drawText(ctx, font, fitText(b.titre, maxW * k - hw - 6), tx * k, ty, '#FFFFFF', s2, true);
      drawText(ctx, font, hours, (tx + maxW) * k - hw, ty, '#E8E8E8', s2, true);
    }
    ctx.restore();
  });

  return cv;
}

// Enregistrement : fenêtre « Enregistrer sous » pour choisir le dossier (Chrome, Edge…), menu de partage sur
// téléphone (« Enregistrer dans Fichiers » permet de choisir le dossier), sinon téléchargement classique.
async function savePhoto(blob, name) {
  const touch = navigator.maxTouchPoints > 0;
  if (!touch && window.showSaveFilePicker) {
    let handle;
    try {
      handle = await window.showSaveFilePicker({
        suggestedName: name, startIn: 'pictures',
        types: [{ description: 'Image PNG', accept: { 'image/png': ['.png'] } }],
      });
    } catch (e) { if (e.name === 'AbortError') return false; }   // fenêtre fermée : on n'enregistre rien
    if (handle) {
      try {
        const out = await handle.createWritable();
        await out.write(blob);
        await out.close();
        return true;
      } catch {}
    }
  }
  const file = new File([blob], name, { type: 'image/png' });
  if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return true; } catch (e) { if (e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  return true;
}

// --- Aperçu : l'image dans un iPhone, avec la date, l'heure et les boutons de l'écran verrouillé par-dessus ---
const photoScreen = document.getElementById('photoScreen');
const photoCanvas = document.getElementById('photoCanvas');
const pv = { img: null, blob: null, name: '', layout: null, hover: null };
const pvOpen = () => !photoScreen.hidden;
function openPhotoPreview(img, blob, name) {
  Object.assign(pv, { img, blob, name, hover: null });
  timeblockScreen.hidden = true;
  photoScreen.hidden = false;
  renderPhotoPreview();
}
function closePhotoPreview() {
  photoScreen.hidden = true;
  pv.img = pv.blob = null;
  showTimeblock();
}
function renderPhotoPreview() {
  const S = tbScale();
  const { ctx, W, H } = prepareScreen(photoCanvas, S);
  // Boutons en bas (pixels GUI), téléphone au-dessus (pixels écran)
  const dlW = 120, backW = 60, gap = 6, by = H - 26;
  const bx = Math.floor((W - dlW - gap - backW) / 2);
  const dl = [bx, by, dlW, 20], back = [bx + dlW + gap, by, backW, 20];
  drawButton(ctx, dl[0], dl[1], dl[2], "Télécharger l'image", pv.hover === 'dl', S);
  drawButton(ctx, back[0], back[1], back[2], 'Retour', pv.hover === 'back', S);
  pv.layout = { S, dl, back };

  const avail = (by - 6) * S - 12;   // hauteur libre au-dessus des boutons, bordure du téléphone comprise
  const ph = Math.min(avail / 1.05, 2556 / 2.4), pw = ph * 1179 / 2556;   // écran du téléphone
  const bez = Math.round(ph * 0.022), x = Math.round((viewW() - pw) / 2), y = Math.round(6 + (avail - ph) / 2);
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
  rr(x - bez - 2, y - bez - 2, pw + 2 * bez + 4, ph + 2 * bez + 4, pw * 0.16 + bez); ctx.fillStyle = '#3A3A3C'; ctx.fill();   // tranche
  rr(x - bez, y - bez, pw + 2 * bez, ph + 2 * bez, pw * 0.16 + bez); ctx.fillStyle = '#000'; ctx.fill();                      // bordure
  ctx.save();
  rr(x, y, pw, ph, pw * 0.14); ctx.clip();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(pv.img, x, y, pw, ph);
  // Éléments de l'écran verrouillé (positions relevées sur une capture d'iPhone)
  const U = pw / 100, sys = '-apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif';
  ctx.fillStyle = '#000';
  rr(x + pw * 0.34, y + ph * 0.012, pw * 0.32, ph * 0.043, ph * 0.022); ctx.fill();   // Dynamic Island
  ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  const [d, m, yy] = tb.date.split('/').map(Number);
  const day = new Date(yy, m - 1, d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  ctx.font = `600 ${5.2 * U}px ${sys}`;
  ctx.fillText(day.charAt(0).toUpperCase() + day.slice(1), x + pw / 2, y + ph * 0.118);
  const now = new Date();
  ctx.font = `700 ${24 * U}px ${sys}`;
  ctx.fillText(`${pad2(now.getHours())}:${pad2(now.getMinutes())}`, x + pw / 2, y + ph * 0.232);
  [0.19, 0.81].forEach(cx => {   // lampe torche / appareil photo
    ctx.beginPath(); ctx.arc(x + pw * cx, y + ph * 0.906, 7.3 * U, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(40, 40, 40, 0.45)'; ctx.fill();
  });
  ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
  rr(x + pw * 0.32, y + ph * 0.973, pw * 0.36, ph * 0.0065, ph * 0.004); ctx.fill();   // barre d'accueil
  ctx.restore();
}
photoCanvas.addEventListener('pointermove', ev => {
  if (!pv.layout) return;
  const h = inRect(ev, pv.layout.dl, pv.layout.S) ? 'dl' : inRect(ev, pv.layout.back, pv.layout.S) ? 'back' : null;
  photoCanvas.style.cursor = h ? 'pointer' : '';
  if (h !== pv.hover) { pv.hover = h; renderPhotoPreview(); }
});
photoCanvas.addEventListener('click', async ev => {
  if (!pv.layout) return;
  if (inRect(ev, pv.layout.back, pv.layout.S)) { playClick(); closePhotoPreview(); return; }
  if (inRect(ev, pv.layout.dl, pv.layout.S)) {
    playClick();
    if (await savePhoto(pv.blob, pv.name)) closePhotoPreview();
  }
});
addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && pvOpen()) { ev.preventDefault(); closePhotoPreview(); }
});

}
function showTimeblock() {

  timeblockScreen.hidden = false;
  tb.drag = null;
  renderTimeblock();
}
function hideTimeblock() {
  timeblockScreen.hidden = true;

function closeTimeblock(callBack = true) {

function tbPoint(ev) {
  const { S } = tb.layout;
  return { x: evX(ev) / S, y: evY(ev) / S };
}
function tbTimeAt(y) {
  const { grid } = tb.layout;
  const m = TB_START + (y - grid.y + tb.scroll) * 60 / TB_HOUR;
  return Math.max(TB_START, Math.min(TB_END, Math.round(m / TB_SNAP) * TB_SNAP));
}
function tbInGrid(p) {
  const { grid } = tb.layout;
  return p.x >= grid.x && p.x < grid.x + grid.w && p.y >= grid.y && p.y < grid.y + grid.h;
}
const tbOrbAt = ev => tb.layout.orbs.find(o => inRect(ev, o.r, tb.layout.S));
// Survol d'une orbe : overlay avec le nom de l'arbre relié et sa progression.
function tbOrbTip(orb, ev) {
  if (orb && orb.prog) {   // pousse : l'Arbre de progression relié (étapes validées)
    const t = treeById(orb.block.prog);
    if (t && tb.tipFor !== t.id) {
      tb.tipFor = t.id;
      const done = t.etapes.filter(etapeDone).length, R = guiRatio();
      const lines = [`§a${t.name}`, t.fin ? `§7Terminé le ${t.fin}` : `§7${done}/${t.etapes.length} étapes validées`, '', "§eClique pour voir l'arbre !"];
      renderTooltip(tip, font, lines, tooltipScale(tb.layout.S));
      tip.style.width = tip.width / R + 'px';
      tip.style.height = tip.height / R + 'px';
      tip.hidden = false;
    }
    if (t) placeTooltip(ev);
    return;
  }
  const a = orb && blockArbre(orb.block);
  if (!a) { if (tb.tipFor) { tb.tipFor = null; tip.hidden = true; } return; }
  if (tb.tipFor !== a) {
    tb.tipFor = a;
    const R = guiRatio(), lines = [`§a${a.titre}`, progressLine(a, arbreProgress(a)), '', "§eClique pour voir l'arbre !"];
    renderTooltip(tip, font, lines, tooltipScale(tb.layout.S));
    tip.style.width = tip.width / R + 'px';
    tip.style.height = tip.height / R + 'px';
    tip.hidden = false;
  }
  placeTooltip(ev);
}
timeblockCanvas.addEventListener('pointerleave', () => tbOrbTip(null));
// Bloc d'une heure centré sur la hauteur y (arrondi au quart d'heure, dans la journée).
function tbPlaceHour(y) {
  const debut = Math.max(TB_START, Math.min(TB_END - 60, tbTimeAt(y - TB_HOUR / 2)));
  return [debut, debut + 60];
}
function tbBlockAt(p) {
  const { yOf } = tb.layout;
  return [...tbBlocks()].reverse().find(b => p.y >= yOf(b.debut) && p.y < yOf(b.fin));
}
// Titre d'un bloc (nouveau ou existant) sur un panneau ; retour ensuite au Timeblock.
function editBlockTitle(block, isNew) {
  hideTimeblock();

    title: isNew ? 'Nouveau bloc' : 'Renommer le bloc',

function blockMenu(block) {
  hideTimeblock();
  openConfirm({
    question: block.titre,
    detail: [`De ${fmtMin(block.debut)} à ${fmtMin(block.fin)}`],
    noLabel: 'Renommer', yesLabel: 'Retour',
    colors: {
      list: TB_COLORS,
      current: () => (block.couleur ?? (timeblocks[tb.date] || []).indexOf(block)) % TB_COLORS.length,
      onPick: i => {
        block.couleur = i;

      },
      onOrb: () => pickArbreForBlock(block),   // orbe d'expérience : relier le bloc à un arbre de progression
      onTree: () => pickProgTreeForBlock(block),   // pousse : relier le bloc à un Arbre de progression (plan en étapes)
    },
    onNo: () => editBlockTitle(block, false),
    onYes: showTimeblock,

      const list = timeblocks[tb.date] || [];
      list.splice(list.indexOf(block), 1);
      saveTimeblocks();
      showTimeblock();
    },
  });
}

// Orbe d'expérience d'un bloc : page « Arbre de progression » (même liste que les arbres) ; l'arbre choisi donne
// au bloc son titre, sa couleur et l'orbe (comme un bloc posé depuis la page de l'arbre). Retour au Timeblock ensuite.
// Pousse d'un bloc : page des Arbres de progression (en cours et terminés) ; l'arbre choisi est relié au bloc
// (block.prog), qui affiche une petite pousse à gauche de son orbe.
function pickProgTreeForBlock(block) {
  const back = state.page;
  hideTimeblock();
  const done = () => { state.page = back; delete PAGES['tb-prog']; showTimeblock(); };
  PAGES['tb-prog'] = treeListPage({
    title: PAGE_TITLES.progression, trees: allTrees(), linked: block.prog, linkedText: 'Lié à ce bloc',
    nav: { '5,4': { item: 'barrier', tooltip: ['§cAnnuler', '', '§eClique pour revenir au Timeblock !'], action: done } },
    pick: t => { block.prog = t.id; saveTimeblocks(); showToast({ title: 'Bloc lié', text: fitText(t.name, 150) }); done(); },
  });
  state.page = 'tb-prog';
  canvas.hidden = false;
  renderGui();
}
function pickArbreForBlock(block) {
  const back = state.page;
  hideTimeblock();
  const done = () => { state.page = back; showTimeblock(); };
  const trees = arbreLists()[0].trees, title = PAGE_TITLES.arbres;
  const nav = { '5,4': { item: 'barrier', tooltip: ['§cAnnuler', '', '§eClique pour revenir au Timeblock !'], action: done } };
  const pick = (a, n) => {
    block.arbre = arbreId(a);   // le bloc garde son nom et sa couleur ; l'orbe mène à l'arbre
    saveTimeblocks();
    done();
  };
  for (const id of Object.keys(PAGES)) if (id.startsWith('tb-arbres')) delete PAGES[id];
  if (isMobileLayout() || da === 'test') PAGES['tb-arbres'] = arbresScrollPage({ trees, title, nav, pick });
  else {   // ordinateur, D.A Minecraft : mêmes cases que la liste des arbres, par pages
    const per = ARBRE_CELLS.length, pages = Math.max(1, Math.ceil(trees.length / per));
    const pageId = k => k === 1 ? 'tb-arbres' : `tb-arbres-${k}`, go = id => () => { state.page = id; renderGui(); };
    for (let k = 1; k <= pages; k++) {
      const slots = { ...nav };
      if (k > 1) slots['5,0'] = { item: 'arrow', tooltip: ['§aPage précédente', `§7Page ${k - 1}`], action: go(pageId(k - 1)) };
      if (k < pages) slots['5,8'] = { item: 'arrow', tooltip: ['§aPage suivante', `§7Page ${k + 1}`], action: go(pageId(k + 1)) };
      trees.slice((k - 1) * per, k * per).forEach((a, i) => {
        const n = arbres.indexOf(a) + 1, pct = arbreProgress(a);
        slots[ARBRE_CELLS[i]] = { ...arbreIcon(a), count: Math.floor(pct / 10) || null, tooltip: () => [`§a${a.titre}`, progressLine(a, pct), '', '§eClique pour choisir !'], action: () => pick(a, n) };
      });
      PAGES[pageId(k)] = { title, slots };
    }
  }
  state.page = 'tb-arbres';
  canvas.hidden = false;
  renderGui();
}

// --- Pop-up Timer : compte à rebours jusqu'à la fin d'un bloc, dans une petite fenêtre qui reste au-dessus
// des autres apps. Chrome / Edge / Arc : vraie mini-fenêtre (Document Picture-in-Picture) qui reste ouverte
// quand on change d'onglet ; Safari / iPhone : mode « image dans l'image » d'une vidéo (le canvas filmé).
// Sans l'un ni l'autre (Firefox…), le timer flotte en haut à droite de l'app ; un clic dessus le ferme.
const TIMER_W = 120, TIMER_H = 50, TIMER_S = 4;
const timer = { canvas: null, video: null, win: null, block: null, color: null, end: 0, loop: null, rang: false, floating: false };
function prepareTimer(block) {
  if (!timer.canvas) {
    timer.canvas = document.createElement('canvas');
    timer.canvas.width = TIMER_W * TIMER_S;
    timer.canvas.height = TIMER_H * TIMER_S;
    timer.canvas.id = 'timerCanvas';
    timer.canvas.addEventListener('click', () => { if (timer.floating) closeTimer(); });
    const video = timer.video = document.createElement('video');
    video.muted = true;
    video.playsInline = true;
    video.id = 'timerVideo';
    video.addEventListener('leavepictureinpicture', closeTimer);
    document.body.append(video);
  }
  const list = timeblocks[tb.date] || [];
  const color = TB_COLORS[(block.couleur ?? list.indexOf(block)) % TB_COLORS.length];
  Object.assign(timer, { next: { block, color, date: tb.date } });
  if (!timer.block) {   // aucun timer ouvert : on prépare l'image de celui-ci
    Object.assign(timer, timer.next);
    drawTimer();
  }
  if (timer.canvas.captureStream && !timer.video.srcObject) {
    timer.video.srcObject = timer.canvas.captureStream();
    timer.video.play().catch(() => {});
  }
}
function openTimer() {
  const { block, color, date } = timer.next;
  Object.assign(timer, { block, color, rang: false, end: toDate(date).getTime() + block.fin * 60000 });
  drawTimer();
  if (timer.win) return;   // mini-fenêtre déjà ouverte : elle affiche maintenant ce bloc
  if (timer.floating) { runTimer(window); return; }
  if (window.documentPictureInPicture) {
    documentPictureInPicture.requestWindow({ width: TIMER_W * 2, height: TIMER_H * 2 }).then(win => {
      timer.win = win;
      win.document.title = 'Timer';
      Object.assign(win.document.body.style, { margin: '0', background: '#000', overflow: 'hidden' });
      Object.assign(timer.canvas.style, { display: 'block', width: '100vw', height: '100vh', objectFit: 'contain', imageRendering: 'pixelated' });
      win.document.body.append(timer.canvas);
      win.addEventListener('pagehide', closeTimer);
      runTimer(win);   // la mini-fenêtre est visible : ses minuteurs ne sont pas ralentis quand l'onglet est caché
    }).catch(videoTimer);
  } else videoTimer();
}
function runTimer(win) {
  if (timer.loop) timer.loop.win.clearInterval(timer.loop.id);
  timer.loop = { win, id: win.setInterval(drawTimer, 250) };
}
function videoTimer() {
  runTimer(window);
  const pip = document.pictureInPictureEnabled && timer.video.srcObject && timer.video.requestPictureInPicture;
  if (pip) timer.video.requestPictureInPicture().catch(floatTimer);
  else floatTimer();
}
function floatTimer() {
  timer.floating = true;
  document.body.append(timer.canvas);
}
function closeTimer() {
  if (timer.loop) { try { timer.loop.win.clearInterval(timer.loop.id); } catch {} }
  timer.loop = null;
  timer.block = null;
  if (timer.win) {
    const win = timer.win;
    timer.win = null;
    timer.canvas.remove();
    timer.canvas.removeAttribute('style');
    win.close();
  }
  if (timer.floating) { timer.canvas.remove(); timer.floating = false; }
  if (document.pictureInPictureElement) document.exitPictureInPicture().catch(() => {});
}
const fmtDuration = ms => {
  const t = Math.ceil(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, sec = t % 60;
  return h ? `${h}:${pad2(m)}:${pad2(sec)}` : `${pad2(m)}:${pad2(sec)}`;
};
function drawTimer() {
  if (!timer.block || !font) return;
  const ctx = timer.canvas.getContext('2d'), S = TIMER_S, W = TIMER_W, H = TIMER_H;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W * S, H * S);
  drawColorBlock(ctx, 0, 0, W, H, timer.color, S);
  const left = timer.end ? timer.end - Date.now() : (timer.block.fin - timer.block.debut) * 60000;
  const done = left <= 0;
  drawText(ctx, font, fitText(timer.block.titre, W - 12), 6, 5, '#FFFFFF', S, true);
  // Temps restant en grand (texte x2) au centre
  const big = done ? 'Terminé !' : fmtDuration(left), S2 = S * 2;
  drawText(ctx, font, big, (W - textWidth(font, big) * 2) / 4, 17 / 2, done ? '#FFFF55' : '#FFFFFF', S2, true);
  drawText(ctx, font, `Fin à ${fmtMin(timer.block.fin)}`, 6, H - 13, '#E8E8E8', S, true);
  if (done && timer.end && !timer.rang) {   // fin du bloc : trois clics
    timer.rang = true;
    [0, 250, 500].forEach(d => setTimeout(playClick, d));
  }
}

// --- Notifications (style « succès » Minecraft) : icône, titre en couleur, description en blanc ---
// Elles descendent depuis le haut (en haut à droite), restent quelques secondes puis remontent ; un son au hasard parmi 4 (volume réduit).
const NOTIF_SOUNDS = [1, 2, 3, 4].map(i => { const a = new Audio(`assets/sounds/notif${i}.mp3`); a.preload = 'auto'; a.volume = 0.02; return a; });   // son des notifications : très bas
const toastBox = document.getElementById('toasts');
function showToast({ icon = 'clock_00', title, text, color = '#FFFF55', duration = 6000 }) {
  if (!font) return;
  const W = Math.max(160, 34 + Math.max(textWidth(font, title), textWidth(font, text)) + 8), H = 32;
  // téléphone : dessinée en pixels de l'écran et réduite pour tenir dans la largeur (marges comprises)
  const R = guiRatio(), S = isMobileLayout()
    ? Math.max(1, Math.min(2 * R, Math.floor((viewW() - 16) * R / W)))
    : Math.max(2, Math.min(3, Math.round(state.S)));
  const cv = document.createElement('canvas');
  cv.width = W * S;
  cv.height = H * S;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const fr = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x * S, y * S, w * S, h * S); };
  fr(1, 0, W - 2, H, '#101010');          // contour sombre, coins coupés
  fr(0, 1, W, H - 2, '#101010');
  fr(1, 1, W - 2, H - 2, '#5A5A5A');      // bordure claire
  fr(2, 2, W - 4, H - 4, '#212121');      // fond
  const size = 16 * S;
  ctx.drawImage(T[icon], 8 * S, 8 * S, size, size);
  drawText(ctx, font, title, 32, 7, color, S, true);
  drawText(ctx, font, text, 32, 18, '#FFFFFF', S, true);
  if (R > 1 || isMobileLayout()) { cv.style.width = W * S / R + 'px'; cv.style.height = H * S / R + 'px'; }
  toastBox.append(cv);
  requestAnimationFrame(() => requestAnimationFrame(() => cv.classList.add('shown')));
  playSound(NOTIF_SOUNDS[Math.floor(Math.random() * NOTIF_SOUNDS.length)]);
  setTimeout(() => { cv.classList.remove('shown'); setTimeout(() => cv.remove(), 400); }, duration);
}
// Rappel 5 minutes avant chaque bloc du Timeblock du jour (une seule fois par bloc, même après rechargement).
const NOTIFIED_KEY = 'notifs-blocs';
const notified = (() => { try { return JSON.parse(localStorage.getItem(NOTIFIED_KEY)) || {}; } catch { return {}; } })();
function checkBlockReminders() {
  const now = new Date(), today = formatDate(now), minutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  for (const d of Object.keys(notified)) if (d !== today) delete notified[d];   // on ne garde que le jour en cours
  for (const b of timeblocks[today] || []) {
    const left = b.debut - minutes, key = `${b.debut}-${b.titre}`;
    if (left > 0 && left <= 5 && !(notified[today] || []).includes(key)) {
      (notified[today] ||= []).push(key);
      const m = Math.ceil(left);
      showToast({ title: `Bientôt : ${fitText(b.titre, 150)}`, text: `Commence à ${fmtMin(b.debut)} (dans ${m} min)` });
    }
  }
  try { localStorage.setItem(NOTIFIED_KEY, JSON.stringify(notified)); } catch {}
}

timeblockCanvas.addEventListener('pointerdown', ev => {
  if (!tb.layout) return;
  const p = tbPoint(ev);
  if (inRect(ev, tb.layout.btn, tb.layout.S)) { playClick(); closeTimeblock(); return; }
  if (inRect(ev, tb.layout.photo, tb.layout.S)) { playClick(); timeblockPhoto(); return; }
  if (inRect(ev, tb.layout.cal, tb.layout.S)) { playClick(); exportTimeblockIcs(); return; }
  const orb = tbOrbAt(ev);
  if (orb && orb.prog) {   // pousse : écran de l'Arbre de progression relié (en cours ou terminé)
    const t = treeById(orb.block.prog);
    tip.hidden = true;
    if (t) { playClick(); location.hash = t.fin ? `prog-archive-${t.id}` : 'progression'; }
    return;
  }
  if (orb) {   // orbe d'un bloc relié à un arbre : page de l'arbre (le Timeblock se ferme)
    const a = blockArbre(orb.block);
    tip.hidden = true;
    if (a) { playClick(); location.hash = `arbre-${arbres.indexOf(a) + 1}`; }
    return;
  }
  if (tb.layout.tray && inRect(ev, tb.layout.tray, tb.layout.S)) {   // bloc spécial de l'arbre : on le prend
    timeblockCanvas.setPointerCapture(ev.pointerId);
    tb.drag = { mode: 'place', x: p.x, y: p.y, x0: p.x, y0: p.y, moved: false, inGrid: false };
    return;
  }
  if (!tbInGrid(p)) return;
  timeblockCanvas.setPointerCapture(ev.pointerId);
  const t = tbTimeAt(p.y), block = tbBlockAt(p);
  if (block) {
    const resize = p.y > tb.layout.yOf(block.fin) - 4;
    tb.drag = { mode: resize ? 'resize' : 'move', block, debut: block.debut, fin: block.fin, grab: t - block.debut, t0: t, moved: false };
  } else {
    const start = Math.min(TB_END - TB_SNAP, Math.floor((TB_START + (p.y - tb.layout.grid.y + tb.scroll) * 60 / TB_HOUR) / TB_SNAP) * TB_SNAP);
    tb.drag = { mode: 'create', start, end: start + TB_SNAP, t0: t, moved: false };
  }
});
timeblockCanvas.addEventListener('pointermove', ev => {
  if (!tb.layout) return;
  const p = tbPoint(ev), d = tb.drag;
  if (!d) {   // curseur selon ce qui est survolé
    const block = tbInGrid(p) && tbBlockAt(p);
    const onBtn = inRect(ev, tb.layout.btn, tb.layout.S), onPhoto = inRect(ev, tb.layout.photo, tb.layout.S), onCal = inRect(ev, tb.layout.cal, tb.layout.S);
    if (onPhoto !== !!tb.hoverPhoto) { tb.hoverPhoto = onPhoto; renderTimeblock(); }
    if (onCal !== !!tb.hoverCal) { tb.hoverCal = onCal; renderTimeblock(); }
    const onTray = tb.layout.tray && inRect(ev, tb.layout.tray, tb.layout.S), orb = tbOrbAt(ev);
    tbOrbTip(orb, ev);
    timeblockCanvas.style.cursor = orb ? 'pointer' : onTray ? 'grab' : onBtn || onPhoto || onCal ? 'pointer' : block ? (p.y > tb.layout.yOf(block.fin) - 4 ? 'ns-resize' : 'move') : tbInGrid(p) ? 'crosshair' : '';
    if (onBtn !== tb.hoverDone) { tb.hoverDone = onBtn; renderTimeblock(); }
    return;
  }
  if (d.mode === 'place') {   // bloc de l'arbre : 1 h centrée sur le doigt dès qu'il est dans la journée
    Object.assign(d, { x: p.x, y: p.y });
    if (Math.hypot(p.x - d.x0, p.y - d.y0) > 3) d.moved = true;
    d.inGrid = d.moved && tbInGrid(p);
    if (d.inGrid) [d.debut, d.fin] = tbPlaceHour(p.y);
    renderTimeblock();
    return;
  }
  const t = tbTimeAt(p.y);
  if (t !== d.t0) d.moved = true;
  if (!d.moved) return;
  if (d.mode === 'create') d.end = t === d.start ? d.start + TB_SNAP : t;
  else if (d.mode === 'move') {
    const dur = d.block.fin - d.block.debut;
    d.debut = Math.max(TB_START, Math.min(TB_END - dur, t - d.grab));
    d.fin = d.debut + dur;
  } else d.fin = Math.max(d.debut + TB_SNAP, t);
  renderTimeblock();
});
timeblockCanvas.addEventListener('pointerup', () => {
  const d = tb.drag;
  if (!d) return;
  tb.drag = null;
  if (d.mode === 'place') {
    // simple toucher : placé au milieu de la partie visible de la journée ; lâché dehors : reste à droite
    if (!d.moved) [d.debut, d.fin] = tbPlaceHour(tb.layout.grid.y + tb.layout.grid.h / 2);
    else if (!d.inGrid) { renderTimeblock(); return; }
    playClick();
    (timeblocks[tb.date] ||= []).push({ debut: d.debut, fin: d.fin, titre: tb.arbre.titre, couleur: tb.arbre.couleur, arbre: tb.arbre.id });
    tb.arbre = null;
    saveTimeblocks();
    renderTimeblock();
    return;
  }
  if (d.mode === 'create') {
    let [debut, fin] = [Math.min(d.start, d.end), Math.max(d.start, d.end)];
    if (!d.moved) fin = Math.min(TB_END, debut + 60);   // simple clic : bloc d'une heure
    playClick();
    editBlockTitle({ debut, fin, titre: '', couleur: d.color ?? randomColor() }, true);
  } else if (!d.moved) {
    playClick();
    blockMenu(d.block);
  } else {
    d.block.debut = d.debut;
    d.block.fin = d.fin;
    saveTimeblocks();
    renderTimeblock();
  }
});
timeblockCanvas.addEventListener('wheel', ev => {
  ev.preventDefault();
  tb.scroll += ev.deltaY / (tb.layout ? tb.layout.S : 2) / 2;
  renderTimeblock();
}, { passive: false });
addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !ev.defaultPrevented && tbOpen()) closeTimeblock();
});

// --- Arbre de progression : un plan en plusieurs étapes, dessiné comme l'écran des progrès de Minecraft ---
// Chaque étape : { id, x, y (case de la grille), niveau, item, titre, description, parent }. La 1re étape (la racine)
// a le niveau 1 ; une étape posée en dessous d'une autre prend le niveau suivant, à sa gauche ou à sa droite le même.
// Un clic sur une étape la sélectionne et fait apparaître des « + » en dessous, à gauche et à droite (places libres) ;
// un « + » crée une étape (panneau pour le nom, puis livre pour la description) avec un item tiré au hasard.
// Glisser (ou la molette) déplace la vue sur le fond de pierre.
const PROG_KEY = 'arbre-progression';
const prog = (() => { try { return JSON.parse(localStorage.getItem(PROG_KEY)) || { etapes: [] }; } catch { return { etapes: [] }; } })();
// Items tirés au hasard pour une nouvelle étape (images de la base, sans les vitres)
const PROG_ITEMS = [
  'diamond_sword', 'painting', 'book', 'writable_book', 'clock_00', 'bone', 'name_tag', 'redstone_torch', 'cookie', 'paper',
  'arrow', 'ender_pearl', 'boussole', 'oeil_ender', 'lingot_netherite', 'minecart_tnt', 'laisse', 'carte_vide', 'gold_ingot',
  'green_dye', 'lime_dye', 'beacon', 'tournesol', 'pousse', 'panneau', 'jukebox', 'orbe_xp', 'epingle', 'arbre_logo',
  ...['toile', 'enclume', 'pot', 'pepite', 'bloc_commande'].map(n => `arbres/${n}`),
];
const PROG_NODE = 26, PROG_PLUS = 18, PROG_PITCH = 48;   // taille d'une étape, d'un « + », écart entre deux étapes
const progScreen = document.getElementById('progScreen');
const progCanvas = document.getElementById('progCanvas');
const pg = { open: false, layout: null, pan: { x: 0, y: 0 }, selected: null, hover: null, drag: null, tipKey: null };
function saveProg() {
  try { localStorage.setItem(PROG_KEY, JSON.stringify(prog)); } catch {}
  cloudChanged();
  buildEtapePages();
}
const progAt = (x, y) => prog.etapes.find(e => e.x === x && e.y === y);
// Prochaine étape à faire : parmi les étapes pas encore validées dont l'étape précédente l'est (ou la racine),
// la plus haute dans l'arbre, puis la plus à gauche.
function nextEtape() {
  const byId = id => prog.etapes.find(q => q.id === id);
  return prog.etapes
    .filter(e => !etapeDone(e) && (!e.parent || !byId(e.parent) || etapeDone(byId(e.parent))))
    .sort((a, b) => a.y - b.y || a.x - b.x)[0] || null;
}
// Étape validée : à la main (bloc vert de sa page), ou, si elle est liée à un arbre, quand l'arbre est terminé (100 %)
const etapeDone = e => { const a = blockArbre(e); return a ? arbreProgress(a) >= 100 : !!e.valide; };
// Places des « + » : la racine tant que l'arbre est vide, sinon autour de l'étape sélectionnée (dessous, gauche, droite)
// Un seul arbre à la fois : « Terminer l'arbre » le range dans prog.archives ({ id, fin, etapes }, le plus récent en
// premier) et libère la place pour un nouveau. pg.view : arbre terminé affiché (lecture seule), sinon l'arbre en cours.
prog.archives ||= [];
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function progId() {   // identifiant de l'arbre en cours (donné à la première demande et enregistré : un agenda peut y être lié)
  if (!prog.id) { prog.id = newId(); try { localStorage.setItem(PROG_KEY, JSON.stringify(prog)); } catch {} cloudChanged(); }
  return prog.id;
}
// Nom d'un arbre : celui donné en cliquant sur le titre de l'écran, sinon le nom de sa première étape (la racine)
const treeName = (etapes, titre) => titre || ((etapes.find(e => !e.parent) || etapes[0] || {}).titre) || 'Arbre sans nom';
const progEtapes = () => pg.view ? pg.view.etapes : prog.etapes;
// Tous les arbres (celui en cours d'abord, s'il a des étapes) : { id, name, etapes, fin (date, si terminé) }
function allTrees() {
  const cur = prog.etapes.length ? [{ id: progId(), name: treeName(prog.etapes, prog.titre), etapes: prog.etapes, fin: null }] : [];
  return [...cur, ...prog.archives.map(a => ({ id: a.id, name: treeName(a.etapes, a.titre), etapes: a.etapes, fin: a.fin }))];
}
const treeById = id => allTrees().find(t => t.id === id) || null;
function finishTree() {
  if (!prog.etapes.length) { showToast({ title: 'Aucun arbre en cours', text: 'Touche le + pour en créer un.' }); return; }
  const left = prog.etapes.filter(e => !etapeDone(e)).length;
  hideProg();
  openConfirm({
    question: "Terminer l'arbre ?",
    detail: [treeName(prog.etapes, prog.titre), left ? `${left} étape${left > 1 ? 's' : ''} pas encore validée${left > 1 ? 's' : ''}.` : 'Toutes les étapes sont validées.',
      'Il passera dans les arbres précédents.'],
    noLabel: 'Retour', yesLabel: 'Terminer',
    onNo: showProg, onCancel: showProg,
    onYes: () => {
      prog.archives.unshift({ id: progId(), fin: formatDate(new Date()), etapes: prog.etapes, ...(prog.titre ? { titre: prog.titre } : {}) });
      prog.etapes = [];
      delete prog.id;
      delete prog.titre;
      pg.selected = null;
      pg.pan = { x: 0, y: 0 };
      saveProg();
      showToast({ title: 'Arbre terminé', text: fitText(treeName(prog.archives[0].etapes, prog.archives[0].titre), 150) });
      showProg();
    },
  });
}
// Page de choix d'un arbre (arbres précédents, lien d'un agenda) : une ligne par arbre, carte remplie pour un arbre
// terminé, carte vide pour celui en cours ; barre = part des étapes validées.
function treeListPage({ title, trees, pick, nav, linked, linkedText = 'Lié à cet agenda' }) {
  const slots = { ...nav }, mobile = isMobileLayout();
  if (!trees.length) {
    slots[mobile ? 'v2,2' : 'v1,5'] = { image: 'arbre_fini', look: () => ({ dim: true }), tooltip: ['§7Aucun arbre', "§7Termine un arbre de progression", '§7pour le retrouver ici.'] };
    return { title, slots, scrollRows: 3 };
  }
  const lines = trees.map(t => {
    const total = t.etapes.length, done = t.etapes.filter(etapeDone).length, pct = total ? Math.floor(done / total * 100) : 0;
    const desc = t.fin ? `Terminé le ${t.fin}` : `En cours : ${done}/${total} étapes`;
    const tooltip = () => [`§a${t.name}`, `§7${desc}`, ...(linked && linked === t.id ? [`§e${linkedText}`] : []), '', '§eClique pour choisir !'];
    const icon = { image: t.fin ? 'arbre_fini' : 'arbre_en_cours', tooltip, action: () => pick(t) };
    return {
      icons: [[0, icon]], data: t, refresh: renderGui,
      span: { span: 3, label: t.name, color: t.fin ? '#397E49' : '#4599DF', desc, progress: () => pct, compact: true, tooltip, action: () => pick(t), descFull: () => [desc] },
    };
  });
  return { title, slots, scrollRows: placeLines(slots, mobile ? 1 : 0, lines) };
}
function openPreviousTrees() {
  PAGES.precedents = treeListPage({
    title: 'Arbres précédents', trees: allTrees().filter(t => t.fin),
    nav: { '5,4': { item: 'barrier', tooltip: ['§cRetour', '', "§eClique pour revenir à l'arbre !"], open: 'progression' } },
    pick: t => { location.hash = `prog-archive-${t.id}`; },
  });
  location.hash = 'precedents';
}
function progSpots() {
  if (pg.view) return [];   // arbre terminé : lecture seule
  if (!prog.etapes.length) return [{ x: 0, y: 0, niveau: 1, parent: null }];
  const s = prog.etapes.find(e => e.id === pg.selected);
  if (!s) return [];
  return [[0, 1, 1], [-1, 0, 0], [1, 0, 0]]
    .map(([dx, dy, dn]) => ({ x: s.x + dx, y: s.y + dy, niveau: s.niveau + dn, parent: s.id }))
    .filter(p => !progAt(p.x, p.y));
}

function renderProg() {
  const S = tbScale();
  const { ctx, W, H } = prepareScreen(progCanvas, S);
  // téléphone : toute la hauteur de l'écran (le bouton Retour en dessous)
  const pw = Math.min(W - 6, 320), ph = isMobileLayout() ? H - 36 : Math.min(H - 34, 260);
  const px = Math.floor((W - pw) / 2), py = Math.max(4, Math.floor((H - ph - 26) / 2));
  const fr = (x, y, w, h, c) => { if (w > 0 && h > 0) { ctx.fillStyle = c; ctx.fillRect(x * S, y * S, w * S, h * S); } };
  drawPanel(ctx, px, py, pw, ph, S);
  // Titre = nom de l'arbre ; un clic dessus permet de l'écrire directement (champ invisible par-dessus, comme les panneaux)
  const tree = pg.view || prog, titleRect = [px + 6, py + 3, pw - 12, 13];
  const titleText = pg.editTitle ? progTitleInput.value + (pg.blink ? '_' : '')
    : tree.titre || (pg.view ? treeName(pg.view.etapes) : PAGE_TITLES.progression);
  drawText(ctx, font, pg.editTitle ? titleText : fitText(titleText, pw - 16), px + 8, py + 6, pg.hover === 'title' || pg.editTitle ? '#202020' : '#404040', S);
  if (pg.editTitle || pg.hover === 'title') fr(px + 8, py + 15, Math.min(pw - 16, textWidth(font, titleText) || 40), 1, '#808080');   // souligné

  for (const t of tops) drawButton(ctx, t.r[0], t.r[1], t.r[2], t.label, pg.hover === t.key, S);
  const area = { x: px + 9, y: py + 42, w: pw - 18, h: ph - 42 - 21 };
  // Cadre creusé, puis le fond de pierre (il suit la vue quand on la déplace)
  fr(area.x - 1, area.y - 1, area.w + 2, area.h + 2, '#FFFFFF');
  fr(area.x - 1, area.y - 1, area.w + 1, area.h + 1, '#373737');
  ctx.save();
  ctx.beginPath();
  ctx.rect(area.x * S, area.y * S, area.w * S, area.h * S);
  ctx.clip();
  const mod = (a, n) => ((a % n) + n) % n;
  for (let y = area.y - 16 + mod(pg.pan.y, 16); y < area.y + area.h; y += 16)
    for (let x = area.x - 16 + mod(pg.pan.x, 16); x < area.x + area.w; x += 16)
      ctx.drawImage(T.pierre_fond, x * S, y * S, 16 * S, 16 * S);
  // ombre intérieure en haut et à gauche (comme le fond creusé de l'écran des progrès)
  fr(area.x, area.y, area.w, 2, 'rgba(0,0,0,0.35)');
  fr(area.x, area.y + 2, 2, area.h - 2, 'rgba(0,0,0,0.35)');

  const cx = area.x + Math.floor(area.w / 2) + pg.pan.x, cy = area.y + 26 + pg.pan.y;   // centre de la racine
  const center = e => [cx + e.x * PROG_PITCH, cy + e.y * PROG_PITCH];
  // Liens : trait blanc bordé de noir, d'un centre à l'autre (les étapes se dessinent par-dessus) ; étape liée à un

      const pct = arbreProgress(a), fill = Math.round((len - 2) * pct / 100);

      const bar = (o, l, w, c) => {   // o : décalage depuis le début, l : longueur, w : épaisseur (centrée), c : couleur
        if (l <= 0) return;

        if (h) fr(start, y1 - Math.floor(w / 2), l, w, c);
        else fr(x1 - Math.floor(w / 2), start, w, l, c);
      };
      bar(0, len, 5, '#000000');
      bar(1, len - 2, 3, '#2E2E2E');
      bar(1, fill, 3, '#80FF20');
      for (let i = 1; i < 4; i++) bar(1 + Math.round((len - 2) * i / 4), 1, 3, 'rgba(0, 0, 0, 0.55)');   // graduations
      continue;
    }
    const [ax, bx, ay, by] = [Math.min(x1, x2), Math.max(x1, x2), Math.min(y1, y2), Math.max(y1, y2)];

  }

    const drop = pg.drag && pg.drag.moved && pg.drag.drop;

      if (drop.mode === 'swap') fr(nx + 1, ny + 1, PROG_NODE - 2, PROG_NODE - 2, 'rgba(0, 0, 0, 0.5)');
      else {
        const by = ny - Math.round((PROG_PITCH - PROG_NODE) / 2) - 2;

      }

  }
  progSpots().forEach((p, i) => {
    const [x, y] = center(p), nx = x - PROG_PLUS / 2, ny = y - PROG_PLUS / 2;
    const key = 'plus' + i;

  if (dn) {   // suit le curseur, semi-transparente pour laisser voir la cible (assombrie) ou la barre d'insertion

  // Sous le fond : la prochaine étape à faire (pas forcément celle qui est sélectionnée)
  const s = !pg.view && nextEtape();
  const info = pg.view ? `Terminé le ${pg.view.fin}`
    : s ? `Prochaine étape (${s.niveau}) : ${s.titre}` : prog.etapes.length ? 'Toutes les étapes sont validées' : 'Touche le + pour commencer';
  drawText(ctx, font, fitText(info, area.w), area.x, area.y + area.h + 7, '#404040', S);
  const back = [Math.floor(W / 2) - 40, py + ph + 4, 80, 20];

  pg.layout = { S, area, hits: hits.filter(h => h.r[0] + h.r[2] > area.x && h.r[0] < area.x + area.w && h.r[1] + h.r[3] > area.y && h.r[1] < area.y + area.h), back, tops, titleRect };
}

// Déplacement d'étapes : seul le contenu bouge (nom, description, item, validation, arbre lié) ; l'arbre lui-même
// (positions, numéros, liens entre étapes) reste en place.
const ETAPE_FIELDS = ['titre', 'description', 'item', 'valide', 'arbre'];
// Contenus décalés le long d'une suite d'étapes : la dernière (l'étape déplacée) prend la place de la première, et
// chacune des autres descend d'un cran vers l'ancienne place de l'étape déplacée. Deux étapes : un simple échange.
function shiftEtapes(path) {
  const contents = path.map(e => Object.fromEntries(ETAPE_FIELDS.map(f => [f, e[f]])));
  path.forEach((e, i) => {
    const c = contents[(i - 1 + path.length) % path.length];
    for (const f of ETAPE_FIELDS) { if (c[f] === undefined) delete e[f]; else e[f] = c[f]; }
  });
  pg.selected = path[0].id;   // la sélection suit l'étape déplacée
  saveProg();

const swapEtapes = (moved, target) => shiftEtapes([target, moved]);
// Insertion : l'étape déplacée prend la place de la cible, qui descend avec les suivantes jusqu'à l'ancienne place de
// l'étape déplacée (chemin entre les deux dans l'arbre).
function insertEtape(moved, target) {
  const byId = id => prog.etapes.find(q => q.id === id);
  const up = e => { const out = []; for (let q = e; q; q = byId(q.parent)) out.push(q); return out; };
  const fromTarget = up(target), fromMoved = up(moved);
  const common = fromTarget.find(q => fromMoved.includes(q));
  const path = [...fromTarget.slice(0, fromTarget.indexOf(common) + 1), ...fromMoved.slice(0, fromMoved.indexOf(common)).reverse()];
  shiftEtapes(path);
}
// Cible d'une étape glissée : au centre / en bas d'une étape = échange ; juste au-dessus (haut de la case ou espace
// au-dessus) = insertion à sa place, les étapes suivantes se décalent.
function progDropAt(ev, moved) {

  for (const h of pg.layout.hits) {
    if (!h.etape || h.etape === moved) continue;
    const [x, y] = h.r;
    if (gx < x || gx >= x + PROG_NODE) continue;
    if (gy >= y - gap && gy < y + PROG_NODE * 0.3) return { etape: h.etape, mode: 'insert' };
    if (gy >= y + PROG_NODE * 0.3 && gy < y + PROG_NODE) return { etape: h.etape, mode: 'swap' };
  }

}

const SUPABASE_URL = 'https://hzgtnstmmbmmubvzxhas.supabase.co';

async function supa(path, { method = 'GET', body, auth = true, headers = {} } = {}) {
  let res;
  try {
    res = await fetch(SUPABASE_URL + path, {
      method,
      headers: {
        apikey: SUPABASE_KEY,
        'Content-Type': 'application/json',
        ...(auth && session ? { Authorization: `Bearer ${session.access_token}` } : {}),
        ...headers,

      body: body && JSON.stringify(body),

  if (!res.ok) {
    const msg = (data && (data.msg || data.message || data.error_description || data.error)) || `Erreur ${res.status}`;
    const err = new CloudError(msg);
    err.status = res.status;
    err.code = data && (data.error_code || data.code);
    throw err;
  }
  return data;
}
function sessionFrom(d) {
  return {
    access_token: d.access_token, refresh_token: d.refresh_token,
    expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600),

async function freshSession() {
  if (!session) return null;
  if (session.expires_at * 1000 - 60000 > Date.now()) return session;
  try {
    session = sessionFrom(await supa('/auth/v1/token?grant_type=refresh_token', { method: 'POST', auth: false, body: { refresh_token: session.refresh_token } }));
    saveSession();
  } catch (e) {
    if (e.status >= 400 && e.status < 500) { session = null; saveSession(); }

const localData = () => Object.fromEntries(SYNC_KEYS.map(k => [k, localStorage.getItem(k)]).filter(([, v]) => v != null));
// Compte à qui appartiennent les données de cet appareil (posé à chaque synchronisation). Les données d'un compte
// ne sont jamais envoyées dans un autre, et elles sont effacées de l'appareil à la déconnexion.
const OWNER_KEY = 'donnees-compte';

const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) | 0; return h; };

// on recharge la page si cet appareil reçoit des données d'un autre. force : envoie cet appareil tel quel (choix fait
// à la connexion : « Celles de cet appareil ») ; reload : false pendant la déconnexion (les données vont être effacées).
async function pushCloud({ force = false, reload = true } = {}) {
  if (pushing) return pushing;   // un seul envoi à la fois

    await freshSession();

    const row = force ? null : await pullCloud();

    const data = row && row.updated_at !== sync.at ? mergeData(local, row.data || {}) : local;
    const same = (a, b) => SYNC_KEYS.every(k => (a[k] ?? null) === (b[k] ?? null));

    Object.assign(sync, { dirty: false, base: snapshot(data) });

    setDataOwner(session.user.id);

      for (const k of SYNC_KEYS) try { data[k] == null ? localStorage.removeItem(k) : localStorage.setItem(k, data[k]); } catch {}
      location.reload();
