<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyBlock Menu</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html {
    background: #000;
  }
  html, body {
    margin: 0;
    height: 100%;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
                url('assets/background.webp') center / cover no-repeat;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #tooltip {
    position: fixed;
    pointer-events: none;
    z-index: 30;
  }
  /* Écran plein écran (question oui/non). */
  .screen {
    position: fixed;
    inset: 0;
    z-index: 20;
  }
  .screen[hidden] {
    display: none;
  }
  .screen canvas {
    position: absolute;
    inset: 0;
  }
  #signScreen {
    position: fixed;
    inset: 0;
    z-index: 20;
  }
  #signScreen[hidden] {
    display: none;
  }
  #signCanvas {
    position: absolute;
    inset: 0;
  }
  /* Champ invisible posé sur le panneau : reçoit la saisie (et ouvre le clavier numérique sur mobile). */
  #signInput {
    position: absolute;
    opacity: 0;
    font-size: 16px;
    border: 0;
    padding: 0;
    caret-color: transparent;
    resize: none;
    color: transparent;
    background: transparent;
  }
  /* Champs invisibles posés sur les cases de l'écran de connexion (le texte est dessiné sur le canvas). */
  .loginInput {
    position: absolute;
    opacity: 0;
    font-size: 16px;
    border: 0;
    padding: 0;
    margin: 0;
  }
  /* Pop-up Timer : vidéo cachée (source du mode image dans l'image) et timer flottant de secours. */
  #timerVideo {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  /* Notifications façon « succès » Minecraft, empilées en haut à droite ; elles descendent depuis le haut. */
  #toasts {
    position: fixed;
    top: 8px;
    right: 8px;
    align-items: flex-end;
    z-index: 45;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }
  #toasts canvas {
    transform: translateY(calc(-100% - 16px));
    transition: transform 0.35s ease-out;
  }
  #toasts canvas.shown {
    transform: none;
  }
  #timerCanvas {
    position: fixed;
    top: 8px;
    right: 8px;
    width: 240px;
    z-index: 40;
    cursor: pointer;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    -webkit-touch-callout: none;   /* pas de menu « Enregistrer l'image » à l'appui long */
    -webkit-user-select: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="gui"></canvas>
<canvas id="tooltip" hidden></canvas>
<div id="signScreen" hidden>
  <canvas id="signCanvas"></canvas>
  <textarea id="signInput" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Texte du panneau"></textarea>
</div>
<div id="timeblockScreen" class="screen" hidden>
  <canvas id="timeblockCanvas"></canvas>
</div>
<div id="photoScreen" class="screen" hidden>
  <canvas id="photoCanvas"></canvas>
</div>
<div id="loginScreen" class="screen" hidden>
  <canvas id="loginCanvas"></canvas>
  <input id="loginEmail" class="loginInput" type="email" autocomplete="username" autocapitalize="off" spellcheck="false" aria-label="E-mail">
  <input id="loginPassword" class="loginInput" type="password" autocomplete="current-password" aria-label="Mot de passe">
</div>
<div id="headScreen" class="screen" hidden>
  <canvas id="headCanvas"></canvas>
  <input id="headInput" class="loginInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Commande de la tête">
</div>
<div id="toasts"></div>
<div id="dialogScreen" class="screen" hidden>
  <canvas id="dialogCanvas"></canvas>
</div>
<script>
// Téléphone tenu en portrait : disposition mobile (coffre de 5 colonnes sur 11 rangées, voir mobileSlots).
// Ordinateur et téléphone en paysage : coffre de 9 x 6 habituel.
const touchScreen = matchMedia('(pointer: coarse)');
const isMobileLayout = () => touchScreen.matches && window.innerHeight > window.innerWidth;
const viewW = () => window.innerWidth;
const viewH = () => window.innerHeight;
const evX = ev => ev.clientX;
const evY = ev => ev.clientY;

// Interface "Profil Joueur" (coffre 6x9) reconstruite avec les textures Minecraft 1.20.4.
const TEX = 'assets/textures/';
const GUI_W = 176;
const GUI_H = 132;          // 125 lignes du haut de generic_54 + 7 lignes de bordure basse
// Disposition du coffre : 9 x 6 (ordinateur) ou 5 x 11 (téléphone en portrait, titre sur 2 lignes au besoin).
const MOBILE_W = 14 + 5 * 18, MOBILE_ROWS = 11, MOBILE_NAV = MOBILE_ROWS - 1, MOBILE_TITLE_LINES = 2;
function guiLayout() {
  if (!isMobileLayout()) return { mobile: false, cols: 9, rows: 6, w: GUI_W, h: GUI_H, top: 18, title: [pageTitle(state.page)] };
  const title = font ? wrapText(pageTitle(state.page), MOBILE_W - 16).slice(0, MOBILE_TITLE_LINES) : [''];
  const top = 18 + (title.length - 1) * 9;
  return { mobile: true, cols: 5, rows: MOBILE_ROWS, w: MOBILE_W, h: top - 1 + MOBILE_ROWS * 18 + 7, top, title };
}
const ITEM_SCALE = 0.85;   // taille des items (hors vitres) par rapport à la case

// Pages de l'interface. Chaque page : un titre + le contenu des cases (ligne, colonne) ;
// les cases absentes = vitre teintée noire.
//   item / block / head / image : l'item affiché (image = fichier PNG utilisé tel quel) ;  pane : vitre colorée décorative (pas un item, pas d'overlay)
//   tooltip : lignes de l'overlay au survol (1re ligne = nom). Codes couleur Minecraft : §a vert, §7 gris, §e jaune…
//   open : page ouverte au clic ;  action : fonction appelée au clic (ex. ouvrir un panneau de saisie)
//   tooltip peut aussi être une fonction qui renvoie les lignes (contenu dynamique)
//   look : fonction qui peut changer l'apparence ({ item/block : autre texture, dim : assombri }), sans toucher au numéro
// Contenu provisoire, à remplacer par les vrais textes.
const LORE = ['§7Description à venir.', '', '§eClique pour voir !'];

// Boutons de navigation en bas d'une sous-page :
//   barrière = retour à la page principale (toujours) ;
//   flèche à sa gauche = retour à la page précédente, seulement si ce n'est pas la page principale.
function navSlots(previous) {
  const slots = { '5,4': { item: 'barrier', tooltip: ['§cFermer', '', '§eClique pour revenir au menu !'], open: 'main' } };
  if (previous !== 'main')
    slots['5,3'] = { item: 'arrow', tooltip: () => ['§aRetour', `§7Vers ${pageTitle(previous)}`], open: previous };
  return slots;
}
// Contenu commun des pages « Serment S … » :
//   4 tableaux numérotés 1 à 4 (carré 2x2) et 12 blocs de terre cuite bleue numérotés 1 à 12 (2 colonnes x 6 lignes),
//   numérotés de gauche à droite puis de haut en bas (numéros ajoutés automatiquement, voir numberDuplicates).
// Une saison = 3 mois, un round = 1 mois, comptés à partir de la date d'entrée (page « Durée des Serments »).
// Ex. saison 3 = mois 7 à 9 du serment, round 11 = mois 11.
// Une période est terminée quand on a atteint le jour qui suit sa fin.
function toDate(date) {
  const [d, m, y] = date.split('/').map(Number);
  return new Date(y, m - 1, d);
}
function periodDone(lastMonth) {
  if (!dates.start) return false;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return today >= toDate(addMonths(dates.start, lastMonth));
}
// Période en cours : aujourd'hui est entre le début du mois firstMonth et la fin du mois lastMonth.
function periodCurrent(firstMonth, lastMonth) {
  if (!dates.start) return false;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return today >= toDate(addMonths(dates.start, firstMonth - 1)) && today < toDate(addMonths(dates.start, lastMonth));
}
function periodTooltip(name, firstMonth, lastMonth) {
  return () => {
    const months = firstMonth === lastMonth ? `§8Mois ${firstMonth} du serment` : `§8Mois ${firstMonth} à ${lastMonth} du serment`;
    const period = dates.start
      ? [`§7Du §e${addMonths(dates.start, firstMonth - 1)}`, `§7au §e${dayBefore(addMonths(dates.start, lastMonth))}`]
      : ["§7Dates : §cdate d'entrée non définie"];
    const status = periodDone(lastMonth) ? ['§cTerminé'] : periodCurrent(firstMonth, lastMonth) ? ['§aEn cours'] : [];
    return [name, ...period, months, ...status, '', '§eClique pour voir !'];
  };
}
// n = numéro du serment ; chaque saison / round ouvre sa page « Les 3 Frères ».
function sermentSlots(n) {
  const slots = {};
  for (let i = 0; i < 4; i++) {
    const k = i + 1;
    slots[`${2 + Math.floor(i / 2)},${1 + i % 2}`] = {
      item: 'painting', tooltip: periodTooltip(`§aSaison ${k}`, 3 * i + 1, 3 * k), open: `freres-${n}-saison${k}`,
      // saison terminée : tableau assombri ; saison en cours : numéro « +k » en vert
      look: () => periodDone(3 * k) ? { dim: true } : periodCurrent(3 * i + 1, 3 * k) ? { count: `+${k}`, countColor: '#55FF55' } : null,
    };
  }
  for (let i = 0; i < 12; i++) {
    const k = i + 1;
    slots[`${Math.floor(i / 2)},${6 + i % 2}`] = {
      block: 'blue_terracotta', tooltip: periodTooltip(`§aRound ${k}`, k, k), open: `freres-${n}-round${k}`,
      // round terminé : terre cuite noire ; round en cours : terre cuite verte
      look: () => periodDone(k) ? { block: 'black_terracotta' } : periodCurrent(k, k) ? { block: 'green_terracotta' } : null,
    };
  }
  return slots;
}
// Une colonne de la page « Les Pilliers Temporels » : le livre du serment en haut, puis 3 vitres colorées en dessous
// (serment 1 : tout vert, serment 2 : vert / jaune / rouge, serment 3 : tout rouge).
const SERMENT_PANES = {
  1: ['lime_stained_glass', 'lime_stained_glass', 'lime_stained_glass'],
  2: ['lime_stained_glass', 'yellow_stained_glass', 'red_stained_glass'],
  3: ['red_stained_glass', 'red_stained_glass', 'red_stained_glass'],
};
function sermentColumn(col, n) {
  const panes = SERMENT_PANES[n];
  const slots = { [`0,${col}`]: { item: 'book', tooltip: sermentBookTooltip(n), open: `serment${n}` } };
  panes.forEach((pane, i) => { slots[`${i + 1},${col}`] = { pane }; });
  return slots;
}

// Date d'entrée des serments, saisie sur un panneau et gardée dans ce navigateur ;
// la date de fin en est déduite (date d'entrée + 1 an).
const DATES_KEY = 'serments-dates';
const DATE_FIELDS = {
  start: { name: "§aDate d'entrée", title: "Modifier la date d'entrée", label: "Date d'entrée" },
};
function loadDates() {
  try { return JSON.parse(localStorage.getItem(DATES_KEY)) || {}; } catch { return {}; }
}
const dates = loadDates();
function saveDates() {
  try { localStorage.setItem(DATES_KEY, JSON.stringify(dates)); } catch {}
  cloudChanged();
}
function dateSlot(field) {
  const f = DATE_FIELDS[field];
  return {
    item: 'clock_00',
    action: () => openDateSign(field),
    tooltip: () => [f.name, dates[field] ? `§7Date : §e${dates[field]}` : '§7Date : §cnon définie', '', '§eClique pour modifier !'],
  };
}

// Calculs sur les dates "JJ/MM/AAAA".
const pad2 = n => String(n).padStart(2, '0');
const formatDate = dt => `${pad2(dt.getDate())}/${pad2(dt.getMonth() + 1)}/${dt.getFullYear()}`;
// Ajoute k mois ; si le jour n'existe pas dans le mois d'arrivée, on prend le dernier jour
// ("31/01/2026" + 1 mois -> "28/02/2026", "29/02/2028" + 12 mois -> "28/02/2029").
function addMonths(date, k) {
  const [d, m, y] = date.split('/').map(Number);
  const target = new Date(y, m - 1 + k, 1);
  const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
  target.setDate(Math.min(d, lastDay));
  return formatDate(target);
}
function dayBefore(date) {
  const [d, m, y] = date.split('/').map(Number);
  return formatDate(new Date(y, m - 1, d - 1));
}
const plusOneYear = date => addMonths(date, 12);
function endDateSlot() {
  return {
    item: 'clock_00',
    tooltip: () => [
      '§cDate de fin',
      dates.start ? `§7Date : §e${plusOneYear(dates.start)}` : '§7Date : §cnon définie',
      "§8Date d'entrée + 1 an",
    ],
  };
}

// Édition « titre puis description » via deux panneaux successifs (tête de profil, serments).
function descLines(description) {
  const desc = (description || '').split('\n');
  while (desc.length && !desc[desc.length - 1].trim()) desc.pop();   // retire les lignes vides de la fin
  return desc.map(l => '§7' + l);
}
// Répartit un texte sur plusieurs lignes de panneau (coupure entre les mots).
function wrapForSign(text, maxLines) {
  const lines = [''];
  for (const word of text.split(/\s+/).filter(Boolean)) {
    const cur = lines[lines.length - 1], next = cur ? cur + ' ' + word : word;
    if (textWidth(font, next) <= SIGN_W || !cur) lines[lines.length - 1] = next;
    else if (lines.length < maxLines) lines.push(word);
    else break;
  }
  return lines.join('\n');
}
// target = { label (ex. "du profil"), titleLines, titleHint (ligne d'aide sous le titre),
//            get() -> {title, description}, save(title, description) }
function editTitleAndDescription(target) {
  const current = target.get();
  const n = target.titleLines || 1;
  const fixed = ['', '', '', ''];
  fixed[n] = '^^^^^^^^^^^^';
  fixed[n + 1] = target.titleHint || `Titre ${target.label}`;
  openSign({
    title: `Modifier le titre ${target.label}`,
    lines: n, fixed,
    initial: wrapForSign(current.title || '', n),
    onDone: text => {
      const title = text.split('\n').map(l => l.trim()).filter(Boolean).join(' ');
      target.save(title, current.description || '');
      openSign({
        title: `Modifier la description ${target.label}`,
        lines: 4, fixed: [],
        initial: current.description || '',
        onDone: desc => { target.save(title, desc); if (target.after) target.after(); },
      });
    },
  });
}
// État du compte (sauvegarde en ligne, voir plus bas) : déclaré ici car les enregistrements faits pendant le
// chargement (ex. suppression des actions terminées depuis 30 jours) passent déjà par cloudChanged().
const SESSION_KEY = 'compte-session', SYNC_STATE_KEY = 'compte-sync';   // pas synchronisées elles-mêmes
let session = (() => { try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { return null; } })();
// sync.at : version (updated_at) du compte déjà présente ici ; sync.dirty : modifications locales pas encore envoyées
const sync = (() => { try { return JSON.parse(localStorage.getItem(SYNC_STATE_KEY)) || {}; } catch { return {}; } })();
let pushTimer = null, pushing = null;
const saveSession = () => { try { session ? localStorage.setItem(SESSION_KEY, JSON.stringify(session)) : localStorage.removeItem(SESSION_KEY); } catch {} };
const saveSyncState = () => { try { localStorage.setItem(SYNC_STATE_KEY, JSON.stringify(sync)); } catch {} };
function loadJSON(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  cloudChanged();
}

// Tête « Ton profil ».
const PROFILE_KEY = 'profil';
const profile = loadJSON(PROFILE_KEY);
function profileTooltip() {
  const desc = descLines(profile.description);
  return ['§a' + (profile.title || 'Ton profil'), ...(desc.length ? desc : ['§7Description à venir.'])];
}
function editProfile() {
  editTitleAndDescription({
    label: 'du profil',
    get: () => profile,
    save: (title, description) => { Object.assign(profile, { title, description }); saveJSON(PROFILE_KEY, profile); },
    after: openHeadImport,   // puis : importer une tête (commande Minecraft)
  });
}

// Serments : nom et description modifiables (page « Renommer les Serments »).
// Le début « Serment S n - » est fixe : seule la suite du nom (suffix) se modifie.
const SERMENTS_KEY = 'serments-noms';
const SERMENT_DEFAULTS = { 1: '12K/Mois', 2: '75Kg Sec', 3: '' };
const sermentInfo = loadJSON(SERMENTS_KEY);
const sermentPrefix = n => `Serment S ${n}`;
// Anciennes données (titre complet) : on ne garde que ce qui suit « Serment S n - ».
for (const [n, info] of Object.entries(sermentInfo))
  if (info.suffix == null && info.title != null)
    info.suffix = info.title.replace(new RegExp(`^${sermentPrefix(n)}\\s*-?\\s*`), '');
function sermentSuffix(n) {
  const info = sermentInfo[n];
  return info && info.suffix != null ? info.suffix : SERMENT_DEFAULTS[n];
}
const sermentTitle = n => sermentSuffix(n) ? `${sermentPrefix(n)} - ${sermentSuffix(n)}` : sermentPrefix(n);
function editSerment(n) {
  editTitleAndDescription({
    label: 'du serment', titleHint: `${sermentPrefix(n)} - ...`,
    get: () => ({ title: sermentSuffix(n), description: (sermentInfo[n] && sermentInfo[n].description) || '' }),
    save: (suffix, description) => { sermentInfo[n] = { suffix, description }; saveJSON(SERMENTS_KEY, sermentInfo); },
  });
}
function sermentBookTooltip(n) {
  return () => {
    const desc = descLines(sermentInfo[n] && sermentInfo[n].description);
    return ['§a' + sermentTitle(n), ...(desc.length ? desc : ['§7Description à venir.']), '', '§eClique pour voir !'];
  };
}

// --- Liste de choses à faire ---
// Chaque action : { titre, description, date, fini (date de fin, si terminée), image (image gardée une fois terminée) }.
// Actions en cours numérotées de la plus ancienne (1) à la plus récente ; l'image alterne entre 5 images :
// action 1 -> image 1, …, action 5 -> image 5, action 6 -> image 1, etc.
// Page « Liste de choses à faire » : les actions en cours ; page « Actions terminées » : les terminées,
// gardées 30 jours puis supprimées automatiquement.
// Rangées de gauche à droite puis de haut en bas dans la zone de 4x7 cases, la plus récente en haut à gauche.
const TODO_KEY = 'todo-actions';
const TODO_KEEP_DAYS = 30;
const todos = (() => { try { return JSON.parse(localStorage.getItem(TODO_KEY)) || []; } catch { return []; } })();
// Nombre total d'actions terminées depuis le début (les terminées sont effacées après TODO_KEEP_DAYS jours,
// donc on le compte à part) ; au premier lancement, on part des terminées encore présentes.
const TODO_STATS_KEY = 'todo-stats';
const todoStats = loadJSON(TODO_STATS_KEY);
todoStats.finies ??= todos.filter(t => t.fini).length;
// Anciennes actions (un seul texte) : le texte devient le titre.
for (const t of todos) if (t.titre == null) {
  t.titre = (t.texte || '').split('\n').map(l => l.trim()).filter(Boolean).join(' ');
  t.description = '';
  delete t.texte;
}
// Coupe un texte en lignes d'au plus w pixels (entre les mots) ; les retours à la ligne sont gardés.
function wrapText(text, w) {
  return text.split('\n').flatMap(line => {
    const out = [''];
    for (const word of line.split(' ')) {
      const cur = out[out.length - 1], next = cur ? cur + ' ' + word : word;
      if (!cur || textWidth(font, next) <= w) out[out.length - 1] = next;
      else out.push(word);
    }
    return out;
  });
}
const TODO_ROWS = 4, TODO_COLS = 7;
function saveTodos() {
  try { localStorage.setItem(TODO_KEY, JSON.stringify(todos)); } catch {}
  cloudChanged();
}
const addDays = (date, n) => { const d = toDate(date); d.setDate(d.getDate() + n); return d; };
// Supprime les actions terminées depuis 30 jours ou plus.
function purgeOldTodos() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const keep = todos.filter(t => !t.fini || addDays(t.fini, TODO_KEEP_DAYS) > today);
  if (keep.length !== todos.length) {
    todos.splice(0, todos.length, ...keep);
    saveTodos();
  }
}
purgeOldTodos();

const TODO_IMAGES = 5;
const todoImage = n => `actions/${(n - 1) % TODO_IMAGES + 1}`;
// Place une liste d'actions (la première en haut à gauche) dans la zone 4x7.
// numbers : numéro affiché de chaque action (actions en cours) ; sinon pas de numéro.
function todoGrid(list, slots, numbers) {
  const mobile = isMobileLayout();
  list.slice(0, mobile ? (MOBILE_NAV - 1) * 3 : TODO_ROWS * TODO_COLS).forEach((todo, i) => {
    const n = numbers ? numbers[i] : null;
    // téléphone : 3 par rangée (colonnes 1 à 3, rien sur les bords ; rangées 1 à 9), clé mobile « m… » ;
    // ordinateur : 7 par rangée (rangées 1 à 4)
    const key = mobile ? `m${1 + Math.floor(i / 3)},${1 + i % 3}` : `${1 + Math.floor(i / TODO_COLS)},${1 + i % TODO_COLS}`;
    slots[key] = {
      image: n ? todoImage(n) : (todo.image || todoImage(1)),
      count: n,
      // Fonction : la description est découpée à l'affichage (la police n'est pas encore chargée au démarrage).
      tooltip: () => [
        '§a' + (todo.titre || 'Action'),
        ...(todo.description ? wrapText(todo.description, 180).map(l => '§7' + l) : []), '',
        `§8Ajoutée le ${todo.date}`,
        ...(todo.fini
          ? [`§cTerminée le ${todo.fini}`, `§8Supprimée le ${formatDate(addDays(todo.fini, TODO_KEEP_DAYS))}`, '', '§eClique pour supprimer !']
          : ['§eClique quand elle est terminée !']),
      ],
      action: () => todo.fini ? askTodoDelete(todo) : askTodoDone(todo),
    };
  });
  return slots;
}
function todoSlots() {
  const active = todos.filter(t => !t.fini);   // de la plus ancienne à la plus récente
  const newestFirst = [...active].reverse();
  return todoGrid(newestFirst, {
    '5,0': { image: 'bouton_bois', tooltip: ['§aActions terminées', `§7Les actions terminées depuis moins`, `§7de ${TODO_KEEP_DAYS} jours.`, '', '§eClique pour voir !'], open: 'todo-finies' },
    '5,8': { image: 'tete_plus', tooltip: ['§aAjouter', '§7Ajoute une action à faire.', '', '§eClique pour ajouter !'], action: addTodo },
    ...navSlots('main'),
  }, newestFirst.map((_, i) => active.length - i));
}
function doneTodoSlots() {
  const done = todos.filter(t => t.fini).sort((a, b) => toDate(b.fini) - toDate(a.fini));   // la plus récemment terminée d'abord

// Titre sur un panneau (une seule ligne), puis description dans un livre.
// onSave(titre, description) ; le titre vide annule.
function editTodoText(todo, onSave) {
  openSign({
    title: todo ? "Modifier le titre de l'action" : "Titre de l'action",
    lines: 1, fixed: ['', '^^^^^^^^^^^^', "Titre de l'action", ''],
    initial: todo ? todo.titre : '',
    onDone: text => {

      if (!titre) return;
      openSign({
        book: true, noBullets: true, title: titre,
        lines: BOOK_LINES, width: BOOK_TEXT_W, fixed: [],
        initial: todo ? todo.description : '',

        onCancel: () => onSave(titre, todo ? todo.description : ''),   // Échap : garde au moins le titre
      });

// Ajouter : titre (panneau) -> description (livre) -> action ajoutée.
function addTodo() {
  editTodoText(null, (titre, description) => {
    todos.push({ titre, description, date: formatDate(new Date()) });
    saveTodos();
    refreshTodo();
  });
}
// Oui = terminée (passe dans « Actions terminées ») ; Non = en cours ; Supprimer = retirée.
// Action terminée : on propose seulement de la supprimer (sinon elle part toute seule après TODO_KEEP_DAYS jours).
function askTodoDelete(todo) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = Math.max(1, Math.round((addDays(todo.fini, TODO_KEEP_DAYS) - today) / 864e5));
  openConfirm({
    question: 'Supprimer cette action ?',
    detail: [todo.titre, '', `Elle sera supprimée automatiquement dans ${days} jour${days > 1 ? 's' : ''}.`],
    noLabel: 'Retour', yesLabel: '§cSupprimer',
    onYes: () => {
      const i = todos.indexOf(todo);
      if (i >= 0) todos.splice(i, 1);
      // supprimée à la main : ne compte plus dans le total (la suppression automatique après 30 jours, elle, le garde)
      todoStats.finies = Math.max(0, todoStats.finies - 1);
      saveJSON(TODO_STATS_KEY, todoStats);
      saveTodos();
      refreshTodo();
    },
  });
}
function askTodoDone(todo) {
  const update = change => { change(); saveTodos(); refreshTodo(); };
  openConfirm({
    question: "L'objectif est-il terminé ?",
    detail: [todo.titre],
    onYes: () => update(() => {
      if (todo.fini) return;
      const active = todos.filter(t => !t.fini);
      todo.image = todoImage(active.indexOf(todo) + 1);   // garde l'image qu'elle avait
      todo.fini = formatDate(new Date());
      todoStats.finies++;
      saveJSON(TODO_STATS_KEY, todoStats);
      playSound(doneSound);
    }),
    onNo: () => update(() => { delete todo.fini; delete todo.image; }),
    onEdit: () => editTodoText(todo, (titre, description) => update(() => Object.assign(todo, { titre, description }))),
    onDelete: () => update(() => { const i = todos.indexOf(todo); if (i >= 0) todos.splice(i, 1); }),
  });
}

// --- Agenda de la journée ---
// Chaque agenda : { date: "JJ/MM/AAAA", texte } (une ligne = un objectif), un par jour.
// Page « Agenda de la journée » : les 7 derniers (datés d'il y a 7 jours au plus), numérotés 1 = le plus récent ;
// les plus anciens sont sur la page « Autres Journées ».
const AGENDA_KEY = 'agendas';
const agendas = (() => { try { return JSON.parse(localStorage.getItem(AGENDA_KEY)) || []; } catch { return []; } })();
function saveAgendas() {
  try { localStorage.setItem(AGENDA_KEY, JSON.stringify(agendas)); } catch {}
  cloudChanged();
}
const tomorrow = () => formatDate(new Date(Date.now() + 864e5));
function splitAgendas() {
  const sorted = [...agendas].sort((a, b) => toDate(b.date) - toDate(a.date));   // le plus récent d'abord
  const limit = new Date();
  limit.setHours(0, 0, 0, 0);
  limit.setDate(limit.getDate() - 7);
  const recent = sorted.filter(a => toDate(a.date) >= limit).slice(0, 7);
  return { recent, older: sorted.filter(a => !recent.includes(a)) };
}
// Page principale : papier ; page « Autres Journées » : carte vide.
function agendaSlot(agenda, n, image) {
  const lines = agenda.texte.split('\n').map(l => l.trim()).filter(Boolean);
  return {
    image, count: n,
    tooltip: ['§aAgenda ' + agenda.date, ...(lines.length ? lines.map(l => '§g- ' + l) : ['§7Aucun objectif.']), '', '§eClique pour voir !'],
    action: () => editAgenda(agenda.date),
  };
}
// Bilan de la journée : bloc de terre cuite sous l'agenda (blanche tant qu'il n'est pas fait,
// puis rouge / verte / jaune selon la journée) ; agenda.bilan = { note, texte }.
const BILANS = {
  mauvaise: { label: '§cMauvaise journée', image: 'journee/rouge', question: 'Pourquoi la journée a été mauvaise ?' },
  bonne: { label: '§aBonne journée', image: 'journee/verte', question: "Décris ce qui a marché aujourd'hui et ce que tu aurais pu mieux faire" },
  tres_bonne: { label: '§eTrès bonne journée', image: 'journee/jaune', question: "Les résultats d'une journée idéale" },
};
function bilanSlot(agenda, n) {
  const b = agenda.bilan && BILANS[agenda.bilan.note];
  return {
    image: b ? b.image : 'journee/blanche', count: n,
    tooltip: () => [
      '§aDécris ta journée', '§7Agenda ' + agenda.date,
      ...(b ? ['', b.label, ...(agenda.bilan.texte ? wrapText(agenda.bilan.texte, 180).map(l => '§7' + l) : [])] : []),
      '', b ? '§eClique pour modifier !' : '§eClique pour décrire !',
    ],
    action: () => reviewDay(agenda),
  };
}
// « Comment s'est passé ta journée ? » -> choix -> livre avec la question correspondante.
function reviewDay(agenda) {
  const pick = note => {
    const previous = agenda.bilan || {};
    agenda.bilan = { note, texte: previous.texte || '' };   // la couleur change tout de suite
    saveAgendas();
    refreshAgenda();
    const q = BILANS[note].question;
    openSign({
      book: true, noBullets: true, title: q,
      lines: bookLinesFor(q), width: BOOK_TEXT_W, fixed: [],
      initial: agenda.bilan.texte,
      onDone: text => { agenda.bilan.texte = text.trim(); saveAgendas(); refreshAgenda(); },
    });
  };
  openConfirm({
    question: "Comment s'est passé ta journée ?",
    detail: ['Agenda ' + agenda.date],
    buttonWidth: 110,
    noLabel: '§cMauvaise journée', yesLabel: '§aBonne journée', editLabel: '§eTrès bonne journée',
    onNo: () => pick('mauvaise'), onYes: () => pick('bonne'), onEdit: () => pick('tres_bonne'),
  });
}
// Place les agendas (le premier en haut à gauche) dans la zone verte, avec leur bilan juste en dessous :
// agendas sur les rangées 1 et 3, bilans sur les rangées 2 et 4 (7 journées par paire de rangées).
function agendaGrid(list, slots, numbered) {
  list.slice(0, agendasPerPage()).forEach((a, i) => {
    // téléphone : 5 journées par paire de rangées, une rangée vide entre deux paires (rangées 1-2, 4-5 et 7-8),
    // clés mobiles « m… »
    const mobile = isMobileLayout(), per = mobile ? 5 : TODO_COLS, m = mobile ? 'm' : '';
    const row = 1 + (mobile ? 3 : 2) * Math.floor(i / per), col = (mobile ? 0 : 1) + i % per, n = numbered ? i + 1 : null;
    slots[`${m}${row},${col}`] = agendaSlot(a, n, numbered ? 'papier_agenda' : 'carte_vide');
    slots[`${m}${row + 1},${col}`] = bilanSlot(a, n);
  });
  return slots;
}
function agendaSlots() {
  return agendaGrid(splitAgendas().recent, {
    '5,0': { image: 'bouton_pierre', tooltip: ['§aAutres Journées', '§7Les agendas de plus de 7 jours.', '', '§eClique pour voir !'], open: 'agenda-autres' },
    '0,8': { image: 'beacon', tooltip: bilanStats },
    // Tant que l'agenda d'aujourd'hui n'est pas écrit, la tête propose celui d'aujourd'hui (puis celui de demain).
    '5,8': {
      image: 'tete_plus_bleue', action: () => editAgenda(agendaToWrite()),
      tooltip: () => {
        const today = agendaToWrite() !== tomorrow();
        return ['§aAgenda ' + agendaToWrite(), `§7Écris les objectifs ${today ? "d'aujourd'hui" : 'de demain'}.`, '', '§eClique pour écrire !'];
      },
    },
    ...navSlots('main'),
  }, true);
}
// Balise (en haut à droite de l'agenda) : part et nombre de mauvaises / bonnes / très bonnes journées
// parmi tous les agendas qui ont un bilan.
function bilanStats() {
  const notes = agendas.map(a => a.bilan && a.bilan.note).filter(n => BILANS[n]);
  const rows = [['mauvaise', 'MJ'], ['bonne', 'BJ'], ['tres_bonne', 'TBJ']].map(([note, short]) => {
    const n = notes.filter(x => x === note).length, pct = notes.length ? Math.round(n / notes.length * 100) : 0;
    return `${BILANS[note].label} §7: §f${pct}% §8(${n} ${short})`;
  });
  return ['§bBilan des journées', ...rows, '', `§7${notes.length} journée${notes.length > 1 ? 's' : ''} notée${notes.length > 1 ? 's' : ''}`];
}
const agendaToWrite = () => { const today = formatDate(new Date()); return agendas.some(a => a.date === today) ? tomorrow() : today; };
// « Autres Journées » : tous les anciens agendas (aucun n'est supprimé), 14 par page (15 sur téléphone) ; flèche en bas à droite
// vers la page suivante, en bas à gauche vers la précédente, et près de la barrière pour revenir à l'agenda.
const agendasPerPage = () => isMobileLayout() ? 15 : 2 * TODO_COLS;   // téléphone : 15 (3 paires de rangées)
const olderAgendaPageId = k => k === 1 ? 'agenda-autres' : `agenda-autres-${k}`;
function olderAgendaSlots(k = 1) {
  const older = splitAgendas().older, pages = Math.max(1, Math.ceil(older.length / agendasPerPage()));
  const slots = { ...navSlots('agenda') };
  if (k > 1) slots['5,0'] = { item: 'arrow', tooltip: ['§aPage précédente', `§7Page ${k - 1}`], open: olderAgendaPageId(k - 1) };
  if (k < pages) slots['5,8'] = { item: 'arrow', tooltip: ['§aPage suivante', `§7Page ${k + 1}`], open: olderAgendaPageId(k + 1) };
  return agendaGrid(older.slice((k - 1) * agendasPerPage(), k * agendasPerPage()), slots, false);
}
function refreshAgenda() {
  PAGES.agenda.slots = agendaSlots();
  for (const id of Object.keys(PAGES)) if (/^agenda-autres-\d+$/.test(id)) delete PAGES[id];
  const pages = Math.max(1, Math.ceil(splitAgendas().older.length / agendasPerPage()));
  for (let k = 1; k <= pages; k++) {
    if (k === 1) PAGES['agenda-autres'].slots = olderAgendaSlots(1);
    else PAGES[olderAgendaPageId(k)] = { title: PAGE_TITLES['agenda-autres'], slots: olderAgendaSlots(k) };
  }
  if (state.page.startsWith('agenda') && PAGES[state.page]) renderGui();
}
// Ouvre le livre de l'agenda de cette date (le crée s'il n'existe pas encore).
// text : texte déjà tapé mais pas encore enregistré (retour depuis le Timeblock).
function editAgenda(date, text) {
  const existing = agendas.find(a => a.date === date);
  openSign({
    book: true, title: 'Objectifs de la journée',
    lines: BOOK_LINES, width: BOOK_TEXT_W, fixed: [],
    initial: text != null ? text : existing ? existing.texte : '',
    onExtra: typed => openTimeblock(date, () => editAgenda(date, typed)),
    onDone: text => {
      const clean = text.split('\n').filter(l => l.trim()).join('\n');
      const i = agendas.findIndex(a => a.date === date);
      if (!clean) { if (i >= 0) agendas.splice(i, 1); }   // livre vide : pas d'agenda
      else if (i >= 0) agendas[i].texte = clean;
      else agendas.push({ date, texte: clean });
      saveAgendas();
      refreshAgenda();
    },
  });
}

// Numérotation automatique : quand un même item apparaît plusieurs fois sur une page, chaque exemplaire
// reçoit un numéro (1, 2, 3…) de gauche à droite puis de haut en bas, affiché en bas à droite de la case.
// Un item unique sur sa page n'a pas de numéro. On peut forcer un numéro avec `count`.
function numberDuplicates(slots) {
  const groups = {};
  const keys = Object.keys(slots).sort((a, b) => {
    const [ra, ca] = a.split(',').map(Number), [rb, cb] = b.split(',').map(Number);
    return ra - rb || ca - cb;
  });
  for (const key of keys) {
    const slot = slots[key];
    const type = slot.item || slot.block || slot.head || slot.image;
    if (type) (groups[type] ||= []).push(slot);
  }
  for (const group of Object.values(groups))
    if (group.length > 1) group.forEach((slot, i) => { if (slot.count == null) slot.count = i + 1; });
}

// Montre en bas à droite de la page quand demain tombe dans la saison / le round : numéro = jour de demain,
// clic = agenda de demain.
// key : case de la montre (en bas à droite) ; uniquement sur les pages de round.
function tomorrowClock(firstMonth, lastMonth, key) {
  const inPeriod = () => {
    if (!dates.start) return false;
    const t = toDate(tomorrow());
    return t >= toDate(addMonths(dates.start, firstMonth - 1)) && t < toDate(addMonths(dates.start, lastMonth));
  };
  return {
    [key]: {
      item: 'clock_00', when: inPeriod,
      count: () => toDate(tomorrow()).getDate(),
      tooltip: () => ['§aAgenda ' + tomorrow(), '§7Demain fait partie de cette période.', '', '§eClique pour écrire !'],
      action: () => editAgenda(tomorrow()),
    },
  };
}
// Round en cours (1 à 12) d'après la date d'entrée, ou null.
function currentRound() {
  if (!dates.start) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  for (let r = 1; r <= 12; r++)

function load(name) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res([name, img]);
    img.onerror = rej;
    img.src = TEX + name + '.png';
  });

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  return [c, ctx];
}

// Découpe une zone d'une texture (ex. le coffre) vers une nouvelle texture.
function crop(img, x, y, w, h) {
  const [c, ctx] = makeCanvas(w, h);
  ctx.drawImage(img, x, y, w, h, 0, 0, w, h);
  return c;
}

// Texture de tête 8x8 à partir d'une palette et d'une grille de caractères.
function pixelTex(palette, rows) {
  const [c, ctx] = makeCanvas(8, 8);
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    ctx.fillStyle = palette[ch];
    ctx.fillRect(x, y, 1, 1);
  }));
  return c;
}

// --- Police Minecraft : ascii.png (glyphes 8x8) + accented.png (glyphes 9x12, accents) ---
const MC_COLORS = {
  0: '#000000', 1: '#0000AA', 2: '#00AA00', 3: '#00AAAA', 4: '#AA0000', 5: '#AA00AA', 6: '#FFAA00', 7: '#AAAAAA',
  8: '#555555', 9: '#5555FF', a: '#55FF55', b: '#55FFFF', c: '#FF5555', d: '#FF55FF', e: '#FFFF55', f: '#FFFFFF',
  g: '#D4D4D4',   // (propre au site) gris un peu plus clair que §7, pour le texte saisi dans les descriptions
};

// Largeur réelle d'un glyphe = dernière colonne non transparente + 1.
function glyphWidth(data, stride, gx, gy, cw, ch) {
  for (let x = cw - 1; x >= 0; x--)
    for (let y = 0; y < ch; y++)
      if (data[((gy + y) * stride + gx + x) * 4 + 3] > 0) return x + 1;
  return 0;
}

function buildFont(ascii, accented, accentedChars) {
  const glyphs = new Map();
  const read = img => {
    const [, ctx] = makeCanvas(img.width, img.height);
    ctx.drawImage(img, 0, 0);
    return ctx.getImageData(0, 0, img.width, img.height).data;
  };
  const a = read(ascii);
  for (let code = 32; code < 127; code++) {
    const sx = (code % 16) * 8, sy = Math.floor(code / 16) * 8;
    const w = code === 32 ? 3 : glyphWidth(a, ascii.width, sx, sy, 8, 8);
    glyphs.set(String.fromCharCode(code), { img: ascii, sx, sy, sw: 8, sh: 8, dy: 0, adv: w + 1 });
  }
  const b = read(accented);
  accentedChars.forEach((row, r) => [...row].forEach((chr, c) => {
    if (chr === '\u0000' || glyphs.has(chr)) return;
    const sx = c * 9, sy = r * 12;
    glyphs.set(chr, { img: accented, sx, sy, sw: 9, sh: 12, dy: -3, adv: glyphWidth(b, accented.width, sx, sy, 9, 12) + 1 });
  }));
  // « • » : gros point carré (3x3), le même que devant les lignes des livres.
  const [dot, dctx] = makeCanvas(3, 8);
  dctx.fillStyle = '#FFFFFF';
  dctx.fillRect(0, 2, 3, 3);
  glyphs.set('•', { img: dot, sx: 0, sy: 0, sw: 3, sh: 8, dy: 0, adv: 4 });
  return { glyphs, tinted: new Map() };
}

// Découpe un texte avec codes § en segments { text, color, bold }.
function parseFormatted(text, defaultColor) {
  const segs = [];
  let color = defaultColor, bold = false, buf = '';
  const flush = () => { if (buf) segs.push({ text: buf, color, bold }); buf = ''; };
  for (let i = 0; i < text.length; i++) {
    if (text[i] === '§' && i + 1 < text.length) {
      const k = text[++i].toLowerCase();
      flush();
      if (MC_COLORS[k]) { color = MC_COLORS[k]; bold = false; }
      else if (k === 'l') bold = true;
      else if (k === 'r') { color = defaultColor; bold = false; }
    } else buf += text[i];
  }
  flush();
  return segs;
}

function glyphOf(font, chr) {
  return font.glyphs.get(chr) || font.glyphs.get('?');
}

function textWidth(font, text) {
  let w = 0;
  for (const seg of parseFormatted(text, '#fff'))
    for (const chr of seg.text) w += glyphOf(font, chr).adv + (seg.bold ? 1 : 0);
  return w;
}

// Glyphe teinté (mis en cache par caractère + couleur).
function tintedGlyph(font, g, color) {
  const key = `${g.img.width}:${g.sx}:${g.sy}:${color}`;
  let c = font.tinted.get(key);
  if (!c) {
    let ctx;
    [c, ctx] = makeCanvas(g.sw, g.sh);
    ctx.drawImage(g.img, g.sx, g.sy, g.sw, g.sh, 0, 0, g.sw, g.sh);
    ctx.globalCompositeOperation = 'source-in';
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, g.sw, g.sh);
    font.tinted.set(key, c);
  }
  return c;
}

function shadowColor(hex) {
  const n = parseInt(hex.slice(1), 16);
  const q = v => (v >> 2).toString(16).padStart(2, '0');
  return '#' + q((n >> 16) & 255) + q((n >> 8) & 255) + q(n & 255);
}

// Dessine un texte (coordonnées en pixels GUI) ; shadow = ombre portée comme en jeu.
function drawText(ctx, font, text, x, y, color, S, shadow = false) {
  const segs = parseFormatted(text, color);
  const pass = (ox, oy, isShadow) => {
    let cx = x;
    for (const seg of segs) {
      const col = isShadow ? shadowColor(seg.color) : seg.color;
      for (const chr of seg.text) {
        const g = glyphOf(font, chr);
        const img = tintedGlyph(font, g, col);
        for (let b = 0; b <= (seg.bold ? 1 : 0); b++)
          ctx.drawImage(img, (cx + ox + b) * S, (y + oy + g.dy) * S, g.sw * S, g.sh * S);
        cx += g.adv + (seg.bold ? 1 : 0);
      }
    }
  };
  if (shadow) pass(1, 1, true);
  pass(0, 0, false);
}

// --- Rendu isométrique des blocs (comme les items-blocs dans l'inventaire) ---
function drawFace(ctx, tex, origin, u, v, shade) {
  const tw = tex.width, th = tex.height;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(origin[0], origin[1]);
  ctx.lineTo(origin[0] + u[0], origin[1] + u[1]);
  ctx.lineTo(origin[0] + u[0] + v[0], origin[1] + u[1] + v[1]);
  ctx.lineTo(origin[0] + v[0], origin[1] + v[1]);
  ctx.closePath();
  ctx.clip();
  ctx.setTransform(u[0] / tw, u[1] / tw, v[0] / th, v[1] / th, origin[0], origin[1]);
  // léger débordement pour éviter les joints entre les faces
  ctx.drawImage(tex, -0.15, -0.15, tw + 0.3, th + 0.3);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (shade < 1) {
    ctx.fillStyle = `rgba(0,0,0,${1 - shade})`;
    ctx.fill();
  }
  ctx.restore();
}

function drawCube(ctx, faces, px, py, S, scale = 1) {
  // Géométrie dans une case de 16x16 pixels GUI, centrée.
  const k = S * scale, cx = px + 8 * S, cy = py + 8.5 * S;
  const P = (x, y) => [cx + x * k, cy + y * k];
  const L = P(-7, -4), T = P(0, -7.5), R = P(7, -4), C = P(0, -0.5), D = [0, 8 * k];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  drawFace(ctx, faces.top,   L, sub(T, L), sub(C, L), 1.0);
  drawFace(ctx, faces.front, L, sub(C, L), D, 0.8);
  drawFace(ctx, faces.side,  C, sub(R, C), D, 0.6);
}

// Faces d'une tête à partir d'un skin de joueur (64x64 ou 64x32, ou multiple) : tête + calque du chapeau.
// Le dessus est tourné d'un quart de tour pour que son bord avant touche la face avant du cube.
function headFaces(skin) {
  const k = skin.width / 64;
  const face = (bx, by, hx, hy, rotate) => {
    const [c, ctx] = makeCanvas(8, 8);
    if (rotate) ctx.setTransform(0, 1, -1, 0, 8, 0);   // (x, y) -> (8 - y, x)
    ctx.drawImage(skin, bx * k, by * k, 8 * k, 8 * k, 0, 0, 8, 8);
    ctx.drawImage(skin, hx * k, hy * k, 8 * k, 8 * k, 0, 0, 8, 8);   // chapeau / cheveux par-dessus
    return c;
  };
  return { top: face(8, 0, 40, 0, true), front: face(8, 8, 40, 8), side: face(16, 8, 48, 8) };
}

function chestFaces(img) {
  const top = crop(img, 28, 0, 14, 14);
  const [front, fctx] = makeCanvas(14, 14);
  fctx.drawImage(img, 42, 14, 14, 5, 0, 0, 14, 5);    // couvercle
  fctx.drawImage(img, 42, 34, 14, 9, 0, 5, 14, 9);    // base
  fctx.drawImage(img, 1, 1, 2, 4, 6, 2, 2, 4);        // loquet
  const [side, sctx] = makeCanvas(14, 14);
  sctx.drawImage(img, 28, 14, 14, 5, 0, 0, 14, 5);
  sctx.drawImage(img, 28, 34, 14, 9, 0, 5, 14, 9);
  return { top, front, side };
}

// --- Overlay (tooltip) au survol d'un item ---
const TOOLTIP_BG = 'rgba(10, 18, 30, 0.93)';
const TOOLTIP_BORDER_TOP = '#b9c9da', TOOLTIP_BORDER_BOTTOM = '#6d7f94';
const TOOLTIP_PADDING = 4;   // marge entre la bordure et le texte (pixels GUI)
// Échelle du texte de l'overlay : plus petite que celle de l'interface.
const tooltipScale = S => Math.max(2, Math.round(S * 0.65));

function renderTooltip(tipCanvas, font, lines, S) {
  const w = Math.max(...lines.map(l => textWidth(font, l)));
  const h = 8 + (lines.length - 1) * 10 + (lines.length > 1 ? 2 : 0);
  const edge = 2 + TOOLTIP_PADDING;           // fond (1 px) + bordure (1 px) + marge intérieure
  const W = w + 1 + 2 * edge, H = h + 1 + 2 * edge;   // +1 : ombre du texte
  const x0 = edge, y0 = edge;
  tipCanvas.width = W * S;
  tipCanvas.height = H * S;
  const ctx = tipCanvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const rect = (x, y, rw, rh, fill) => { ctx.fillStyle = fill; ctx.fillRect(x * S, y * S, rw * S, rh * S); };

  // Fond aux coins "coupés" + bordure intérieure en dégradé, comme en jeu.
  rect(1, 0, W - 2, H, TOOLTIP_BG);
  rect(0, 1, 1, H - 2, TOOLTIP_BG);
  rect(W - 1, 1, 1, H - 2, TOOLTIP_BG);
  const grad = ctx.createLinearGradient(0, S, 0, (H - 1) * S);
  grad.addColorStop(0, TOOLTIP_BORDER_TOP);

// Navigation entre pages via l'ancre de l'URL (#serments), pour que "Précédent" du navigateur marche.

  const page = location.hash.slice(1);
  state.page = PAGES[page] ? page : 'main';
  hideTooltip();
  if (state.page.startsWith('todo')) refreshTodo();   // retire les actions terminées depuis 30 jours
  if (state.page.startsWith('agenda')) refreshAgenda();   // les agendas de plus de 7 jours changent de page

// Son d'un bouton d'interface Minecraft (ui.button.click = random/click_stereo, volume 0.25 en jeu).
const clickSound = new Audio('assets/sounds/button.mp3');
clickSound.preload = 'auto';
clickSound.volume = 0.25;
// Son joué quand une action de la liste de choses à faire est terminée.
const doneSound = new Audio('assets/sounds/action-terminee.wav');
doneSound.preload = 'auto';
doneSound.volume = 0.6;
function playSound(sound) {
  const s = sound.cloneNode();   // clone : permet des sons rapprochés qui se chevauchent
  s.volume = sound.volume;
  s.play().catch(() => {});
}
const playClick = () => playSound(clickSound);

function onClick(ev) {
  if (press.long || Date.now() < press.blockUntil) return;   // téléphone : lâcher d'un appui long
  const slot = itemAt(slotAt(ev));
  if (!slot) return;
  playClick();
  if (slot.action) { slot.action(); return; }
  if (!slot.open) return;
  if (slot.open === 'main') history.pushState(null, '', location.pathname + location.search);
  else location.hash = slot.open;
  showPageFromHash();
}

// --- Panneau de saisie (comme l'écran d'édition de panneau de Minecraft) ---
// openSign(cfg) : cfg = {
//   title   : titre affiché au-dessus du panneau,
//   lines   : nombre de lignes modifiables (en haut du panneau, 1 à 4),
//   fixed   : textes des lignes non modifiables (index 0 à 3),
//   initial : texte de départ (lignes séparées par \n),
//   numeric : clavier numérique + chiffres seulement,  transform(text) : mise en forme pendant la frappe,
//   validate(text) : false = saisie refusée (affichée en rouge),  onDone(text) : appelé après « Terminé » }
const signScreen = document.getElementById('signScreen');
const signCanvas = document.getElementById('signCanvas');
const signInput = document.getElementById('signInput');
const sign = { cfg: null, error: false, hoverDone: false, blinkOn: true, timer: null, layout: null };
const SIGN_W = 90;   // largeur max d'une ligne de texte sur le panneau (pixels GUI)

// Fait tenir le texte dans le panneau : une ligne trop longue passe à la ligne suivante
// (coupure au dernier espace si possible), et ce qui dépasse la dernière ligne est coupé.
// caret = position du curseur, ajustée si des caractères sont ajoutés ou retirés avant lui.
function fitSignText(text, caret = text.length) {
  if (sign.cfg.book) {   // livre : retour à la ligne visuel seulement ; au-delà de la page, on coupe la fin
    while (bookRows(text).length > bookCapacity(sign.cfg)) text = text.slice(0, -1);
    return { text, caret: Math.min(caret, text.length) };
  }
  const max = sign.cfg.lines, SIGN_TEXT_W = sign.cfg.width || SIGN_W;
  for (let guard = 0; guard < 200; guard++) {
    const lines = text.split('\n');
    const i = lines.findIndex(l => textWidth(font, l) > SIGN_TEXT_W);
    if (i < 0) break;
    const start = lines.slice(0, i).reduce((n, l) => n + l.length + 1, 0), line = lines[i];
    let k = 0;
    while (k < line.length && textWidth(font, line.slice(0, k + 1)) <= SIGN_TEXT_W) k++;
    if (lines.length < max) {
      const sp = line.lastIndexOf(' ', k);
      if (sp > 0) text = text.slice(0, start + sp) + '\n' + text.slice(start + sp + 1);   // espace -> retour à la ligne
      else { text = text.slice(0, start + k) + '\n' + text.slice(start + k); if (caret > start + k) caret++; }
    } else {
      const cut = line.length - k;   // plus de ligne libre : on coupe
      text = text.slice(0, start + k) + text.slice(start + line.length);
      if (caret > start + k) caret = Math.max(start + k, caret - cut);
    }
  }
  const lines = text.split('\n');
  if (lines.length > max) text = lines.slice(0, max).join('\n');
  return { text, caret: Math.min(caret, text.length) };
}

function signScale() {
  return Math.max(1, Math.min(5, Math.floor(viewH() / 215), Math.floor(viewW() / 112)));
}

function renderSign() {
  const cfg = sign.cfg;
  if (cfg.book) return renderBook();
  const S = signScale();
  signCanvas.width = viewW();
  signCanvas.height = viewH();
  const ctx = signCanvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const W = Math.floor(viewW() / S), H = Math.floor(viewH() / S);
  ctx.fillStyle = 'rgba(16, 16, 16, 0.35)';
  ctx.fillRect(0, 0, signCanvas.width, signCanvas.height);
  const centered = (text, y, color, shadow) => drawText(ctx, font, text, Math.floor(W / 2 - textWidth(font, text) / 2), y, color, S, shadow);

  const top = Math.max(8, Math.floor((H - 200) / 2));
  centered(cfg.title, top, '#FFFFFF', true);

  // Panneau en chêne : face avant (24x12 texels) + poteau (2x14 texels), agrandis 4x.
  const bx = Math.floor(W / 2) - 48, by = top + 28;
  ctx.drawImage(T.oak, 2, 2, 24, 12, bx * S, by * S, 96 * S, 48 * S);
  ctx.drawImage(T.oak, 2, 16, 2, 14, (Math.floor(W / 2) - 4) * S, (by + 48) * S, 8 * S, 56 * S);

  // Ligne active = celle du curseur, encadrée par > <, avec un curseur clignotant.
  const text = signInput.value;
  const caret = signInput.selectionStart ?? text.length;
  const before = text.slice(0, caret).split('\n');
  const activeLine = before.length - 1, col = before[activeLine].length;
  const typed = text.split('\n');
  for (let i = 0; i < 4; i++) {
    const y = by + 5 + i * 10;
    const color = sign.error && i < cfg.lines ? '#AA0000' : '#000000';
    if (i >= cfg.lines) { if (cfg.fixed[i]) centered(cfg.fixed[i], y, '#000000', false); continue; }
    const line = typed[i] || '';
    if (i !== activeLine) { centered(line, y, color, false); continue; }
    const atEnd = col === line.length;
    const shown = `> ${line}${atEnd ? (sign.blinkOn ? '_' : ' ') : ''} <`;
    centered(shown, y, color, false);
    if (!atEnd && sign.blinkOn) {   // curseur au milieu du texte : barre verticale
      const x = Math.floor(W / 2 - textWidth(font, shown) / 2) + textWidth(font, '> ' + line.slice(0, col)) - 1;
      ctx.fillStyle = color;
      ctx.fillRect(x * S, (y - 1) * S, S, 9 * S);
    }
  }

  const btnW = Math.min(200, W - 16);
  const btnX = Math.floor(W / 2) - Math.floor(btnW / 2), btnY = Math.min(H - 24, by + 48 + 56 + 16);
  drawButton(ctx, btnX, btnY, btnW, 'Terminé', sign.hoverDone, S);

  sign.layout = { S, board: [bx, by, 96, 48], button: [btnX, btnY, btnW, 20] };
  Object.assign(signInput.style, { left: bx * S + 'px', top: by * S + 'px', width: 96 * S + 'px', height: 48 * S + 'px' });
}

// --- Livre (comme l'écran d'écriture d'un livre de Minecraft) ---
// Même saisie que le panneau (cfg.book = true) ; un gros point est dessiné devant chaque ligne écrite.
const BOOK_LINES = 14, BOOK_TEXT_W = 104;
const BOOK_PAGES = 50;   // quand une page est pleine, le texte continue sur la suivante (flèches pour naviguer)
const bookCapacity = cfg => cfg.lines * BOOK_PAGES;
// Lignes d'écriture disponibles sous un titre (un titre sur plusieurs lignes en prend).
const bookLinesFor = title => BOOK_LINES - (wrapText(title, 118).length - 1);
// Découpe le texte en lignes affichées : un objectif (ligne du texte) trop long continue sur la ligne
// suivante (coupure entre les mots), sans nouveau point. Renvoie [{ text, start, bullet }].
function bookRows(text) {
  const rows = [];
  let offset = 0;
  for (const line of text.split('\n')) {
    let pos = 0, first = true;
    do {
      let end = line.length;
      if (textWidth(font, line.slice(pos)) > BOOK_TEXT_W) {
        end = pos;
        while (end < line.length && textWidth(font, line.slice(pos, end + 1)) <= BOOK_TEXT_W) end++;
        const sp = line.lastIndexOf(' ', end);
        if (sp > pos) end = sp + 1;   // coupe après l'espace
      }
      rows.push({ text: line.slice(pos, end), start: offset + pos, bullet: first && line.trim() !== '' });
      pos = end;
      first = false;
    } while (pos < line.length);
    offset += line.length + 1;
  }
  return rows;
}
function renderBook() {
  const cfg = sign.cfg;
  // téléphone en portrait : le livre (192 de large) peut occuper presque toute la largeur
  const S = Math.max(1, Math.min(5, Math.floor(viewH() / 228), Math.floor(viewW() / (isMobileLayout() ? 194 : 200))));
  const { ctx, W, H } = prepareScreen(signCanvas, S);
  const left = Math.floor((W - 192) / 2), top = Math.max(2, Math.floor((H - 222) / 2));
  ctx.drawImage(T.book_gui, 0, 0, 192, 192, left * S, top * S, 192 * S, 192 * S);
  // Titre en haut de la page (à la place de « Page 1 of 1 »), centré ; un titre long passe sur plusieurs lignes
  // et le texte commence d'autant plus bas.
  const titleLines = wrapText(cfg.title, 118);
  titleLines.forEach((l, i) => drawText(ctx, font, l, left + 94 - Math.floor(textWidth(font, l) / 2), top + 16 + i * 9, '#000000', S));
  const textTop = top + 32 + (titleLines.length - 1) * 9;

  const text = signInput.value, rows = bookRows(text);
  const caret = signInput.selectionStart ?? text.length;
  // ligne affichée qui contient le curseur (la dernière qui commence avant lui)
  let active = 0;
  rows.forEach((r, i) => { if (r.start <= caret) active = i; });
  const tx = left + 36 + (cfg.noBullets ? 0 : 8);
  // Pages : la page affichée est celle du curseur ; ligne i -> page floor(i / lignes par page).
  const per = cfg.lines, page = Math.floor(active / per), pages = Math.max(1, Math.ceil(rows.length / per));
  const onPage = i => i >= page * per && i < (page + 1) * per;
  const rowY = i => textTop + (i - page * per) * 9;
  // Exemples en filigrane (cfg.placeholders) : l'exemple n°k est affiché tant que la ligne n°k n'est pas écrite ;
  // les exemples restants se placent sous le texte déjà écrit.
  if (cfg.placeholders) {
    const lines = text.split('\n');
    const lastEmpty = !lines[lines.length - 1].trim();
    const written = lines.filter(l => l.trim()).length;   // les lignes sautées (Maj + Entrée) ne consomment pas d'exemple
    const firstRow = lastEmpty ? rows.length - 1 : rows.length;
    const ph = cfg.placeholders.slice(written).flatMap(ex => wrapText(ex, BOOK_TEXT_W).map((t, j) => ({ t, bullet: j === 0 })));
    ph.forEach((p, j) => {
      const i = firstRow + j;
      if (!onPage(i)) return;
      const y = rowY(i), faded = 'rgba(0, 0, 0, 0.22)';
      if (p.bullet && !cfg.noBullets) { ctx.fillStyle = faded; ctx.fillRect((tx - 7) * S, (y + 2) * S, 3 * S, 3 * S); }
      drawText(ctx, font, p.t, tx, y, faded, S);
    });
  }
  rows.forEach((row, i) => {
    if (!onPage(i)) return;
    const y = rowY(i);
    if (row.bullet && !cfg.noBullets) {   // gros point à gauche de chaque objectif
      ctx.fillStyle = '#000000';
      ctx.fillRect((tx - 7) * S, (y + 2) * S, 3 * S, 3 * S);
    }
    const shown = row.text.replace(/ $/, '');
    drawText(ctx, font, shown, tx, y, '#000000', S);
    if (i === active && sign.blinkOn) {
      const col = caret - row.start;
      if (col >= shown.length) drawText(ctx, font, '_', tx + textWidth(font, row.text.slice(0, col)), y, '#000000', S);
      else { ctx.fillStyle = '#000000'; ctx.fillRect((tx + textWidth(font, row.text.slice(0, col)) - 1) * S, (y - 1) * S, S, 9 * S); }
    }
  });

  // Flèches de page (textures du jeu) et numéro de page, comme dans l'écran d'un livre de Minecraft.
  const back = page > 0 ? [left + 43, top + 159, 23, 13] : null;
  const fwd = page < pages - 1 ? [left + 116, top + 159, 23, 13] : null;
  if (back) ctx.drawImage(sign.hoverBack ? T.page_backward_highlighted : T.page_backward, back[0] * S, back[1] * S, 23 * S, 13 * S);
  if (fwd) ctx.drawImage(sign.hoverFwd ? T.page_forward_highlighted : T.page_forward, fwd[0] * S, fwd[1] * S, 23 * S, 13 * S);
  if (pages > 1) {
    const label = `${page + 1}/${pages}`;
    drawText(ctx, font, label, left + 91 - Math.floor(textWidth(font, label) / 2), top + 162, '#000000', S);
  }
  sign.pages = { rows, per, page, back, fwd };

  // « Terminé » ; avec cfg.onExtra, un 2e bouton « Timeblock » à droite.
  const btnW = 64, gap = 4, btnY = Math.min(H - 22, top + 196);
  const btnX = cfg.onExtra ? Math.floor(W / 2) - btnW - gap / 2 : Math.floor(W / 2) - btnW / 2, btn2X = Math.floor(W / 2) + gap / 2;
  drawButton(ctx, btnX, btnY, btnW, 'Terminé', sign.hoverDone, S);
  if (cfg.onExtra) drawButton(ctx, btn2X, btnY, btnW, 'Timeblock', sign.hoverExtra, S);
  sign.layout = { S, board: [left + 36, textTop - 2, 118, cfg.lines * 9], button: [btnX, btnY, btnW, 20], button2: cfg.onExtra ? [btn2X, btnY, btnW, 20] : null };
  Object.assign(signInput.style, { left: (left + 36) * S + 'px', top: (textTop - 2) * S + 'px', width: 118 * S + 'px', height: cfg.lines * 9 * S + 'px' });
}

function inRect(ev, [x, y, w, h], S = sign.layout.S) {
  const gx = evX(ev) / S, gy = evY(ev) / S;
  return gx >= x && gx < x + w && gy >= y && gy < y + h;
}

// Bouton Minecraft (texture 200x20) en pixels GUI ; plus étroit : on garde les deux bords de la texture.
function drawButton(ctx, x, y, w, label, hover, S) {
  const half = Math.floor(w / 2), tex = hover ? T.button_highlighted : T.button;
  ctx.drawImage(tex, 0, 0, half, 20, x * S, y * S, half * S, 20 * S);
  ctx.drawImage(tex, 200 - (w - half), 0, w - half, 20, (x + half) * S, y * S, (w - half) * S, 20 * S);
  drawText(ctx, font, label, x + Math.floor(w / 2 - textWidth(font, label) / 2), y + 6, '#FFFFFF', S, true);
}

// Fond assombri commun aux écrans plein écran ; renvoie la taille en pixels GUI.
function prepareScreen(cv, S) {
  cv.width = viewW();
  cv.height = viewH();
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = 'rgba(16, 16, 16, 0.35)';
  ctx.fillRect(0, 0, cv.width, cv.height);
  return { ctx, W: Math.floor(viewW() / S), H: Math.floor(viewH() / S) };
}

function openSign(cfg) {
  sign.cfg = { fixed: [], transform: t => t, validate: () => true, ...cfg };
  sign.error = false;
  sign.hoverDone = false;
  sign.hoverExtra = false;
  signInput.inputMode = cfg.numeric === true ? 'numeric' : cfg.numeric || 'text';   // 'decimal' : chiffres + virgule
  signInput.value = fitSignText(sign.cfg.transform(cfg.initial || '')).text;
  hideTooltip();
  canvas.hidden = true;
  signScreen.hidden = false;
  sign.blinkOn = true;
  clearInterval(sign.timer);
  sign.timer = setInterval(() => { sign.blinkOn = !sign.blinkOn; renderSign(); }, 300);
  signInput.focus();
  signInput.setSelectionRange(signInput.value.length, signInput.value.length);
  renderSign();
}

function closeSign() {
  clearInterval(sign.timer);
  signScreen.hidden = true;
  canvas.hidden = false;
  sign.cfg = null;
  renderGui();
}

function finishSign() {
  const cfg = sign.cfg, text = signInput.value;
  if (!cfg.validate(text)) {
    sign.error = true;
    renderSign();
    signInput.focus();
    return;
  }
  closeSign();
  cfg.onDone(text);   // peut ouvrir un autre panneau (ex. titre puis description)
}

signInput.addEventListener('input', () => {
  const raw = sign.cfg.transform(signInput.value);
  const { text, caret } = fitSignText(raw, signInput.selectionStart + raw.length - signInput.value.length);
  if (text !== signInput.value) {
    signInput.value = text;
    signInput.setSelectionRange(caret, caret);
  }
  sign.error = false;
  sign.blinkOn = true;
  renderSign();
});
// Le curseur bouge (flèches, clic) : redessine la ligne active.
document.addEventListener('selectionchange', () => { if (sign.cfg) { sign.blinkOn = true; renderSign(); } });
signInput.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { ev.preventDefault(); const cfg = sign.cfg; closeSign(); if (cfg.onCancel) cfg.onCancel(); return; }
  if (ev.key !== 'Enter') return;
  // Livre : Maj + Entrée saute toujours une ligne (jamais « Terminé »), s'il reste de la place sur la page.
  if (sign.cfg.book && ev.shiftKey) {
    ev.preventDefault();
    const v = signInput.value, a = signInput.selectionStart, b = signInput.selectionEnd;
    const next = v.slice(0, a) + '\n' + v.slice(b);
    if (bookRows(next).length <= bookCapacity(sign.cfg)) {
      signInput.value = next;
      signInput.setSelectionRange(a + 1, a + 1);
      sign.blinkOn = true;
      renderSign();
    }
    return;
  }
  // Entrée : ligne suivante s'il en reste, sinon « Terminé ».
  const lineCount = sign.cfg.book ? bookRows(signInput.value).length : signInput.value.split('\n').length;
  if (lineCount < (sign.cfg.book ? bookCapacity(sign.cfg) : sign.cfg.lines) && !ev.shiftKey) return;
  ev.preventDefault();
  playClick();
  finishSign();
});
signCanvas.addEventListener('mousemove', ev => {
  if (!sign.layout) return;
  const hover = inRect(ev, sign.layout.button);
  const hover2 = !!sign.layout.button2 && inRect(ev, sign.layout.button2);
  const pg = sign.cfg && sign.cfg.book && sign.pages;
  const hb = !!(pg && pg.back && inRect(ev, pg.back)), hf = !!(pg && pg.fwd && inRect(ev, pg.fwd));
  if (hb !== !!sign.hoverBack || hf !== !!sign.hoverFwd) { sign.hoverBack = hb; sign.hoverFwd = hf; renderSign(); }
  signCanvas.style.cursor = hover || hover2 || hb || hf ? 'pointer' : '';
  if (hover !== sign.hoverDone || hover2 !== !!sign.hoverExtra) { sign.hoverDone = hover; sign.hoverExtra = hover2; renderSign(); }
});
signCanvas.addEventListener('click', ev => {
  const pg = sign.cfg && sign.cfg.book && sign.pages;
  const turn = pg && (pg.back && inRect(ev, pg.back) ? -1 : pg.fwd && inRect(ev, pg.fwd) ? 1 : 0);
  if (turn) {   // changer de page : le curseur va au début de la page visée
    playClick();
    const row = pg.rows[(pg.page + turn) * pg.per];
    signInput.focus();
    if (row) signInput.setSelectionRange(row.start, row.start);
    sign.blinkOn = true;
    renderSign();
    return;
  }
  if (sign.layout && inRect(ev, sign.layout.button)) { playClick(); finishSign(); }
  else if (sign.layout && sign.layout.button2 && inRect(ev, sign.layout.button2)) {
    playClick();
    const cfg = sign.cfg, text = signInput.value;
    if (cfg.onExtra) { closeSign(); cfg.onExtra(text); }   // ex. ouvrir le Timeblock de la journée
    else signInput.focus();
  }
  else signInput.focus();
});

// Panneau de la date d'entrée : chiffres seulement, "12032026" -> "12/03/2026".
function formatDigits(d) {
  return d.slice(0, 2) + (d.length > 2 ? '/' + d.slice(2, 4) : '') + (d.length > 4 ? '/' + d.slice(4, 8) : '');
}
const onlyDigits = t => t.replace(/\D/g, '').slice(0, 8);
function isValidDate(d) {
  if (d.length !== 8) return false;
  const day = +d.slice(0, 2), month = +d.slice(2, 4), year = +d.slice(4);
  const dt = new Date(year, month - 1, day);
  return year >= 1900 && year <= 2100 && dt.getFullYear() === year && dt.getMonth() === month - 1 && dt.getDate() === day;
}
function openDateSign(field) {
  const f = DATE_FIELDS[field];
  openSign({
    title: f.title,
    lines: 1, fixed: ['', '^^^^^^^^^^^^', f.label, 'JJ/MM/AAAA'],
    numeric: true,
    initial: dates[field] || '',
    transform: t => formatDigits(onlyDigits(t)),
    validate: t => !onlyDigits(t) || isValidDate(onlyDigits(t)),   // vide = effacer la date
    onDone: t => {
      const d = onlyDigits(t);
      if (d) dates[field] = formatDigits(d);
      else delete dates[field];
      saveDates();
    },
  });
}

// --- Question oui / non (comme l'écran de confirmation de Minecraft) ---
const dialogScreen = document.getElementById('dialogScreen');
const dialogCanvas = document.getElementById('dialogCanvas');
const dialog = { cfg: null, hover: null, layout: null };

function renderConfirm() {
  const S = signScale();
  const { ctx, W, H } = prepareScreen(dialogCanvas, S);
  const centered = (text, y, color) => drawText(ctx, font, text, Math.floor(W / 2 - textWidth(font, text) / 2), y, color, S, true);
  const lines = dialog.cfg.detail || [];
  // Hauteur totale (question, détails, nuancier, boutons) pour centrer le tout verticalement
  const total = 16 + lines.length * 10 + (dialog.cfg.colors ? 36 : 0) + 14 + 20
    + (dialog.cfg.onEdit ? 24 : 0) + (dialog.cfg.onDelete ? 24 : 0);
  let y = Math.max(4, Math.floor((H - total) / 2));
  centered(dialog.cfg.question, y, '#FFFFFF');
  y += 16;
  for (const line of lines) { centered(line, y, '#AAAAAA'); y += 10; }
  // Nuancier (cfg.colors = { list, current(), onPick(i) }) : 2 rangées de cases de couleur, la choisie encadrée de blanc.
  let swatches = null;
  if (dialog.cfg.colors) {
    const { list, current } = dialog.cfg.colors, perRow = Math.ceil(list.length / 2), size = 12, gap = 2;
    const x0 = Math.floor(W / 2 - (perRow * (size + gap) - gap) / 2);
    y += 8;
    swatches = list.map((color, i) => {
      const r = [x0 + (i % perRow) * (size + gap), y + Math.floor(i / perRow) * (size + gap), size, size];
      if (i === current()) { ctx.fillStyle = '#FFFFFF'; ctx.fillRect((r[0] - 1) * S, (r[1] - 1) * S, (size + 2) * S, (size + 2) * S); }
      drawColorBlock(ctx, r[0], r[1], size, size, color, S);
      if (dialog.hover === 'color' + i) { ctx.fillStyle = 'rgba(255, 255, 255, 0.35)'; ctx.fillRect(r[0] * S, r[1] * S, size * S, size * S); }
      return r;
    });
    y += 2 * (size + gap);
  }
  const bw = Math.min(dialog.cfg.buttonWidth || 90, Math.floor((W - 20) / 2)), by = y + 14;
  const no = [Math.floor(W / 2) - bw - 4, by, bw, 20], yes = [Math.floor(W / 2) + 4, by, bw, 20];
  // Sous Non / Oui, sur toute leur largeur : « Modifier » (si prévu) puis « Supprimer ».
  let rowY = by + 24;
  const edit = dialog.cfg.onEdit ? [no[0], rowY, 2 * bw + 8, 20] : null;
  if (edit) rowY += 24;
  const del = [no[0], rowY, 2 * bw + 8, 20];
  drawButton(ctx, ...no.slice(0, 3), dialog.cfg.noLabel || 'Non', dialog.hover === 'no', S);
  drawButton(ctx, ...yes.slice(0, 3), dialog.cfg.yesLabel || 'Oui', dialog.hover === 'yes', S);

  if (dialog.cfg.onDelete) drawButton(ctx, ...del.slice(0, 3), '§cSupprimer', dialog.hover === 'del', S);
  dialog.layout = { S, no, yes, edit, del: dialog.cfg.onDelete ? del : null, swatches };
}
function openConfirm(cfg) {
  dialog.cfg = cfg;
  dialog.hover = null;
  hideTooltip();
  canvas.hidden = true;

}
function closeConfirm() {

}
dialogCanvas.addEventListener('mousemove', ev => {
  const { S, no, yes, edit, del, swatches } = dialog.layout;
  const sw = swatches ? swatches.findIndex(r => inRect(ev, r, S)) : -1;
  const hover = sw >= 0 ? 'color' + sw : inRect(ev, no, S) ? 'no' : inRect(ev, yes, S) ? 'yes' : edit && inRect(ev, edit, S) ? 'edit' : del && inRect(ev, del, S) ? 'del' : null;

dialogCanvas.addEventListener('click', ev => {

  if (edit && inRect(ev, edit, S)) { playClick(); closeConfirm(); cfg.onEdit(); return; }
  if (inRect(ev, no, S)) { playClick(); closeConfirm(); if (cfg.onNo) cfg.onNo(); }
  else if (inRect(ev, yes, S)) { playClick(); closeConfirm(); cfg.onYes(); }

addEventListener('keydown', ev => {
