<!DOCTYPE html>

                url('assets/background.webp') center / cover no-repeat;

    image-rendering: crisp-edges;
  }
</style>

<body>
<canvas id="gui"></canvas>
<canvas id="tooltip" hidden></canvas>
<script>
// Interface "Profil Joueur" (coffre 6x9) reconstruite avec les textures Minecraft 1.20.4.
const TEX = 'assets/textures/';
const GUI_W = 176;
const GUI_H = 132;          // 125 lignes du haut de generic_54 + 7 lignes de bordure basse
const ROWS = 6, COLS = 9;
const ITEM_SCALE = 0.85;   // taille des items (hors vitres) par rapport à la case

// Pages de l'interface. Chaque page : un titre + le contenu des cases (ligne, colonne) ;
// les cases absentes = vitre teintée noire.
//   item / block / head : l'item affiché ;  pane : vitre colorée décorative (pas un item, pas d'overlay)
//   tooltip : lignes de l'overlay au survol (1re ligne = nom). Codes couleur Minecraft : §a vert, §7 gris, §e jaune…
//   open : page ouverte au clic
// Contenu provisoire, à remplacer par les vrais textes.
const LORE = ['§7Description à venir.', '', '§eClique pour voir !'];
const PAGES = {
  main: {
    title: 'Profil Joueur',
    slots: {
      '1,4': { head: 'profile', tooltip: ['§aTon profil', ...LORE] },
      '2,1': { item: 'diamond_sword', tooltip: ['§aCompétences', ...LORE] },
      '2,4': { item: 'book', tooltip: ['§aSerments S', ...LORE], open: 'serments' },
      '2,5': { item: 'clock_00', tooltip: ['§aAgenda de la journée', ...LORE] },
      '2,6': { item: 'paper', tooltip: ['§aTo-Do', ...LORE] },
    },
  },
  serments: {
    title: 'Serments S',
    slots: {
      '0,4': { item: 'painting', tooltip: ['§aSerments S', ...LORE] },
      '1,1': { item: 'book', tooltip: ['§aSerment S 1 - 12K/Mois', ...LORE] },
      '1,3': { pane: 'lime_stained_glass' },
      '1,4': { pane: 'yellow_stained_glass' },
      '1,5': { pane: 'red_stained_glass' },
      '1,6': { pane: 'red_stained_glass' },
      '1,7': { pane: 'red_stained_glass' },
      '3,1': { item: 'book', tooltip: ['§aSerment S 2 - 75Kg Sec', ...LORE] },
      '3,3': { pane: 'lime_stained_glass' },
      '3,4': { pane: 'yellow_stained_glass' },
      '3,5': { pane: 'red_stained_glass' },
      '3,6': { pane: 'red_stained_glass' },
      '3,7': { pane: 'red_stained_glass' },
      '5,4': { item: 'barrier', tooltip: ['§cFermer', '', '§eClique pour revenir au menu !'], open: 'main' },
    },
  },
};

const FILES = [
  'generic_54', 'ascii', 'accented', 'black_stained_glass', 'normal',
  'diamond_sword', 'painting', 'book', 'writable_book', 'clock_00', 'bone',
  'name_tag', 'barrier', 'redstone_torch', 'cookie', 'paper',
  'arrow', 'green_dye', 'lime_dye', 'lime_stained_glass', 'yellow_stained_glass', 'red_stained_glass',
  'crafting_table_top', 'crafting_table_front', 'crafting_table_side',
  'barrel_top', 'barrel_side',
];

function load(name) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res([name, img]);
    img.onerror = rej;
    img.src = TEX + name + '.png';
  });
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  return [c, ctx];
}

// Découpe une zone d'une texture (ex. le coffre) vers une nouvelle texture.
function crop(img, x, y, w, h) {
  const [c, ctx] = makeCanvas(w, h);
  ctx.drawImage(img, x, y, w, h, 0, 0, w, h);
  return c;
}

// Texture de tête 8x8 à partir d'une palette et d'une grille de caractères.
function pixelTex(palette, rows) {
  const [c, ctx] = makeCanvas(8, 8);
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    ctx.fillStyle = palette[ch];
    ctx.fillRect(x, y, 1, 1);
  }));
  return c;
}

// Faces des têtes personnalisées (top / front / side).
const HEADS = {
  profile: (() => {
    const p = { k: '#0d0f1c', n: '#1b2140', b: '#2a3566', g: '#3fd13f', G: '#1f8a2a', s: '#10131f' };
    return {
      top:   pixelTex(p, ['kknnnnkk', 'knnbbnnk', 'nnbbbbnn', 'nbbnnbbn', 'nbbnnbbn', 'nnbbbbnn', 'knnbbnnk', 'kknnnnkk']),
      front: pixelTex(p, ['kknnnnkk', 'knbbbbnk', 'nsssssbn', 'nsgssgsn', 'nsGssGsn', 'nsssssbn', 'knsGGsnk', 'kknnnnkk']),
      side:  pixelTex(p, ['kknnnnkk', 'knnbbnnk', 'nnbbbnnn', 'nbbnnnbn', 'nbnnnnbn', 'nnbbnnnn', 'knnnnnnk', 'kknnnnkk']),
    };
  })(),
  emerald: (() => {
    const p = { d: '#1f5a19', m: '#3f8f23', l: '#6cc43a', y: '#d7d23c', o: '#8f6a1f' };
    const f = ['dmmlmmmd', 'mlldmylm', 'mlmmlmmm', 'lmyomldm', 'mmomlmml', 'mdlmmlom', 'mlmydmlm', 'dmmmmmmd'];
    return { top: pixelTex(p, f), front: pixelTex(p, [...f].reverse()), side: pixelTex(p, f.map(r => [...r].reverse().join(''))) };
  })(),
  box: (() => {
    const p = { e: '#6b4a2e', b: '#c8a37a', l: '#e2c6a0', r: '#c42b2b', R: '#ff5c5c', d: '#9c7650' };
    return {
      top:   pixelTex(p, ['eeeeeeee', 'ellllble', 'elbbbbbe', 'elbddbbe', 'ebbddbbe', 'ebbbbble', 'elbblble', 'eeeeeeee']),
      front: pixelTex(p, ['eeeeeeee', 'ebbbbbbe', 'ebbddbbe', 'ebdrrdbe', 'ebdrRdbe', 'ebbddbbe', 'ebbbbbbe', 'eeeeeeee']),
      side:  pixelTex(p, ['eeeeeeee', 'ebbbbbbe', 'ebdbbbbe', 'ebbbbdbe', 'ebbdbbbe', 'ebbbbbbe', 'ebbbdbbe', 'eeeeeeee']),
    };
  })(),
  rune: (() => {
    const p = { k: '#241a12', b: '#3b2b1d', m: '#56402b', w: '#d8cbb6', g: '#8c7a62' };
    return {
      top:   pixelTex(p, ['kbbbbbbk', 'bmbmmbmb', 'bbmbbmbb', 'bmbmmbmb', 'bmbmmbmb', 'bbmbbmbb', 'bmbmmbmb', 'kbbbbbbk']),
      front: pixelTex(p, ['kbbbbbbk', 'bbbwwbbb', 'bbwbbwbb', 'bbbwgwbb', 'bbwgwbbb', 'bbwbbwbb', 'bbbwwbbb', 'kbbbbbbk']),
      side:  pixelTex(p, ['kbbbbbbk', 'bbwbbbbb', 'bbbbgbbb', 'bgbbbbwb', 'bbbwbbbb', 'bbbbbgbb', 'bwbbbbbb', 'kbbbbbbk']),
    };
  })(),
  globe: (() => {
    const p = { o: '#2750b5', O: '#3d6fe0', g: '#3e9a2e', G: '#5cc043', w: '#e8f0ff', s: '#c9b56b' };
    return {
      top:   pixelTex(p, ['wwwOOwww', 'wwOOOOww', 'OOgOOOOO', 'OgGgOOgO', 'OOgOOgGO', 'OOOOOOgO', 'wOOOOOww', 'wwwOwwww']),
      front: pixelTex(p, ['OOgGgOOO', 'OgGGgOOO', 'OOgGsOgO', 'OOOgOGGO', 'OoOOOgGo', 'OogOOOgo', 'oOGgOOoo', 'ooOgooOo']),
      side:  pixelTex(p, ['OOOOgOOO', 'OgOOGGOO', 'OGgOOgOO', 'OOOOOOOO', 'OOgGOOOO', 'ooGgoOgo', 'oooooGgo', 'oOoooooo']),
    };
  })(),
};

// --- Police Minecraft : ascii.png (glyphes 8x8) + accented.png (glyphes 9x12, accents) ---
const MC_COLORS = {
  0: '#000000', 1: '#0000AA', 2: '#00AA00', 3: '#00AAAA', 4: '#AA0000', 5: '#AA00AA', 6: '#FFAA00', 7: '#AAAAAA',
  8: '#555555', 9: '#5555FF', a: '#55FF55', b: '#55FFFF', c: '#FF5555', d: '#FF55FF', e: '#FFFF55', f: '#FFFFFF',
};

// Largeur réelle d'un glyphe = dernière colonne non transparente + 1.
function glyphWidth(data, stride, gx, gy, cw, ch) {
  for (let x = cw - 1; x >= 0; x--)
    for (let y = 0; y < ch; y++)
      if (data[((gy + y) * stride + gx + x) * 4 + 3] > 0) return x + 1;
  return 0;
}

function buildFont(ascii, accented, accentedChars) {
  const glyphs = new Map();
  const read = img => {
    const [, ctx] = makeCanvas(img.width, img.height);
    ctx.drawImage(img, 0, 0);
    return ctx.getImageData(0, 0, img.width, img.height).data;
  };
  const a = read(ascii);
  for (let code = 32; code < 127; code++) {
    const sx = (code % 16) * 8, sy = Math.floor(code / 16) * 8;
    const w = code === 32 ? 3 : glyphWidth(a, ascii.width, sx, sy, 8, 8);
    glyphs.set(String.fromCharCode(code), { img: ascii, sx, sy, sw: 8, sh: 8, dy: 0, adv: w + 1 });
  }
  const b = read(accented);
  accentedChars.forEach((row, r) => [...row].forEach((chr, c) => {
    if (chr === '\u0000' || glyphs.has(chr)) return;
    const sx = c * 9, sy = r * 12;
    glyphs.set(chr, { img: accented, sx, sy, sw: 9, sh: 12, dy: -3, adv: glyphWidth(b, accented.width, sx, sy, 9, 12) + 1 });
  }));
  return { glyphs, tinted: new Map() };
}

// Découpe un texte avec codes § en segments { text, color, bold }.
function parseFormatted(text, defaultColor) {
  const segs = [];
  let color = defaultColor, bold = false, buf = '';
  const flush = () => { if (buf) segs.push({ text: buf, color, bold }); buf = ''; };
  for (let i = 0; i < text.length; i++) {
    if (text[i] === '§' && i + 1 < text.length) {
      const k = text[++i].toLowerCase();
      flush();
      if (MC_COLORS[k]) { color = MC_COLORS[k]; bold = false; }
      else if (k === 'l') bold = true;
      else if (k === 'r') { color = defaultColor; bold = false; }
    } else buf += text[i];
  }
  flush();
  return segs;
}

function glyphOf(font, chr) {
  return font.glyphs.get(chr) || font.glyphs.get('?');
}

function textWidth(font, text) {
  let w = 0;
  for (const seg of parseFormatted(text, '#fff'))
    for (const chr of seg.text) w += glyphOf(font, chr).adv + (seg.bold ? 1 : 0);
  return w;
}

// Glyphe teinté (mis en cache par caractère + couleur).
function tintedGlyph(font, g, color) {
  const key = `${g.img.width}:${g.sx}:${g.sy}:${color}`;
  let c = font.tinted.get(key);
  if (!c) {
    let ctx;
    [c, ctx] = makeCanvas(g.sw, g.sh);
    ctx.drawImage(g.img, g.sx, g.sy, g.sw, g.sh, 0, 0, g.sw, g.sh);
    ctx.globalCompositeOperation = 'source-in';
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, g.sw, g.sh);
    font.tinted.set(key, c);
  }
  return c;
}

function shadowColor(hex) {
  const n = parseInt(hex.slice(1), 16);
  const q = v => (v >> 2).toString(16).padStart(2, '0');
  return '#' + q((n >> 16) & 255) + q((n >> 8) & 255) + q(n & 255);
}

// Dessine un texte (coordonnées en pixels GUI) ; shadow = ombre portée comme en jeu.
function drawText(ctx, font, text, x, y, color, S, shadow = false) {
  const segs = parseFormatted(text, color);
  const pass = (ox, oy, isShadow) => {
    let cx = x;
    for (const seg of segs) {
      const col = isShadow ? shadowColor(seg.color) : seg.color;
      for (const chr of seg.text) {
        const g = glyphOf(font, chr);
        const img = tintedGlyph(font, g, col);
        for (let b = 0; b <= (seg.bold ? 1 : 0); b++)
          ctx.drawImage(img, (cx + ox + b) * S, (y + oy + g.dy) * S, g.sw * S, g.sh * S);
        cx += g.adv + (seg.bold ? 1 : 0);
      }
    }
  };
  if (shadow) pass(1, 1, true);
  pass(0, 0, false);
}

// --- Rendu isométrique des blocs (comme les items-blocs dans l'inventaire) ---
function drawFace(ctx, tex, origin, u, v, shade) {
  const tw = tex.width, th = tex.height;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(origin[0], origin[1]);
  ctx.lineTo(origin[0] + u[0], origin[1] + u[1]);
  ctx.lineTo(origin[0] + u[0] + v[0], origin[1] + u[1] + v[1]);
  ctx.lineTo(origin[0] + v[0], origin[1] + v[1]);
  ctx.closePath();
  ctx.clip();
  ctx.setTransform(u[0] / tw, u[1] / tw, v[0] / th, v[1] / th, origin[0], origin[1]);
  // léger débordement pour éviter les joints entre les faces
  ctx.drawImage(tex, -0.15, -0.15, tw + 0.3, th + 0.3);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (shade < 1) {
    ctx.fillStyle = `rgba(0,0,0,${1 - shade})`;
    ctx.fill();
  }
  ctx.restore();
}

function drawCube(ctx, faces, px, py, S, scale = 1) {
  // Géométrie dans une case de 16x16 pixels GUI, centrée.
  const k = S * scale, cx = px + 8 * S, cy = py + 8.5 * S;
  const P = (x, y) => [cx + x * k, cy + y * k];
  const L = P(-7, -4), T = P(0, -7.5), R = P(7, -4), C = P(0, -0.5), D = [0, 8 * k];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  drawFace(ctx, faces.top,   L, sub(T, L), sub(C, L), 1.0);
  drawFace(ctx, faces.front, L, sub(C, L), D, 0.8);
  drawFace(ctx, faces.side,  C, sub(R, C), D, 0.6);
}

function chestFaces(img) {
  const top = crop(img, 28, 0, 14, 14);
  const [front, fctx] = makeCanvas(14, 14);
  fctx.drawImage(img, 42, 14, 14, 5, 0, 0, 14, 5);    // couvercle
  fctx.drawImage(img, 42, 34, 14, 9, 0, 5, 14, 9);    // base
  fctx.drawImage(img, 1, 1, 2, 4, 6, 2, 2, 4);        // loquet
  const [side, sctx] = makeCanvas(14, 14);
  sctx.drawImage(img, 28, 14, 14, 5, 0, 0, 14, 5);
  sctx.drawImage(img, 28, 34, 14, 9, 0, 5, 14, 9);
  return { top, front, side };
}

// --- Overlay (tooltip) au survol d'un item ---
const TOOLTIP_BG = 'rgba(10, 18, 30, 0.93)';
const TOOLTIP_BORDER_TOP = '#b9c9da', TOOLTIP_BORDER_BOTTOM = '#6d7f94';
const TOOLTIP_PADDING = 4;   // marge entre la bordure et le texte (pixels GUI)
// Échelle du texte de l'overlay : plus petite que celle de l'interface.
const tooltipScale = S => Math.max(2, Math.round(S * 0.65));

function renderTooltip(tipCanvas, font, lines, S) {
  const w = Math.max(...lines.map(l => textWidth(font, l)));
  const h = 8 + (lines.length - 1) * 10 + (lines.length > 1 ? 2 : 0);
  const edge = 2 + TOOLTIP_PADDING;           // fond (1 px) + bordure (1 px) + marge intérieure
  const W = w + 1 + 2 * edge, H = h + 1 + 2 * edge;   // +1 : ombre du texte
  const x0 = edge, y0 = edge;
  tipCanvas.width = W * S;
  tipCanvas.height = H * S;
  const ctx = tipCanvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const rect = (x, y, rw, rh, fill) => { ctx.fillStyle = fill; ctx.fillRect(x * S, y * S, rw * S, rh * S); };

  // Fond aux coins "coupés" + bordure intérieure en dégradé, comme en jeu.
  rect(1, 0, W - 2, H, TOOLTIP_BG);
  rect(0, 1, 1, H - 2, TOOLTIP_BG);
  rect(W - 1, 1, 1, H - 2, TOOLTIP_BG);
  const grad = ctx.createLinearGradient(0, S, 0, (H - 1) * S);
  grad.addColorStop(0, TOOLTIP_BORDER_TOP);
  grad.addColorStop(1, TOOLTIP_BORDER_BOTTOM);
  rect(1, 1, W - 2, 1, TOOLTIP_BORDER_TOP);
  rect(1, H - 2, W - 2, 1, TOOLTIP_BORDER_BOTTOM);
  rect(1, 2, 1, H - 4, grad);
  rect(W - 2, 2, 1, H - 4, grad);

  let y = y0;
  lines.forEach((line, i) => {
    drawText(ctx, font, line, x0, y, '#FFFFFF', S, true);
    y += 10 + (i === 0 ? 2 : 0);
  });
}

const state = { S: 3, hovered: null, page: 'main' };
const currentSlots = () => PAGES[state.page].slots;
// Une case est un item (survol, overlay, clic) sauf les vitres.
const itemAt = key => { const slot = key && currentSlots()[key]; return slot && !slot.pane ? slot : null; };
let T, font, BLOCKS;
const canvas = document.getElementById('gui');
const tip = document.getElementById('tooltip');

function renderGui() {
  const S = state.S;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Fond du coffre : haut de generic_54 (titre + 6 rangées) + bordure arrondie du bas.
  ctx.drawImage(T.generic_54, 0, 0, GUI_W, 125, 0, 0, GUI_W * S, 125 * S);
  ctx.drawImage(T.generic_54, 0, 215, GUI_W, 7, 0, 125 * S, GUI_W * S, 7 * S);

  drawText(ctx, font, PAGES[state.page].title, 8, 6, '#404040', S);

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const px = (8 + c * 18) * S, py = (18 + r * 18) * S;
      const key = `${r},${c}`;
      const slot = currentSlots()[key];
      if (!slot) ctx.drawImage(T.black_stained_glass, px, py, 16 * S, 16 * S);
      else if (slot.pane) ctx.drawImage(T[slot.pane], px, py, 16 * S, 16 * S);
      else if (slot.item) {
        const size = 16 * S * ITEM_SCALE, off = (16 * S - size) / 2;
        ctx.drawImage(T[slot.item], px + off, py + off, size, size);
      }
      else if (slot.block) drawCube(ctx, BLOCKS[slot.block], px, py, S, (slot.block === 'chest' ? 0.9 : 1) * ITEM_SCALE);
      else if (slot.head) drawCube(ctx, HEADS[slot.head], px, py, S, 0.85 * ITEM_SCALE);

      // Surbrillance blanche de la case survolée, comme en jeu.
      if (key === state.hovered) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.fillRect(px, py, 16 * S, 16 * S);
      }
    }
  }
}

// Case (ligne, colonne) sous la souris, ou null.
function slotAt(ev) {
  const r = canvas.getBoundingClientRect();
  const gx = (ev.clientX - r.left) / state.S, gy = (ev.clientY - r.top) / state.S;
  const c = Math.floor((gx - 7) / 18), row = Math.floor((gy - 17) / 18);
  if (c < 0 || c >= COLS || row < 0 || row >= ROWS) return null;
  return `${row},${c}`;
}

function placeTooltip(ev) {
  const S = state.S, margin = 4;
  let x = ev.clientX + 12 * S, y = ev.clientY - 12 * S;
  if (x + tip.width > innerWidth - margin) x = ev.clientX - 12 * S - tip.width;
  y = Math.max(margin, Math.min(y, innerHeight - tip.height - margin));
  tip.style.left = Math.max(margin, x) + 'px';
  tip.style.top = y + 'px';
}

function onMove(ev) {
  const key = slotAt(ev);
  const slot = itemAt(key);
  const hovered = slot ? key : null;
  if (hovered !== state.hovered) {
    state.hovered = hovered;
    renderGui();
    if (slot && slot.tooltip) {
      renderTooltip(tip, font, slot.tooltip, tooltipScale(state.S));
      tip.hidden = false;
    } else tip.hidden = true;
    canvas.style.cursor = hovered ? 'pointer' : '';
  }
  if (!tip.hidden) placeTooltip(ev);
}

function onLeave() {
  state.hovered = null;
  tip.hidden = true;
  canvas.style.cursor = '';
  renderGui();
}

function hideTooltip() {
  state.hovered = null;
  tip.hidden = true;
  canvas.style.cursor = '';
}

// Navigation entre pages via l'ancre de l'URL (#serments), pour que "Précédent" du navigateur marche.
function showPageFromHash() {
  const page = location.hash.slice(1);
  state.page = PAGES[page] ? page : 'main';
  hideTooltip();
  renderGui();
}

// Son du dispenser Minecraft (block.dispenser.dispense = random/click).
const clickSound = new Audio('assets/sounds/click.mp3');
clickSound.preload = 'auto';
function playClick() {
  const s = clickSound.cloneNode();   // clone : permet des clics rapprochés qui se chevauchent
  s.play().catch(() => {});
}

function onClick(ev) {
  const slot = itemAt(slotAt(ev));
  if (!slot) return;
  playClick();
  if (!slot.open) return;
  if (slot.open === 'main') history.pushState(null, '', location.pathname + location.search);
  else location.hash = slot.open;
  showPageFromHash();
}

function resize() {
  state.S = Math.max(2, Math.min(5, Math.floor(Math.min(innerWidth / (GUI_W + 16), innerHeight / (GUI_H + 16)))));
  canvas.width = GUI_W * state.S;
  canvas.height = GUI_H * state.S;
  state.hovered = null;
  tip.hidden = true;
  renderGui();
}

async function main() {
  const [textures, accentedChars] = await Promise.all([
    Promise.all(FILES.map(load)),
    fetch(TEX + 'accented.json').then(r => r.json()),
  ]);
  T = Object.fromEntries(textures);
  font = buildFont(T.ascii, T.accented, accentedChars);
  BLOCKS = {
    chest: chestFaces(T.normal),
    crafting_table: { top: T.crafting_table_top, front: T.crafting_table_front, side: T.crafting_table_side },
    barrel: { top: T.barrel_top, front: T.barrel_side, side: T.barrel_side },
  };
  const page = location.hash.slice(1);
  state.page = PAGES[page] ? page : 'main';
  resize();
  addEventListener('resize', resize);
  addEventListener('popstate', showPageFromHash);
  canvas.addEventListener('click', onClick);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseleave', onLeave);
}

main();
</script>
</body>
</html>
